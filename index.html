/* ---------------- 自然语言建任务 ---------------- */
function parseQuickTask(text) {
  const s = String(text || '').trim();
  if (!s) return null;
  let rest = s, due = '', ownerIds = [], subsystemId = '';
  const dm = rest.match(/(\d{1,2})[\/\-月](\d{1,2})日?/);
  if (dm) {
    const y = new Date().getFullYear();
    due = `${y}-${String(dm[1]).padStart(2, '0')}-${String(dm[2]).padStart(2, '0')}`;
    rest = rest.replace(dm[0], ' ');
  } else if (/后天/.test(rest)) { due = addDays(today(), 2); rest = rest.replace(/后天/, ' '); }
  else if (/明天/.test(rest)) { due = addDays(today(), 1); rest = rest.replace(/明天/, ' '); }
  else if (/今天/.test(rest)) { due = today(); rest = rest.replace(/今天/, ' '); }
  const m = state.members.find(x => rest.includes(x.name) || (x.name.length >= 2 && rest.includes(x.name.slice(0, 2)) && x.name.slice(0, 2).length === 2));
  if (m) { ownerIds = [m.id]; rest = rest.split(m.name).join(' ').split(m.name.slice(0, 2)).join(' '); }
  const sub = state.subsystems.find(x => rest.includes(x.name));
  if (sub) { subsystemId = sub.id; }
  const title = rest.replace(/\s+/g, ' ').trim();
  if (!title || title.length < 2) return null;
  return { title, due, ownerIds, subsystemId };
}

/* ---------------- 到期提醒 ---------------- */
function reminderItems() {
  const t0 = today();
  const items = [];
  const dueToday = state.tasks.filter(t => t.due === t0 && !statusOf(t).isDone);
  const overdue = state.tasks.filter(t => t.due && t.due < t0 && !statusOf(t).isDone);
  const exams = state.unavailables.filter(u => u.kind === 'exam' && (u.end || u.start) >= t0 && u.start <= addDays(t0, 6));
  const bomLate = (state.bom || []).filter(b => b.etaAt && b.needAt && b.etaAt > b.needAt);
  if (overdue.length) items.push({ k: 'overdue', txt: `逾期 ${overdue.length} 个任务`, bad: true });
  if (dueToday.length) items.push({ k: 'due', txt: `今天到期 ${dueToday.length} 个` });
  if (exams.length) items.push({ k: 'exam', txt: `近 7 天 ${exams.length} 场考试` });
  if (bomLate.length) items.push({ k: 'bom', txt: `${bomLate.length} 个物料到货晚于需要日`, bad: true });
  return items;
}

/* =========================================================================
 *  跟随气泡 Popover —— 悬停预览 / 点击就地编辑
 * =========================================================================
 *  设计要点：
 *   - 固定定位到 body 层，永不被三栏或 overflow 容器裁切/遮挡
 *   - 与触发元素"绑定"：气泡自身 hover 时不关闭；移出两者后才淡出
 *   - 只使用 opacity/transform 做过渡，不触发布局，杜绝抖动
 *   - 内容变化（勾选检查点）时只重绘气泡，不重建页面，保持滚动与焦点
 */
const POP_DELAY = 200;
let popState = null;      // { kind, id, editing, el }
let popTimer = null, popHideTimer = null;
let suppressHover = false; // 打开弹窗后短暂抑制 hover 气泡
let popDragLock = false;   // 拖拽/拖动进度条期间：不弹，并立即关掉
let popInside = false, popAnchorInside = false;
let popPending = null;   // { el, kind, id } 等待 200ms 打开的目标

function popEl() { return $('#pop'); }
function popOpen() { const p = popEl(); return !!(popState && p && p.classList.contains('on')); }

function schedulePop(el, kind, id) {
  if (suppressHover || popDragLock) return;
  if (!el || !el.isConnected) return;
  if (popOpen() && popState.kind === kind && popState.id === id) {
    popState.el = el;
    positionPop(el);
    return;
  }
  if (popPending && popPending.el === el && popPending.kind === kind && popPending.id === id && popTimer) return;
  clearTimeout(popTimer);
  clearTimeout(popHideTimer);
  popPending = { el, kind, id };
  popTimer = setTimeout(() => { popTimer = null; popPending = null; openPop(el, kind, id, false); }, POP_DELAY);
}

/* 指针离开后延时关闭；指针回到锚点/气泡会取消 */
function armHide(ms) {
  clearTimeout(popHideTimer);
  popHideTimer = setTimeout(() => {
    popHideTimer = null;
    if (!popState || popState.editing) return;
    if (popInside || popAnchorInside) return;
    closePop();
  }, ms || 160);
}

function cancelPop() {
  clearTimeout(popTimer); popTimer = null; popPending = null;
  if (popOpen() && !popState.editing) armHide(140);
}

function openPop(el, kind, id, editing) {
  const p = popEl();
  if (!p) return;
  if (!el || !el.isConnected) return;
  clearTimeout(popTimer); popTimer = null; popPending = null;
  clearTimeout(popHideTimer); popHideTimer = null;
  popState = { kind, id, editing: !!editing, el };
  popInside = false;
  popAnchorInside = true;
  p.innerHTML = popBody(kind, id, !!editing);
  p.classList.toggle('editing', !!editing);
  p.classList.add('on');
  positionPop(el);
  bindPop();
}

function positionPop(el) {
  const p = popEl();
  if (!p || !el || !el.isConnected) return;
  const r = el.getBoundingClientRect();
  const pr = p.getBoundingClientRect();
  const gap = 10;
  let left = r.right + gap;
  let flipX = false;
  if (left + pr.width > window.innerWidth - 12) { left = r.left - pr.width - gap; flipX = true; }
  if (left < 12) left = 12;
  let top = r.top - 6;
  let flipY = false;
  if (top + pr.height > window.innerHeight - 12) {
    top = window.innerHeight - pr.height - 12;
    flipY = true;
  }
  if (top < 12) top = 12;
  p.style.left = Math.round(left) + 'px';
  p.style.top = Math.round(top) + 'px';
  p.style.transformOrigin = (flipX ? 'right' : 'left') + ' ' + (flipY ? 'bottom' : 'top');
}

function closePop(force) {
  if (!popState) return;
  if (popState.editing && !force) return;
  clearTimeout(popTimer); popTimer = null;
  clearTimeout(popHideTimer); popHideTimer = null;
  const p = popEl();
  if (p) p.classList.remove('on', 'editing');
  popState = null;
  popInside = false;
  popAnchorInside = false;
}

function bindPop() {
  const p = popEl();
  if (!p) return;
  if (p.dataset.bound) return;
  p.dataset.bound = '1';
  p.addEventListener('pointerenter', () => { popInside = true; clearTimeout(popHideTimer); popHideTimer = null; });
  p.addEventListener('pointerleave', () => { popInside = false; if (!popState || !popState.editing) armHide(160); });
  p.addEventListener('click', e => {
    const x = e.target.closest('[data-pop-x]');
    if (x) return closePop(true);
    const cp = e.target.closest('[data-pop-cp]');
    if (cp) return popToggleCp(cp);
    const hit = e.target.closest('[data-pop-set]');
    if (hit) return popSetField(hit);
    const act = e.target.closest('[data-pop-act]');
    if (act) return popAction(act.dataset.popAct, act);
    const nav = e.target.closest('[data-pop]');
    if (nav && popState) {
      const [k2, id2] = nav.dataset.pop.split(':');
      openPop(popState.el, k2, id2, false);
      return;
    }
  });
  p.addEventListener('change', e => {
    const f = e.target.closest('[data-pop-field]');
    if (f) popCommitField(f);
  });
  p.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); closePop(true); }
    if (e.key === 'Enter' && e.target.matches('[data-pop-field]')) {
      e.preventDefault();
      popCommitField(e.target);
    }
  });
}

/* 全局指针状态机：只认「当前指针在锚点内 / 在气泡内」，其余一律延时关闭 */
function bindPopHover() {
  if (window._popHoverBound) return;
  window._popHoverBound = true;

  const anchorOf = t => (t && t.closest ? t.closest('[data-pop]') : null);

  document.addEventListener('pointerover', e => {
    const p = popEl();
    if (popState && p && p.classList.contains('on') && p.contains(e.target)) {
      popInside = true;
      clearTimeout(popHideTimer); popHideTimer = null;
      return;
    }
    popInside = false;
    const a = anchorOf(e.target);
    if (!a) {
      if (popOpen() && !popState.editing) { popAnchorInside = false; armHide(240); }
      return;
    }
    popAnchorInside = true;
    clearTimeout(popHideTimer); popHideTimer = null;
    const [kind, id] = a.dataset.pop.split(':');
    schedulePop(a, kind, id);
  }, true);

  document.addEventListener('pointerout', e => {
    if (e.relatedTarget && e.target.contains && e.target.contains(e.relatedTarget)) return;
    const a = anchorOf(e.target);
    if (!a) return;
    if (e.relatedTarget && a.contains(e.relatedTarget)) return;
    popAnchorInside = false;
    cancelPop();
  }, true);

  document.addEventListener('pointermove', e => {
    if (popDragLock) {
      if (e.buttons === 0) popDragLock = false;
      else return;
    }
    if (!popOpen()) return;
    const p = popEl();
    const a = popState.el;
    const inPop = !!(p && p.contains(e.target));
    const inAnchor = !!(a && a.isConnected && (a === e.target || a.contains(e.target)));
    popInside = inPop;
    popAnchorInside = inAnchor;
    if (inPop || inAnchor) {
      clearTimeout(popHideTimer); popHideTimer = null;
    } else if (!popHideTimer) {
      armHide(180);
    }
  }, true);

  document.addEventListener('pointerdown', e => {
    const p = popEl();
    if (popState && popState.editing && p && !p.contains(e.target)) closePop(true);
  }, true);

  const dragHot = t => !!(t && t.closest && t.closest('.lbar, .kcard, [draggable="true"], input[type="range"], .wk-in[data-wk-field="pct"]'));
  let dragPt = null, dragMoved = false;
  document.addEventListener('pointerdown', e => {
    if (!dragHot(e.target)) return;
    dragPt = { x: e.clientX, y: e.clientY };
    dragMoved = false;
    popDragLock = true;
    clearTimeout(popTimer); popTimer = null;
    clearTimeout(popHideTimer); popHideTimer = null;
    if (popState) closePop(true);
  }, true);
  document.addEventListener('pointermove', e => {
    if (!dragPt || !popDragLock) return;
    if (e.buttons === 0) { dragPt = null; popDragLock = false; return; }
    if (Math.hypot(e.clientX - dragPt.x, e.clientY - dragPt.y) > 4) dragMoved = true;
  }, true);
  const endDrag = () => {
    const moved = dragMoved;
    dragPt = null; dragMoved = false;
    if (moved) setTimeout(() => { popDragLock = false; }, 120);
    else popDragLock = false;
  };
  ['pointerup', 'pointercancel', 'dragend', 'mouseup', 'touchend'].forEach(t =>
    document.addEventListener(t, endDrag, true));

  document.addEventListener('scroll', () => {
    if (!popState) return;
    if (!popState.el || !popState.el.isConnected) return closePop(true);
    positionPop(popState.el);
  }, true);

  window.addEventListener('resize', () => { if (popState) closePop(true); });
  window.addEventListener('blur', () => { if (popState) closePop(true); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && popState) closePop(true); });
  document.addEventListener('pointerout', e => {
    if (e.relatedTarget) return;
    if (popOpen() && !popState.editing) armHide(100);
  }, true);
}

/* 每周归档气泡：id = 周 id，或 ghostYYYY-MM-DD */
function popWeek(id) {
  const W = ensureWeekly();
  let w = W.weeks.find(x => x.id === id);
  if (!w && id.startsWith('ghost')) {
    const s = id.slice(5);
    w = { id, start: s, end: addDays(s, 6), ghost: true, rows: {}, base: {} };
  }
  if (!w) return '';
  const st = weekStats(w), a = w.archive;
  const delta = a ? a.avgTo - a.avgFrom : st.delta;
  const tone = delta > 0 ? 'var(--ok)' : delta < 0 ? 'var(--danger)' : 'var(--tx3)';
  const items = (a ? a.items : []).slice(0, 5);
  const notes = (a ? a.notes : []).slice(0, 4);
  return `
    <div class="pop-h">
      <div class="pop-ttl">${weekLabel(w)} ${a ? '已归档' : w.ghost ? '未开始' : '进行中'}
        <div class="pop-sub">
          <span class="stsym" style="background:${a ? 'var(--ok)' : 'var(--acc)'};color:var(--canvas)">${a ? '▣' : '◉'}</span>
          <span>平均进度 ${a ? `${a.avgFrom}% → ${a.avgTo}%` : `${st.avg}%`}</span>
          <span>·</span><span style="color:${tone};font-weight:600">${delta > 0 ? '+' : ''}${delta}%</span>
        </div>
      </div>
    </div>
    <div class="pop-b">
      <div class="pop-sec">
        <div class="lbl">检查点 <span class="cnt">${a ? `${a.checksFrom} → ${a.checksTo}` : `${state.tasks.reduce((n, t) => n + (t.checkpoints || []).filter(c => c.done).length, 0)} 个已完成`}</span></div>
        ${a ? `<div class="pr"><span class="k">已完成任务</span><span class="v">${a.doneN} 项</span></div>` : ''}
        ${a && a.down ? `<div class="pr"><span class="k">回退任务</span><span class="v" style="color:var(--danger)">${a.down} 项</span></div>` : ''}
      </div>
      ${a ? `<div class="pop-sec"><div class="lbl">机器人摘要</div>
        <div style="font-size:11.5px;line-height:1.6;color:var(--tx2);padding:2px 2px 0">${esc(a.summary)}</div></div>` : ''}
      ${items.length ? `<div class="pop-sec"><div class="lbl">推进最多</div>
        ${items.map(i => `<div class="pc ${i.d > 0 ? 'on' : ''}" data-open-task="${i.id}" data-pop="task:${i.id}" style="cursor:pointer">
          <span class="bx" style="background:${i.d > 0 ? 'var(--ok)' : 'var(--tx3)'};color:var(--canvas)">${i.d > 0 ? '↑' : '↓'}</span>
          <span class="tx">${esc(i.title)}</span>
          <span class="wt">${i.from}% → ${i.to}%</span></div>`).join('')}</div>` : ''}
      ${notes.length ? `<div class="pop-sec"><div class="lbl">本周备注</div>
        ${notes.map(n => `<div class="pr"><span class="k">${esc(n.title)}</span><span class="v" style="font-size:11px">${esc(n.note)}</span></div>`).join('')}</div>` : ''}
      ${!a && !w.ghost ? `<div class="pop-sec"><div style="font-size:11.5px;color:var(--tx3);padding:2px 2px 0">这一周还在进行中，周日晚上（或下次打开页面）机器人会自动归档并写摘要。</div></div>` : ''}
    </div>
    <div class="pop-f">
      <button class="btn sm primary" data-pop-act="open-week" data-week="${w.id}">打开周报</button>
    </div>`;
}

/* 占用遮罩气泡：id = "memberId[+memberId…]|day|cls[|subsystemId]" */
function popBusy(id) {
  const [midPart, day, cls, subId] = id.split('|');
  const mids = (midPart || '').split('+').filter(Boolean);
  const people = mids.map(member).filter(Boolean);
  if (!people.length) return '';
  const d = day;
  const avail = buildAvailability(addDays(d, -1), addDays(d, 1));
  const rows = people.map(m => {
    const r = avail.get(m.id)?.get(d);
    return {
      m, r,
      busy: r ? Math.round((r.pbusy ?? r.busy) * 100) : 0,
      free: r ? Math.round((1 - (r.pbusy ?? r.busy)) * 100) : 100,
      notes: (r && r.notes) || [],
      hard: !!(r && r.hard > .5),
      soft: !!(r && (r.pbusy ?? r.busy) > .2),
    };
  });
  const solo = rows.length === 1 ? rows[0] : null;
  const topCls = rows.some(x => x.hard) ? 'hard' : 'soft';
  const tone = topCls === 'hard' ? 'var(--danger)' : 'var(--warn)';
  const kindName = topCls === 'hard' ? '考试 / 硬占用' : '复习期 · 降效';
  const maxBusy = Math.max(...rows.map(x => x.busy));

  // 这天与这些人相关的在手任务（子系统泳道只看本子系统的任务）

    : `<span class="stsym" style="background:${tone};color:var(--canvas)">${topCls === 'hard' ? '⛔' : '◐'}</span>

/* =========================================================================
 *  周报：每周进度表 + 同步机器人
 * ========================================================================= */
const BOT = { timer: null };
function weekStartOf(d) {
  const wd = (parseYmd(d).getDay() + 6) % 7;
  return addDays(d, -wd);
}
function weekLabel(w) { return `${fmtMD(w.start)} – ${fmtMD(w.end)}`; }
function weekDeltaLabel(w) {
  const n = Math.round(diffDays(weekStartOf(today()), w.start) / 7);
  return n === 0 ? '本周' : n < 0 ? `${-n} 周前` : `${n} 周后`;
}
function ensureWeekly() {
  if (!state.weekly || !Array.isArray(state.weekly.weeks)) state.weekly = { active: null, weeks: [] };
  if (!state.weekly.weeks.length) state.weekly.weeks.push(newWeek(weekStartOf(today())));
  if (!state.weekly.active || !state.weekly.weeks.some(w => w.id === state.weekly.active)) {
    const last = state.weekly.weeks.slice().sort((a, b) => a.start < b.start ? -1 : 1).slice(-1)[0];
    state.weekly.active = last.id;
  }
  rolloverWeeks();
  return state.weekly;
}
function newWeek(start) {
  // 基线快照：这一周开始时每项任务的进度与已完成检查点数，用来算"本周推进了多少"
  return { id: uid('wk'), start, end: addDays(start, 6), rows: {}, base: snapshotBase(), syncedAt: null, changes: [], archive: null };
}
function snapshotBase() {
  const base = {};
  for (const t of state.tasks) {
    base[t.id] = { pct: taskPct(t), checks: (t.checkpoints || []).filter(c => c.done).length };
  }
  return base;
}
/* 换周：把已经过去的周归档，机器人写好摘要，再切到本周 */
function rolloverWeeks() {
  const W = state.weekly;
  const cur = weekStartOf(today());
  const all = W.weeks.slice().sort((a, b) => a.start < b.start ? -1 : 1);
  let changed = false;
  for (const w of all) {
    if (!w.archive && w.end < cur) { finalizeWeek(w); changed = true; }
  }
  const act = W.weeks.find(w => w.id === W.active) || all.slice(-1)[0];
  if (act && act.start < cur) {
    let nw = W.weeks.find(w => w.start === cur);
    if (!nw) { nw = newWeek(cur); W.weeks.push(nw); }
    W.active = nw.id;
    changed = true;
  }
  // 本周没有基线（旧版本建的周）：从现在起记一份，之后的推进才有对比
  const curW = W.weeks.find(w => w.id === W.active);
  if (curW && !curW.archive && Object.keys(curW.base || {}).length === 0) {
    curW.base = snapshotBase();
    changed = true;
  }
  if (changed) save();
}
/* 机器人归档：对比基线，写出一周的摘要 */
function finalizeWeek(w) {
  if (!w) return null;
  if (w.archive) return w.archive;
  const tasks = state.tasks;
  const base = w.base || {};
  const hasBase = Object.keys(base).length > 0;
  const items = [];
  let checksFrom = 0, checksTo = 0, fromSum = 0, toSum = 0, wSum = 0;
  for (const t of tasks) {
    // 没有基线快照的老周：用表格里当时填的值兜底，再退回当前值（差值记 0）
    const fallback = (w.rows || {})[t.id];
    const b = base[t.id] || (fallback
      ? { pct: Number(fallback.pct) || 0, checks: Math.round((Number(fallback.pct) || 0) / 100 * (t.checkpoints || []).length) }
      : { pct: taskPct(t), checks: (t.checkpoints || []).filter(c => c.done).length });
    const pct = taskPct(t);
    const checks = (t.checkpoints || []).filter(c => c.done).length;
    const wt = Math.max(1, (t.checkpoints || []).length);
    checksFrom += b.checks || 0; checksTo += checks;

/* 机器人：把表格里的「本周进度 / 状态 / 截止」写回任务，再刷新泳道 */
function syncWeek(opts = {}) {
  const w = activeWeek(), changes = [];
  for (const t of state.tasks) {
    const r = (w.rows || {})[t.id];
    if (!r) continue;
    const bPct = taskPct(t), bSt = t.statusId, bDue = t.due;
    const pct = clamp(Number(r.pct) || 0, 0, 100);
    const cps = t.checkpoints || [];
    if (cps.length) {
      const n = clamp(Math.round(pct / 100 * cps.length), 0, cps.length);
      cps.forEach((c, i) => { c.done = i < n; });
      r.pct = taskPct(t); // 按检查点折算后的真实值
    }
    let st = r.statusId || t.statusId;
    if (pct >= 100) { const dn = state.statuses.find(s => s.isDone); if (dn) st = dn.id; }
    else if (pct > 0 && st === 'st_todo') st = 'st_doing';
    t.statusId = st;
    if (r.due && r.due !== t.due) {
      t.due = r.due;
      if (t.start && t.start > t.due) t.start = t.due;
    }
    if (bPct !== taskPct(t)) changes.push(`「${t.title}」进度 ${bPct}% → ${taskPct(t)}%`);
    if (bSt !== t.statusId) changes.push(`「${t.title}」状态 → ${statusOf(t).name}`);
    if (bDue !== t.due) changes.push(`「${t.title}」截止 ${bDue || '—'} → ${t.due || '—'}`);
  }
  w.syncedAt = new Date().toISOString();
  w.changes = changes;
  if (changes.length) {
    logActivity('week', `周报同步 ${changes.length} 项：${changes.slice(0, 3).join('；')}${changes.length > 3 ? '…' : ''}`);
    commit();
    if (!opts.silent) toast(`🤖 已同步 ${changes.length} 项到泳道`);
  } else {
    save(); renderStage();
    if (!opts.silent) toast('🤖 没有需要同步的改动');
  }
  return changes;
}

function weekPending(w) {

    else if (r.statusId && r.statusId !== t.statusId) n++;

  });
  v.querySelectorAll('[data-wk-tnote]').forEach(el => el.onchange = () => {
    const cw = activeWeek();
    const t = state.tasks.find(x => x.id === el.dataset.wkTnote);
    if (!t) return;
    const r = weekRow(cw, t);
    r.note = el.value;
    save();
    // 备注就是这条任务的周记录，按任务视图里看到的是同一份
    toast(`「${t.title}」的周记录已保存`);
  });
  v.querySelector('#wkSync').onclick = () => syncWeek({});
  v.querySelector('#wkArch').onclick = () => archiveNow();
  v.querySelector('#wkAI').onclick = () => aiOpen({ run: !!aiCfg().key });
  v.querySelector('[data-wk-lane]').onclick = () => { ui.tab = 'lane'; renderAll(); };
  const autoEl = v.querySelector('#wkAuto');
  autoEl.onchange = () => {
    state.settings.weeklyBot = autoEl.checked;
    save(); renderStage();
    toast(autoEl.checked ? '机器人已开启自动同步' : '已关闭自动同步，改完点「立即同步」写回泳道');
  };

  v.querySelectorAll("[data-wk-field]").forEach(el => {
    el.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      if (el.tagName === "SELECT") return;
      e.preventDefault();
      const tr = el.closest("[data-wk-task]"); if (!tr) return;
      const cells = [...tr.querySelectorAll("[data-wk-field]")];
      const ci = cells.indexOf(el);
      const rows = [...v.querySelectorAll("tbody tr[data-wk-task]")];
      const next = rows[rows.indexOf(tr) + (e.key === "ArrowUp" ? -1 : 1)];
      if (!next) return;
      const t2 = [...next.querySelectorAll("[data-wk-field]")][ci];
      if (t2 && !t2.disabled) { t2.focus(); if (t2.select) t2.select(); }
    });
  });
  v.querySelectorAll("[data-wk-field]").forEach(el => {
    el.onchange = () => {
      const tr = el.closest('[data-wk-task]');
      const t = state.tasks.find(x => x.id === tr.dataset.wkTask);
      if (!t) return;
      const f = el.dataset.wkField;
      // 标题 / 子系统：任务本身的字段，改完立即写回（不经过周进度同步）
      if (f === 'title') {
        const nv = el.value.trim();
        if (!nv) { el.value = t.title; toast('标题不能为空'); return; }
        if (nv === t.title) return;
        const old = t.title;
        t.title = nv;
        logActivity('task', `「${old}」改名 → ${nv}（周报）`);
        commit(); renderStage(); toast('标题已同步到任务');
        return;
      }
      if (f === 'subsystemId') {
        if (el.value === t.subsystemId) return;
        const old = subName(t.subsystemId);
        t.subsystemId = el.value;
        logActivity('task', `「${t.title}」子系统 ${old} → ${subName(el.value)}（周报）`);
        commit(); renderStage(); toast('子系统已同步，泳道分组已更新');
        return;
      }
      const r = weekRow(w, t);
      r[f] = f === 'pct' ? clamp(Number(el.value) || 0, 0, 100) : el.value;
      if (f === 'pct') {
        el.value = r.pct;
        const cp = tr.querySelector('.wk-cp');
        if (cp && (t.checkpoints || []).length) cp.textContent = `${Math.round(r.pct / 100 * t.checkpoints.length)}/${t.checkpoints.length}`;
      }
      save();
      if (state.settings.weeklyBot === false) {
        const n = weekPending(w);
        const b = document.querySelector('#wkSync');
        if (b) b.textContent = '立即同步' + (n ? ` · ${n}` : '');
        el.closest('tr')?.classList.add('dirty');
        toast('已记录，点「立即同步」写回泳道');
      } else scheduleSync();
    };
  });
  save();
}

function aiCfg() {

function aiWeekData() {
  const w = activeWeek();
  const people = state.members.map(m => {
    const ts = state.tasks.filter(t => (t.ownerIds || []).includes(m.id));
    return {
      id: m.id, name: m.name,
      roles: (m.roles || []).map(r => byId(state.roles, r)?.name).filter(Boolean),
      personNote: (w.mnotes || {})[m.id] || '',
      tasks: ts.map(t => {
        const b = (w.base || {})[t.id];
        return {
          id: t.id, title: t.title, sub: subName(t.subsystemId),
          pct: taskPct(t), basePct: b && b.pct != null ? b.pct : taskPct(t),
          status: statusOf(t).name,
          checks: `${(t.checkpoints || []).filter(c => c.done).length}/${(t.checkpoints || []).length}`,
          note: (weekRow(w, t).note || '')
        };
      })
    };
  });
  return { week: weekLabel(w), people };
}
function aiPrompt() {
  const data = aiWeekData();
  return `你在帮我整理一个机器人比赛项目的周报。下面是一周的数据（JSON）。请做四件事：①给每个人、每项任务写本周记录；②把本周任务分成四类；③写一段本周总结；④给出可执行的建议。

要求：
1. 只使用给定 id，绝对不要编造任务或人。
2. tasks：对每个 taskId，用不超过 40 个汉字写这周在这项任务上的进展或卡点，依据 basePct→pct、检查点、状态和已填备注。
3. people：对每个 memberId，用不超过 40 个汉字写这个人这周的整体情况（跨任务的分工、阻塞）。
4. buckets 分类（只放 id）：
   - done：本周已经 100% 或已完成状态；
   - moving：本周有推进（pct 或检查点变多）；
   - stuck：没完成、本周也没推进；
   - blocked：状态是「卡住」，或因考试/占用/依赖明确做不动。
   每个任务必须出现在且只出现在一类里。
5. summary：不超过 120 字，说清本周整体推进、卡在哪、下周最该盯什么。
6. pct：给每个 taskId 估一个 0–100 的整数，表示本周结束时的完成度（按 5 的倍数）。依据：已填备注、检查点、进度变化、状态。没有新信息就沿用当前 pct。
7. advice：3–5 条，每条不超过 50 字，必须点名具体任务或人，给可执行动作；不要泛泛而谈。
8. 只输出一个 JSON 对象，不要 markdown 代码块，不要解释文字：
{"summary":"...","tasks":{"<taskId>":"..."},"people":{"<memberId>":"..."},"pct":{"<taskId>":0},"buckets":{"done":[],"moving":[],"stuck":[],"blocked":[]},"advice":[{"level":"high|mid|low","text":"..."}]}

本周：${data.week}
数据：${JSON.stringify(data, null, 1)}`;
}
function aiParse(text) {
  const s = String(text || '').replace(/```json|```/g, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('返回内容里没有 JSON');
  const obj = JSON.parse(s.slice(a, b + 1));
  return {
    summary: typeof obj.summary === 'string' ? obj.summary : '',
    tasks: obj.tasks || {},
    people: obj.people || {},
    pct: obj.pct || {},
    buckets: Object.assign({ done: [], moving: [], stuck: [], blocked: [] }, obj.buckets || {}),
    advice: Array.isArray(obj.advice) ? obj.advice.filter(x => x && x.text).map(x => ({ level: x.level || 'mid', text: String(x.text) })) : []
  };
}

      ${tRows.map(t => {

          <div class="ai-pctl"><input class="ai-in ai-pct" type="number" min="0" max="100" step="5" data-ai-p="${t.id}" value="${v}"><span class="ai-pu">%</span>
            <input class="ai-in" data-ai-ti="${t.id}" value="${esc(p.tasks[t.id] || '')}" placeholder="这周在这项上做到哪…"></div></div>

}

  const again = p.querySelector(`[data-pop-cp="${c.id}"]`);
  if (again) { again.style.transition = 'none'; again.style.background = 'var(--acc-dim)'; requestAnimationFrame(() => { again.style.transition = ''; again.style.background = ''; }); }
  renderPulse(); applyLeftRail(); applyRightRail();
}

function popSetField(hit) {
  if (!popState) return;
  const [what, val] = hit.dataset.popSet.split(':');
  if (what === 'owner') {
    const t = state.tasks.find(x => x.id === popState.id);
    if (!t) return;
    t.ownerIds = t.ownerIds || [];
    const i = t.ownerIds.indexOf(val);
    if (i >= 0) t.ownerIds.splice(i, 1); else t.ownerIds.push(val);
    hit.classList.toggle('on', t.ownerIds.includes(val));

    commit();
    renderStage();
  } else if (what === 'wkown') {
    // 周报里改负责人：立即写回任务，只刷新气泡和那一格，不整页重绘
    const t = state.tasks.find(x => x.id === popState.id);
    if (!t) return;
    t.ownerIds = t.ownerIds || [];
    const i = t.ownerIds.indexOf(val);
    if (i >= 0) t.ownerIds.splice(i, 1); else t.ownerIds.push(val);
    const m = member(val);
    logActivity('task', `「${t.title}」负责人${i >= 0 ? '移除' : '加入'} ${m ? m.name : ''}（周报）`);
    hit.classList.toggle('on', t.ownerIds.includes(val));
    commit();
    const btn = document.querySelector(`[data-pop="owners:${t.id}"]`);
    if (btn) { btn.innerHTML = owAvatars(t); btn.title = `负责人：${(t.ownerIds.map(id => member(id)?.name).filter(Boolean).join('、')) || '未指派'}`; }
    renderPulse(); applyRightRail();
    return;
  } else if (what === 'mem') {
    const u = state.unavailables.find(x => x.id === popState.id);
    if (!u) return;
    // 参加人勾选按钮（在 .pop-hit 内）：直接切换参与人
    if (hit.closest('.pop-hit')) {
      u.participantIds = u.participantIds || [];
      const i = u.participantIds.indexOf(val);
      if (i >= 0) u.participantIds.splice(i, 1);
      else u.participantIds.push(val);
      // 取消参与时清掉该人的个性化覆盖
      if (i >= 0 && u.memberOverrides) delete u.memberOverrides[val];
      hit.classList.toggle('on', u.participantIds.includes(val));
      logActivity('exam', `「${u.note || typeOf(u.typeId).name}」参与人变更`);
      commit();
      // 只重绘气泡内部（保留滚动）
      const p = popEl();
      const mode = popState.editing;
      p.innerHTML = popBody('exam', u.id, mode);
      positionPop(popState.el);
      renderStage(); renderPulse(); applyLeftRail(); applyRightRail();
      return;
    }
    // 成员明细行：进完整弹窗改个性化节奏
    suppressHover = true;
    closePop(true);
    openUnavailModal(u.id);
  }
}

function popCommitField(el) {
  if (!popState || popState.kind !== 'task') return;
  const t = state.tasks.find(x => x.id === popState.id);
  if (!t) return;
  const k = el.dataset.popField;
  let v = el.value;
  if (k === 'title') { v = v.trim(); if (!v) { el.value = t.title; return; } }
  if (t[k] === v) return;
  t[k] = v;
  if (k === 'statusId' && statusOf(t).isDone) (t.checkpoints || []).forEach(c => c.done = true);
  logActivity('task', `「${t.title}」修改了 ${k}`);
  commit();
  renderStage();
  renderPulse(); applyLeftRail(); applyRightRail();
}

function popAction(act, el) {
  if (act === 'open-exam') {
    const id = el?.dataset.exam;
    if (!id) return;
    suppressHover = true;
    closePop(true);
    openUnavailModal(id);
    return;
  }
  if (act === 'open-member') {
    const id = el?.dataset.member;
    if (!id) return;
    suppressHover = true;
    closePop(true);
    openMemberModal(id);
    return;
  }
  if (act === 'open-week') {
    const id = el?.dataset.week;
    if (!id) return;
    suppressHover = true;
    closePop(true);
    const W = ensureWeekly();
    if (W.weeks.some(w => w.id === id)) W.active = id;
    ui.tab = 'weekly';
    save();
    renderAll();
    return;
  }
  if (!popState) return;
  const kind = popState.kind, id = popState.id;
  if (act === 'edit') {
    suppressHover = true;
    closePop(true);
    if (kind === 'task') openTaskModal(id);
    else openUnavailModal(id);
  } else if (act === 'inline') {
    if (kind === 'exam') {
      suppressHover = true;
      closePop(true);
      openUnavailModal(id);
      return;
    }
    popState.editing = true;
    const p = popEl();
    p.innerHTML = popBody(kind, id, true);
    p.classList.add('editing');
    positionPop(popState.el);
  }
}
bindPopHover();

/* =========================================================================
 *  ⌘K 命令面板
 * ========================================================================= */
let cmdItems = [], cmdIdx = 0;
function openCmdk() {
  const box = $('#cmdk');
  box.classList.remove('hidden');
  const inp = $('#cmdInput');
  inp.value = ''; inp.focus();
  buildCmdItems('');
}
function closeCmdk() { $('#cmdk').classList.add('hidden'); }
function buildCmdItems(q) {
  const term = q.trim().toLowerCase();
  const out = [];
  const push = (group, items) => { if (items.length) out.push({ group, items }); };
  const match = s => !term || String(s).toLowerCase().includes(term);

  // 指令
  const cmds = [
    { ic: '+', label: '新建任务', hint: 'T', run: () => openTaskModal(null) },
    { ic: '+', label: '新建考试 / 日程', hint: 'E', run: () => openUnavailModal(null) },
    { ic: '+', label: '添加成员', hint: 'M', run: () => openMemberModal(null) },
    { ic: '⇄', label: '切换主题', run: () => toggleTheme() },
    { ic: '↶', label: '撤销上一步', hint: '⌘Z', run: () => undo() },
  { ic: '↷', label: '重做', hint: '⇧⌘Z', run: () => redo() },
  { ic: '↓', label: '导出 JSON 备份', run: () => exportJson() },
    { ic: '↑', label: '导入 JSON', run: () => importJson() },
    { ic: '▦', label: '任务模板…', run: () => openTemplates() },
    { ic: '◎', label: '视图 · 时间泳道', run: () => { ui.tab = 'lane'; renderAll(); } },
    { ic: '◎', label: '视图 · 看板', run: () => { ui.tab = 'kanban'; renderAll(); } },
    { ic: '◎', label: '视图 · 全员负荷', run: () => { ui.tab = 'heat'; renderAll(); } },
    { ic: '◎', label: '视图 · 考试与日程', run: () => { ui.tab = 'exams'; renderAll(); } },
    { ic: '◎', label: '视图 · 指挥台', run: () => { ui.tab = 'dex'; renderAll(); } },
  ].filter(c => match(c.label));
  push('指令', cmds);

  // 自然语言建任务
  if (term) {
    const qt = parseQuickTask(q);
    if (qt) {
      const who = qt.ownerIds.map(id => (state.members.find(m => m.id === id) || {}).name).filter(Boolean).join(' ');
      push('快速新建', [{ ic: '＋', label: '新建：' + qt.title, hint: '回车直接建' + (qt.due ? ' · ' + fmtMD(qt.due) : '') + (who ? ' · ' + who : ''), run: () => createQuickTask(qt) }]);
    }
  }

  // 任务
  const tasks = state.tasks.filter(t => match(t.title)).slice(0, 8).map(t => ({
    ic: statusGlyph(statusOf(t)), label: t.title, hint: subName(t.subsystemId),
    run: () => openTaskModal(t.id),
  }));
  push('任务', tasks);

  // 成员
  const mems = state.members.filter(m => match(m.name)).slice(0, 5).map(m => ({
    ic: '◍', label: m.name, hint: (m.roles || []).map(r => byId(state.roles, r)?.name).filter(Boolean).join(' '),
    run: () => openMemberModal(m.id),
  }));
  push('成员', mems);

  // 日程
  const exams = state.unavailables.filter(u => match(u.note || '') || match(typeOf(u.typeId).name)).slice(0, 5).map(u => ({
    ic: u.kind === 'exam' ? '考' : '事', label: u.note || typeOf(u.typeId).name,
    hint: fmtMD(u.start),
    run: () => openUnavailModal(u.id),
  }));
  push('日程', exams);

  cmdItems = out.flatMap(g => g.items.map((it, i) => ({ ...it, group: g.group, key: g.group + '-' + i })));
  cmdIdx = 0;
  renderCmdList(out);
}
function renderCmdList(groups) {
  const el = $('#cmdList');
  if (!cmdItems.length) { el.innerHTML = `<div class="empty" style="padding:22px">没有匹配项</div>`; return; }
  let flat = 0;
  el.innerHTML = groups.map(g => `<div class="cmdgroup">${g.group}</div>` + g.items.map(it => {
    const i = flat++;
    return `<div class="cmditem ${i === cmdIdx ? 'on' : ''}" data-cmd="${i}">
      <span class="ci">${esc(it.ic)}</span>
      <div class="cl"><div class="ct">${esc(it.label)}</div>${it.hint ? `<div class="cs">${esc(it.hint)}</div>` : ''}</div>
      ${i === cmdIdx ? '<span class="ck">↵</span>' : ''}
    </div>`;
  }).join('')).join('');
}
function runCmd(i) {
  const it = cmdItems[i];
  if (!it) return;
  closeCmdk();
  setTimeout(() => it.run(), 0);
}
function bindCmdk() {
  $('#cmdkBtn').onclick = openCmdk;
  $('#cmdInput').oninput = e => buildCmdItems(e.target.value);
  $('#cmdInput').onkeydown = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); cmdIdx = Math.min(cmdIdx + 1, cmdItems.length - 1); buildCmdItems($('#cmdInput').value); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cmdIdx = Math.max(cmdIdx - 1, 0); buildCmdItems($('#cmdInput').value); }
    else if (e.key === 'Enter') { e.preventDefault(); runCmd(cmdIdx); }
  };
  $('#cmdList').onclick = e => {
    const it = e.target.closest('[data-cmd]');
    if (it) runCmd(Number(it.dataset.cmd));
  };
  $('#cmdk').onclick = e => { if (e.target.id === 'cmdk') closeCmdk(); };
}

          <input type="text" data-f="changeReason" value="" placeholder="为什么现在改？谁批准的？"></div>
        <div class="field full"><label>最近试跑 <span class="s" style="color:var(--tx3)">（在「工程」页记录）</span></label>
          <div class="s" style="color:var(--tx2)">${(t.testRuns || []).slice(0, 3).map(r => `${esc(String(r.at || '').slice(5, 10))} ${esc(r.result || '')} ${esc(r.change || '')}`).join(' · ') || '还没有试跑记录'}</div></div>
      </div>
    </div>`;

  const foot = `
    ${isNew ? '' : `<button class="btn danger" id="delTask">删除任务</button>`}
    <span class="sp"></span>
    <button class="btn" data-close>取消</button>
    <button class="btn primary" id="saveTask">保存</button>`;

  // 从 DOM 读检查点并写回 t.checkpoints
  const readCps = (m) => {
    const rows = $$('[data-cp]', m);
    t.checkpoints = rows.map(r => ({
      id: r.dataset.cp,
      text: (r.querySelector('[data-cptext]')?.value || '').trim() || '未命名检查点',
      done: !!r.querySelector('[data-cpdone]')?.checked,
      weight: Math.max(1, Number(r.querySelector('[data-cpweight]')?.value) || 1),
      deps: ((t.checkpoints || []).find(x => x.id === r.dataset.cp) || {}).deps || [],
    }));
  };

  const collect = (m) => {
    const g = k => m.querySelector(`[data-f="${k}"]`);
    t.title = g('title')?.value.trim() || '(未命名任务)';
    if (g('subsystemId')) t.subsystemId = g('subsystemId').value;
    if (g('priorityId')) t.priorityId = g('priorityId').value;
    if (g('statusId')) t.statusId = g('statusId').value;
    if (g('start')) t.start = g('start').value;
    if (g('due')) t.due = g('due').value;
    if (g('estimateHours')) t.estimateHours = Number(g('estimateHours').value) || 0;
    if (g('tags')) t.tags = g('tags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    if (g('description')) t.description = g('description').value;
    if (g('goalId')) t.goalId = g('goalId').value;
    if (g('krId')) t.krId = g('krId').value;
    t.depIds = pickerValues(m, 'depIds');
    if (g('deciderId')) t.deciderId = g('deciderId').value;
    const __ex = m.querySelector('[data-f="expedite"]'); if (__ex) t.expedite = __ex.checked;
    const __fz = m.querySelector('[data-f="frozen"]'); if (__fz) t.frozen = __fz.checked;
    t.ownerIds = pickerValues(m, 'ownerIds');
    if (m.querySelector('.picker[data-picker="helperIds"]')) t.helperIds = pickerValues(m, 'helperIds');
    // 联动排期
    const schedMode = m.querySelector('#schedSeg .on')?.dataset.sched || 'fixed';
    if (schedMode === 'fixed') {
      t.link = null;
    } else {
      const taskId = m.querySelector('#linkTask')?.value || '';
      if (taskId) {
        const dur = (t.start && t.due) ? Math.max(0, diffDays(t.start, t.due)) : 6;
        t.link = { mode: schedMode, taskId, offset: Number(m.querySelector('#linkOffset')?.value) || 0, dur };
      } else {
        t.link = null;
      }
    }
    // 延续优化期
    const contOn = m.querySelector('#contOn');
    if (contOn) {
      t.cont = contOn.checked
        ? { on: true, due: m.querySelector('#contDue')?.value || '', note: (m.querySelector('#contNote')?.value || '').trim() }
        : null;
    }
    readCps(m);
  };

  let pendingLogs = [];

  const close = modal(isNew ? '新建任务' : '编辑任务', body, foot, (m, closeFn) => {
    bindPicker(m);
    applyTaskPermissions(m, t, isNew);

    // —— 排期方式 / 联动 ——
    const seg = m.querySelector('#schedSeg');
    const fLink = m.querySelector('#fLink');
    const dateInputs = [m.querySelector('[data-f="start"]'), m.querySelector('[data-f="due"]')];
    const setSched = mode => {
      seg.querySelectorAll('[data-sched]').forEach(b => b.classList.toggle('on', b.dataset.sched === mode));
      const linked = mode !== 'fixed' && !!m.querySelector('#linkTask')?.value;
      fLink.style.display = mode !== 'fixed' ? '' : 'none';
      dateInputs.forEach(i => { if (i) i.disabled = linked; });
      const off = m.querySelector('#linkOffset');
      if (off) { off.disabled = mode === 'with'; off.style.opacity = mode === 'with' ? '.4' : ''; }
      const hint = m.querySelector('#schedHint');
      if (hint) hint.textContent = linked ? '（由联动自动计算）' : (mode !== 'fixed' ? '（先选参照任务）' : '');
    };
    seg.onclick = e => { const b = e.target.closest('[data-sched]'); if (b) setSched(b.dataset.sched); };
    const lkSel = m.querySelector('#linkTask');
    if (lkSel) lkSel.onchange = () => setSched(m.querySelector('#schedSeg .on')?.dataset.sched || 'fixed');

    // —— 延续期开关 ——
    const contOn = m.querySelector('#contOn');
    const contDue = m.querySelector('#contDue');
    if (contOn && contDue) contOn.onchange = () => {
      contDue.disabled = !contOn.checked;
      if (contOn.checked && !contDue.value) contDue.value = addDays(m.querySelector('[data-f="due"]')?.value || today(), 14);
    };

    // —— 跨子系统协作 ——
    const cbList = m.querySelector('#collabList');
    const rerenderCb = () => { cbList.innerHTML = collabRows(); };
    const saveCb = () => { if (!isNew) { logActivity('task', `「${t.title}」协作申请更新`); commit(); } rerenderCb(); };
    const cbAdd = m.querySelector('#collabAdd');
    if (cbAdd) cbAdd.onclick = () => {
      const subId = m.querySelector('#collabSub').value;
      if (!subId) return;
      const note = (m.querySelector('#collabNote').value || '').trim();
      if (!note) { toast('写清楚需要对方做什么', true); return; }
      t.collabs = t.collabs || [];
      t.collabs.push({ id: uid('cb'), subId, note, status: 'pending', byMemberId: currentUserId(), at: new Date().toISOString() });
      m.querySelector('#collabNote').value = '';
      saveCb();
      toast('已提交协作申请');
    };
    if (cbList) cbList.onclick = e => {
      const acc = e.target.closest('[data-cb-accept]');
      const dec = e.target.closest('[data-cb-decline]');
      const wd = e.target.closest('[data-cb-withdraw]');
      const hit = acc || dec || wd;
      if (!hit) return;
      const id = acc ? acc.dataset.cbAccept : dec ? dec.dataset.cbDecline : wd.dataset.cbWithdraw;
      const c = (t.collabs || []).find(x => x.id === id);
      if (!c) return;
      if (wd) { t.collabs = t.collabs.filter(x => x.id !== id); saveCb(); return; }
      c.status = acc ? 'accepted' : 'declined';
      c.replyAt = new Date().toISOString();
      c.replyBy = myMemberId() || currentUserId();
      saveCb();
      toast(acc ? '已接受协作' : '已拒绝协作');
    };

    // —— 检查点交互 ——
    const list = m.querySelector('#cpList');
    const stat = m.querySelector('#cpStat');
    const syncStat = () => { readCps(m); stat.textContent = taskCpSummary(t); };
    const rerender = () => { list.innerHTML = cpList(); syncStat(); };

    list.onclick = e => {
      const del = e.target.closest('[data-cpdel]');
      if (del) {
        const id = del.closest('[data-cp]').dataset.cp;
        readCps(m);
        t.checkpoints = t.checkpoints.filter(c => c.id !== id);
        rerender();
      }
    };
    list.onchange = e => {
      if (e.target.closest('[data-cpdeps]')) { const db = e.target.closest('[data-cpdeps]'); cpDepPick(t.id, db.dataset.cpdeps); return; }
    if (e.target.matches('[data-cpdone]')) {
      const row = e.target.closest('[data-cp]');
      const c0 = (t.checkpoints || []).find(x => x.id === (row && row.dataset.cp));
      const miss = c0 && e.target.checked ? cpUnmet(c0) : '';
      if (miss) { e.target.checked = false; toast('先完成前置：' + miss, true); return; }
      syncStat();
    }
    };
    m.querySelector('#addCp').onclick = () => {
      readCps(m);
      t.checkpoints.push({ id: uid('cp'), text: '', done: false, weight: 1 });
      rerender();
      const rows = $$('[data-cp]', m);
      const lastInput = rows[rows.length - 1]?.querySelector('[data-cptext]');
      if (lastInput) { lastInput.focus(); lastInput.select(); }
    };
    m.querySelector('#cpAllOn').onclick = () => { $$('[data-cpdone]', m).forEach(x => { const row = x.closest('[data-cp]'); const c0 = (t.checkpoints || []).find(y => y.id === (row && row.dataset.cp)); if (!c0 || !cpUnmet(c0)) x.checked = true; }); syncStat(); };
    m.querySelector('#cpAllOff').onclick = () => { $$('[data-cpdone]', m).forEach(x => x.checked = false); syncStat(); };

    // 状态切成完成 → 全部检查点打勾
    const st = m.querySelector('[data-f="statusId"]');
    if (st) st.onchange = () => {
      const s = byId(state.statuses, st.value);
      if (s?.isDone) { $$('[data-cpdone]', m).forEach(x => x.checked = true); syncStat(); }
    };

    m.querySelector('#addLog')?.addEventListener('click', () => {
      const inp = m.querySelector('#logInput');
      const txt = inp.value.trim(); if (!txt) return;
      collect(m);
      const cpTxt = taskCpSummary(t);
      const entry = { at: new Date().toISOString(), text: txt, cp: cpTxt, isNew: isNew };
      pendingLogs.push(entry);
      const box = m.querySelector('#logs');
      if (box.querySelector('.hint')) box.innerHTML = '';
      box.insertAdjacentHTML('afterbegin', `<div class="dline" style="padding:4px 6px"><span style="font-size:10.5px;color:var(--tx3)" style="width:80px">${new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</span><span style="flex:1;min-width:0">${esc(txt)}</span><span class="pill">${esc(cpTxt)}</span></div>`);
      inp.value = '';
      logActivity('log', `「${t.title}」：${txt}`);
      save(); renderKpis();
    });

    m.querySelector('#saveTask').onclick = () => {
      collect(m);
      if (__before) {
        const coreChanged = ['title', 'subsystemId', 'priorityId', 'start', 'due'].some(k => __before[k] !== t[k]) || __before.depIds !== (t.depIds || []).join(',');
        if (__before.frozen && coreChanged) {
          const why = (m.querySelector('[data-f="changeReason"]')?.value || '').trim();
          if (!why) { toast('设计已冻结：改范围或日期要写变更理由', true); return; }
          logActivity('task', `冻结变更「${t.title}」：${why}`);
        }
        if (__before.statusId !== t.statusId) {
          const st = byId(state.statuses, t.statusId);
          if (st && !st.isDone && (t.statusId === 'st_doing' || /进行|doing/i.test(st.name)) && !t.expedite && dorBlock(t)) return;
        }
      }
      if (!t.title) { toast('请填写标题', true); return; }
      t.logs = t.logs || [];
      for (const l of pendingLogs) t.logs.push({ at: l.at, text: l.text, cp: l.cp });
      pendingLogs = [];
      // 全部检查点达成 → 顺带把状态推到完成态
      if (t.checkpoints.length && t.checkpoints.every(c => c.done)) {
        const done = state.statuses.find(s => s.isDone);
        if (done) t.statusId = done.id;
      }
      if (isNew) { state.tasks.push(t); logActivity('task', `新建任务「${t.title}」`); }
      commit('已保存');
      closeFn();
    };

    m.querySelector('#delTask')?.addEventListener('click', () => {
      if (!confirm(`删除任务「${t.title}」？`)) return;
      state.tasks = state.tasks.filter(x => x.id !== t.id);
      logActivity('task', `删除任务「${t.title}」`);
      commit('已删除'); closeFn();
    });
  });
}

/* =========================================================================
 *  弹窗：成员（含节奏档案）
 * ========================================================================= */
function openMemberModal(id) {
  const isNew = !id;
  const m = isNew ? {
    id: uid('mem'), name: '', color: '#' + ['f59e0b', '3b82f6', 'a855f7', 'ec4899', '14b8a6', '22c55e'][state.members.length % 6],
    roles: [], subsystems: [], leadOf: [], note: '',
    pacing: { prepDays: 7, prepIntensity: 0.6, examDayIntensity: 1, curve: 'linear', bufferDays: 0, weekendPreference: 'ok' },
  } : JSON.parse(JSON.stringify(state.members.find(x => x.id === id)));
  if (!m) return;
  m.pacing = Object.assign({ prepDays: 7, prepIntensity: .6, examDayIntensity: 1, curve: 'linear', bufferDays: 0, weekendPreference: 'ok' }, m.pacing || {});

  const body = `
    <div class="fgrid">
      <div class="field"><label>姓名</label><input type="text" data-f="name" value="${esc(m.name)}"></div>
      <div class="field"><label>头像颜色</label><input type="color" data-f="color" value="${m.color}"></div>
      <div class="field full"><label>角色（可多选）</label>${mkPicker(state.roles, m.roles || [], 'roles')}</div>
      <div class="field full"><label>参与子系统（可多选）</label>${mkPicker(state.subsystems, m.subsystems || [], 'subsystems')}</div>
      <div class="field full"><label>备注</label><input type="text" data-f="note" value="${esc(m.note || '')}" placeholder="例如：大四，11月考研；或：周末可全天投入"></div>
    </div>
    <div class="blk">
      <h3>🧠 个人节奏档案 <span style="font-size:10.5px;color:var(--tx3);font-weight:500;margin-left:6px">决定该人"什么时候开始变忙"</span></h3>
      <div class="fgrid">
        <div class="field"><label>提前准备天数 <b id="pdv">${m.pacing.prepDays}</b> 天</label>
          <input type="range" min="0" max="21" step="1" value="${m.pacing.prepDays}" data-p="prepDays" style="accent-color:var(--acc)"></div>
        <div class="field"><label>复习期占用强度 <b id="piv">${Math.round(m.pacing.prepIntensity * 100)}%</b></label>
          <input type="range" min="0" max="1" step="0.05" value="${m.pacing.prepIntensity}" data-p="prepIntensity" style="accent-color:var(--acc)"></div>
        <div class="field"><label>降效曲线</label>
          <select data-p="curve">${CURVES.map(c => `<option value="${c.id}" ${c.id === m.pacing.curve ? 'selected' : ''}>${c.name}</option>`).join('')}</select></div>
        <div class="field"><label>考后恢复天数</label>
          <input type="number" min="0" max="10" value="${m.pacing.bufferDays}" data-p="bufferDays"></div>
        <div class="field"><label>考试当天能否干活</label>
          <select data-p="examDayIntensity">${[[1, '完全不可用'], [0.5, '半天'], [0.2, '基本可以']].map(([v, n]) => `<option value="${v}" ${Number(m.pacing.examDayIntensity) === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div class="field"><label>周末</label>
          <select data-p="weekendPreference">${[['ok', '可以干活'], ['half', '只有半天'], ['no', '完全不干']].map(([v, n]) => `<option value="${v}" ${m.pacing.weekendPreference === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      </div>
      <div id="pacePreview" style="margin-top:12px"></div>
    </div>`;

  modal(isNew ? '添加成员' : '编辑成员', body, `
    ${isNew ? '' : `<button class="btn danger" id="delMember">删除成员</button>`}
    <span class="sp"></span>
    <button class="btn" data-close>取消</button>
    <button class="btn primary" id="saveMember">保存</button>`, (el, closeFn) => {
    bindPicker(el);

    let close = null;
    const readPacing = () => ({
      prepDays: Number(el.querySelector('[data-p="prepDays"]').value),
      prepIntensity: Number(el.querySelector('[data-p="prepIntensity"]').value),
      examDayIntensity: Number(el.querySelector('[data-p="examDayIntensity"]').value),
      curve: el.querySelector('[data-p="curve"]').value,
      bufferDays: Number(el.querySelector('[data-p="bufferDays"]').value) || 0,
      weekendPreference: el.querySelector('[data-p="weekendPreference"]').value,
    });
    const drawPreview = () => {
      const p = readPacing();
      el.querySelector('#pdv').textContent = p.prepDays;
      el.querySelector('#piv').textContent = Math.round(p.prepIntensity * 100) + '%';
      const examDay = today();
      const start = addDays(examDay, -(Math.max(p.prepDays, 1) + 2));
      const total = Math.max(p.prepDays, 1) + 4;
      const bars = [];
      for (let i = 0; i <= total; i++) {
        const d = addDays(start, i);
        let v = 0, lab = fmtMD(d);
        const rel = diffDays(d, examDay); // 距考试天数
        if (rel === 0) v = p.examDayIntensity;
        else if (rel > 0 && p.prepDays > 0 && rel <= p.prepDays) {
          const prog = (p.prepDays - rel + 1) / p.prepDays;
          const w = p.curve === 'step' ? 1 : p.curve === 'sprint' ? Math.pow(prog, 2.2) : prog;
          v = p.prepIntensity * w;
        } else if (rel < 0 && -rel <= p.bufferDays) v = 0.5;
        bars.push({ d, v, rel });
      }
      el.querySelector('#pacePreview').innerHTML = `
        <div style="font-size:10.5px;color:var(--tx3);margin-top:6px" data-hint style="margin-bottom:6px">模拟一场考试前的精力曲线</div>
        <div style="display:flex;gap:3px;align-items:flex-end;height:64px">
          ${bars.map(b => `<div title="${fmtCn(b.d)} 可用 ${Math.round((1 - Math.min(b.v, 1)) * 100)}%" style="flex:1;height:${Math.max(4, (1 - Math.min(b.v, 1)) * 56)}px;background:${b.rel === 0 ? '#ef4444' : b.v > .6 ? '#b45309' : b.v > .05 ? '#b8933a' : '#22c55e'};border-radius:3px"></div>`).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx3)"><span>${esc(fmtMD(bars[0].d))}</span><span>考试日</span><span>${esc(fmtMD(bars[bars.length - 1].d))}</span></div>
        <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
          ${[['快快突击', { prepDays: 3, prepIntensity: 0.9, curve: 'step' }],
             ['稳扎稳打', { prepDays: 14, prepIntensity: 0.5, curve: 'linear' }],
             ['前松后紧', { prepDays: 10, prepIntensity: 0.8, curve: 'sprint' }],
             ['基本不影响', { prepDays: 2, prepIntensity: 0.2, curve: 'step' }]].map(([n, p]) =>
            `<button class="btn sm ghost" data-preset='${esc(JSON.stringify(p))}'>${n}</button>`).join('')}
        </div>`;
    };
    el.querySelectorAll('[data-p]').forEach(x => { x.oninput = drawPreview; x.onchange = drawPreview; });
    drawPreview();
    $$('[data-preset]', el).forEach(b => b.onclick = () => {
      const p = JSON.parse(b.dataset.preset);
      $$('[data-p]', el).forEach(x => { if (p[x.dataset.p] !== undefined) x.value = p[x.dataset.p]; });
      drawPreview();
    });

    el.querySelector('#saveMember').onclick = () => {
      m.name = el.querySelector('[data-f="name"]').value.trim() || '未命名';
      m.color = el.querySelector('[data-f="color"]').value;
      m.note = el.querySelector('[data-f="note"]').value;
      m.roles = pickerValues(el, 'roles');
      m.subsystems = pickerValues(el, 'subsystems');
      m.pacing = readPacing();
      if (isNew) { state.members.push(m); logActivity('member', `添加成员 ${m.name}`); }
      commit('已保存');
      closeFn();
    };
    el.querySelector('#delMember')?.addEventListener('click', () => {
      if (!confirm(`删除成员 ${m.name}？其考试记录也会一并删除。`)) return;
      state.members = state.members.filter(x => x.id !== m.id);
      // 从所有考试/占用里移除该成员（旧 memberId 或新 participantIds），并在个性化覆盖里清掉
      state.unavailables.forEach(u => {
        if (u.memberId === m.id) u.memberId = '';
        if (u.participantIds) u.participantIds = u.participantIds.filter(x => x !== m.id);
        if (u.memberOverrides && u.memberOverrides[m.id]) delete u.memberOverrides[m.id];
      });
      state.tasks.forEach(t => { t.ownerIds = (t.ownerIds || []).filter(x => x !== m.id); t.helperIds = (t.helperIds || []).filter(x => x !== m.id); });
      logActivity('member', `删除成员 ${m.name}`);
      commit('已删除'); closeFn();
    });
  });
}

/* =========================================================================
 *  弹窗：考试 / 不可用
 * ========================================================================= */
function openUnavailModal(id, preset = {}) {
  const isNew = !id;
  const cur = isNew ? {
    id: uid('u'),
    typeId: state.unavailTypes[0]?.id,
    start: preset.start || today(), end: preset.start || today(), note: '', kind: 'exam', intensity: 1,
    participantIds: preset.participantIds || [],
    pacingDefault: null, memberOverrides: {},
    recurring: null,
  } : JSON.parse(JSON.stringify(state.unavailables.find(x => x.id === id)));
  if (!cur) return;
  // 兼容旧数据：单 memberId 记录转成 participantIds
  if (cur.memberId && !cur.participantIds) { cur.participantIds = [cur.memberId]; delete cur.memberId; }
  if (cur.pacingOverride && !cur.pacingDefault) { cur.pacingDefault = cur.pacingOverride; delete cur.pacingOverride; }
  cur.participantIds = cur.participantIds || [];
  cur.memberOverrides = cur.memberOverrides || {};
  if (!state.members.length) return toast('请先添加成员', true);

  const isExam = cur.kind === 'exam';
  const chip = (m, checked) => `<span class="chip ${checked ? 'on' : ''}" data-pick-mem="${m.id}">${esc(m.name)}</span>`;
  const ovRow = (m) => {
    const ov = cur.memberOverrides[m.id] || {};
    const hasOv = !!cur.memberOverrides[m.id];
    return `<div class="dline" data-ov-row="${m.id}" style="flex-wrap:wrap">
      ${avatar(m)}<span style="font-size:11px" style="width:60px">${esc(m.name)}</span>
      <input type="number" min="0" max="60" data-ov="${m.id}:prepDays" placeholder="默认" value="${ov.prepDays ?? ''}" style="width:64px;padding:3px 6px" title="提前准备天数">
      <input type="number" min="0" max="1" step="0.05" data-ov="${m.id}:prepIntensity" placeholder="强度" value="${ov.prepIntensity ?? ''}" style="width:64px;padding:3px 6px" title="复习强度0~1">

      <input type="number" min="0" max="10" data-ov="${m.id}:bufferDays" placeholder="恢复" value="${ov.bufferDays ?? ''}" style="width:56px;padding:3px 6px" title="考后恢复天数">

    </div>`;
  };

  const body = `
    <div class="field full"><label>说明（科目名等）</label><input type="text" data-f="note" value="${esc(cur.note || '')}" placeholder="例如：概率论、电路期末"></div>
    <div class="fgrid">
      <div class="field"><label>类型</label><select data-f="typeId">${state.unavailTypes.map(x => `<option value="${x.id}" ${x.id === cur.typeId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><label>是否推演复习期</label>
        <label style="display:flex;align-items:center;gap:6px;height:30px"><input type="checkbox" data-f="isExam" ${isExam ? 'checked' : ''}><span>考试 → 自动生成复习降效期</span></label></div>

      <div class="field"><label>当天占用程度</label>
        <select data-f="intensity">${[[1, '完全不可用'], [0.5, '半天'], [0.25, '一点时间'], [0, '不影响']].map(([v, n]) => `<option value="${v}" ${Number(cur.intensity) === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    </div>

    <div class="blk">
      <h3>参加的人</h3>
      <div class="picker" id="memPicker">
        ${state.members.map(m => chip(m, cur.participantIds.includes(m.id))).join('')}
        <button class="btn sm ghost" id="pickAll">全选</button>
        <button class="btn sm ghost" id="pickNone">清空</button>
      </div>
    </div>

    <div class="blk" style="background:var(--raised)" id="paceDefaultBox">
      <h3>整场默认节奏 <span style="font-size:10.5px;color:var(--tx3);font-weight:500;margin-left:6px">留空 = 用每人自己的节奏</span></h3>
      <div class="fgrid">
        <div class="field"><label>提前准备天数</label><input type="number" min="0" max="60" data-o="prepDays" value="${cur.pacingDefault?.prepDays ?? ''}" placeholder="用个人默认"></div>
        <div class="field"><label>复习期占用强度 (0~1)</label><input type="number" min="0" max="1" step="0.05" data-o="prepIntensity" value="${cur.pacingDefault?.prepIntensity ?? ''}" placeholder="用个人默认"></div>
        <div class="field"><label>降效曲线</label>
          <select data-o="curve"><option value="">用个人默认</option>${CURVES.map(c => `<option value="${c.id}" ${cur.pacingDefault?.curve === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select></div>
        <div class="field"><label>考后恢复天数</label><input type="number" min="0" max="10" data-o="bufferDays" value="${cur.pacingDefault?.bufferDays ?? ''}" placeholder="用个人默认"></div>

      if (chipEl) {

        cur.participantIds = cur.participantIds.includes(mid) ? cur.participantIds.filter(x => x !== mid) : [...cur.participantIds, mid];
        chipEl.classList.toggle('on', cur.participantIds.includes(mid));

        return;

      cur.end = el.querySelector('[data-f="end"]').value || cur.start;
      cur.note = el.querySelector('[data-f="note"]').value;
      cur.intensity = Number(el.querySelector('[data-f="intensity"]').value);
      cur.kind = isExamSel.checked ? 'exam' : 'event';
      if (rec.checked) {
        const days = $$('[data-recd]', el).filter(x => x.checked).map(x => Number(x.dataset.recd));
        cur.recurring = days.length ? { days, until: el.querySelector('[data-f="recUntil"]').value || '' } : null;
      } else cur.recurring = null;

      // 整场默认节奏
      const def = {};
      $$('[data-o]', el).forEach(x => { if (x.value !== '') def[x.dataset.o] = x.tagName === 'SELECT' ? x.value : Number(x.value); });
      cur.pacingDefault = Object.keys(def).length ? def : null;

      // 个性化覆盖（只保留勾选的人，且值非空）
      const ovs = {};
      $$('[data-ov-row]', el).forEach(rowEl => {
        const mid = rowEl.dataset.ovRow;
        const o = {};
        $$('[data-ov]', rowEl).forEach(x => {
          if (x.value !== '') {
            const key = x.dataset.ov.split(':')[1];
            o[key] = x.tagName === 'SELECT' ? x.value : Number(x.value);
          }
        });
        if (Object.keys(o).length) ovs[mid] = o;
      });
      cur.memberOverrides = ovs;
      delete cur.memberId; delete cur.pacingOverride;  // 清理旧字段

      if (!cur.participantIds.length) return toast('请至少勾选一个参加的人', true);
      if (isNew) {
        state.unavailables.push(cur);
        const names = cur.participantIds.map(id => member(id)?.name || '?').join('、');
        logActivity('unavail', `${cur.note || typeOf(cur.typeId).name} ${cur.start}：${names}`);
      }
      commit('已保存');
      closeFn();
    };
    el.querySelector('#delU')?.addEventListener('click', () => {
      state.unavailables = state.unavailables.filter(x => x.id !== cur.id);
      commit('已删除'); closeFn();
    });
  });
}

/* =========================================================================
 *  导入导出
 * ========================================================================= */
function download(filename, text, type = 'application/json') {
  const blob = new Blob([text], { type: type + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportJson() {
  download(`RC2027进度_${today()}.json`, JSON.stringify(state, null, 2));
  toast('已导出 JSON');
}
function exportCsv() {
  const head = ['标题', '子系统', '负责人', '协作人', '开始', '截止', '优先级', '状态', '检查点', '完成度%', '工时', '标签', '描述'];
  const rows = state.tasks.map(t => [
    t.title, subName(t.subsystemId),
    (t.ownerIds || []).map(id => member(id)?.name || '').join('/'),
    (t.helperIds || []).map(id => member(id)?.name || '').join('/'),
    t.start || '', t.due || '', prioOf(t).name, statusOf(t).name, taskCpSummary(t), taskPct(t), t.estimateHours || '',
    (t.tags || []).join('|'), (t.description || '').replace(/\n/g, ' '),
  ]);
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  download(`RC2027任务_${today()}.csv`, csv, 'text/csv');
  toast('已导出 CSV');
}
function importJson() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const file = inp.files[0]; if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const data = JSON.parse(fr.result);
        if (!data || !Array.isArray(data.tasks)) throw new Error('文件里没有找到任务数据，可能不是本工具导出的文件');
        if (!confirm('导入会覆盖当前全部数据，确定吗？（建议先导出备份）')) return;
        state = migrate(data);
        save(true); renderAll(); toast('导入成功');
      } catch (e) { toast('导入失败：' + e.message, true); }
    };
    fr.readAsText(file, 'utf-8');
  };
  inp.click();
}

/* =========================================================================
 *  toast
 * ========================================================================= */
let toastTimer = null;
function toast(msg, isErr = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'on' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2600);
}

/* =========================================================================

 * ========================================================================= */
const SESSION_KEY = 'rc2027_user_v1';
function users() { if (!Array.isArray(state.users)) state.users = []; return state.users; }
function pinHash(pin) {
  const s = 'rc27:' + String(pin || '');
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return ('00000000' + h.toString(16)).slice(-8);
}
function currentUserId() { try { return localStorage.getItem(SESSION_KEY) || ''; } catch (e) { return ''; } }
function me() { return users().find(u => u.id === currentUserId()) || null; }
function isAdmin() { const u = me(); return !!u && u.role === 'admin'; }
function myMemberId() { const u = me(); return u && u.memberId ? u.memberId : ''; }
function myMember() { return state.members.find(m => m.id === myMemberId()) || null; }
function canEditTask(t) { return isAdmin() || (!!t && !!myMemberId() && (t.ownerIds || []).includes(myMemberId())); }
function requireAdmin(msg) { if (isAdmin()) return true; toast(msg || '只有管理员能做这个操作', true); return false; }

/* ================= 泳道条：拖左右边界调整持续时间 ================= */
function bindBarResize(bar, handle, dayW) {
  let R = null;
  const tip = () => {
    let el = document.getElementById('dragTip');
    if (!el) { el = document.createElement('div'); el.id = 'dragTip'; el.className = 'drag-tip'; document.body.appendChild(el); }
    return el;
  };
  const hideTip = () => { const el = document.getElementById('dragTip'); if (el) el.remove(); };
  const impactOf = (t, ns, nd) => {
    const av = buildAvailability(ns, nd);
    let hard = 0, soft = 0;
    for (let d = ns; d <= nd; d = addDays(d, 1)) {
      for (const oid of (t.ownerIds || [])) {
        const r = av.get(oid) && av.get(oid).get(d);
        if (!r) continue;
        if (r.hard > .5) hard++;
        else if ((r.pbusy ?? r.busy) > .5) soft++;
      }
    }
    return { hard, soft };
  };

  const onMove = e => {
    if (!R) return;
    e.preventDefault();
    let dd = Math.round((e.clientX - R.x0) / dayW);
    let ns = R.s0, nd = R.d0;
    if (R.edge === 'start') {
      ns = addDays(R.s0, dd);
      if (ns > R.d0) { ns = R.d0; dd = diffDays(R.s0, ns); }
      bar.style.left = (R.left + dd * dayW) + 'px';
      bar.style.width = Math.max(dayW * 0.6, R.width - dd * dayW) + 'px';
    } else {
      nd = addDays(R.d0, dd);
      if (nd < R.s0) { nd = R.s0; dd = diffDays(R.d0, nd); }
      bar.style.width = Math.max(dayW * 0.6, R.width + dd * dayW) + 'px';
    }
    R.dd = dd; R.ns = ns; R.nd = nd;
    const im = impactOf(R.t, ns, nd);
    const tp = tip();
    tp.innerHTML = '<b>' + fmtMD(ns) + ' → ' + fmtMD(nd) + '</b><div class="' + (im.hard ? 'bad' : '') + '">持续 ' +
      (diffDays(ns, nd) + 1) + ' 天 · ' + (R.edge === 'start' ? '拖动开始' : '拖动截止') +
      (im.hard ? ' · 撞 ' + im.hard + ' 天考试' : '') + (im.soft ? ' · ' + im.soft + ' 天复习期' : '') + '</div>';
    tp.style.left = Math.min(e.clientX + 14, window.innerWidth - 220) + 'px';
    tp.style.top = (e.clientY + 16) + 'px';
  };

  const detach = () => {
    document.removeEventListener('pointermove', onMove, true);
    document.removeEventListener('pointerup', onUp, true);
    document.removeEventListener('pointercancel', onCancel, true);
  };
  const onUp = () => {
    if (!R) return;
    const R0 = R; R = null;
    detach();
    hideTip();
    bar.classList.remove('resizing');
    if (!R0.dd) { renderStage(); return; }
    if (R0.t.link) R0.t.link = null;
    R0.t.start = R0.ns; R0.t.due = R0.nd;
    window._laneResizedAt = Date.now();
    logActivity('task', '拖动调整「' + R0.t.title + '」为 ' + fmtMD(R0.ns) + ' – ' + fmtMD(R0.nd));
    commit(); renderStage();
    toast('已调整为 ' + fmtMD(R0.ns) + ' – ' + fmtMD(R0.nd) + '（' + (diffDays(R0.ns, R0.nd) + 1) + ' 天）');
  };
  const onCancel = () => {
    if (!R) return;
    R = null;
    detach();
    hideTip();
    bar.classList.remove('resizing');
    renderStage();
  };

  handle.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); }, true);
  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const t = state.tasks.find(x => x.id === bar.dataset.dragTask);
    if (!t || !t.start || !t.due || !canEditTask(t)) return;
    e.stopPropagation(); e.preventDefault();
    R = { t, edge: handle.dataset.rs, x0: e.clientX, dd: 0,
      left: parseFloat(bar.style.left) || 0, width: parseFloat(bar.style.width) || 0,
      s0: t.start, d0: t.due, ns: t.start, nd: t.due };
    bar.classList.add('resizing');
    document.addEventListener('pointermove', onMove, true);
    document.addEventListener('pointerup', onUp, true);
    document.addEventListener('pointercancel', onCancel, true);
  });
}

function decorateLaneBars() {
  if (ui.tab !== 'lane') return;
