<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC2027 排球 · 指挥台</title>
<style>
/* =========================================================================
 *  RC2027 · Command Deck design tokens
 *  canvas → surface → raised 材质分层；单一强调色；无语义边框
 * ========================================================================= */
:root{
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:16px;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --t-fast:120ms; --t:150ms; --t-slow:220ms;
  --fnt:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Consolas,monospace;
}
/* ---------- 深色（默认） ---------- */
:root[data-theme="dark"]{
  --canvas:#08090c;
  --surface:#0e1016;
  --raised:#151922;
  --raised2:#1b2029;
  --line:#1c212b;
  --line2:#262d3a;
  --tx:#e8edf5;
  --tx2:#94a0b3;
  --tx3:#5c6678;
  --acc:#2fd3c3;
  --acc-dim:rgba(47,211,195,.13);
  --acc-line:rgba(47,211,195,.35);
  --danger:#ff5c5c;
  --danger-dim:rgba(255,92,92,.12);
  --warn:#e0a33a;
  --warn-dim:rgba(224,163,58,.12);
  --busy-fill:rgba(224,163,58,.05);
  --busy-line:rgba(224,163,58,.12);
  --busy-stripe:rgba(224,163,58,.55);
  --busy-band:rgba(224,163,58,.14);
  --hard-fill:rgba(255,92,92,.10);
  --hard-line:rgba(255,92,92,.38);
  --hard-band:rgba(255,92,92,.55);
  --ok:#3ecf7e;
  --ok-dim:rgba(62,207,126,.12);
  --mask:rgba(0,0,0,.62);
  --heat-0:#12161d; --heat-1:#1b3b33; --heat-2:#2c5f45; --heat-3:#6b5320; --heat-4:#7d3a24; --heat-5:#7a2424;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 10px 30px -8px rgba(0,0,0,.7);
  --shadow-3:0 28px 70px -14px rgba(0,0,0,.85);
  --grad:radial-gradient(120% 90% at 80% -20%,rgba(47,211,195,.09),transparent 62%);
}
/* ---------- 浅色 ---------- */
:root[data-theme="light"]{
  --canvas:#f4f5f7;
  --surface:#ffffff;
  --raised:#f7f8fa;
  --raised2:#eef0f4;
  --line:#e6e9ee;
  --line2:#d7dce4;
  --tx:#10151d;
  --tx2:#54606f;
  --tx3:#8d97a6;
  --acc:#0fa598;
  --acc-dim:rgba(15,165,152,.10);
  --acc-line:rgba(15,165,152,.3);
  --danger:#d93a3a;
  --danger-dim:rgba(217,58,58,.09);
  --warn:#b8791a;
  --warn-dim:rgba(184,121,26,.10);
  --busy-fill:rgba(184,121,26,.055);
  --busy-line:rgba(184,121,26,.14);
  --busy-stripe:rgba(184,121,26,.42);
  --busy-band:rgba(184,121,26,.12);
  --hard-fill:rgba(217,58,58,.08);
  --hard-line:rgba(217,58,58,.32);
  --hard-band:rgba(217,58,58,.45);
  --ok:#18995a;
  --ok-dim:rgba(24,153,90,.10);
  --mask:rgba(16,21,29,.34);
  --heat-0:#eef0f3; --heat-1:#d3eee6; --heat-2:#9ed4bd; --heat-3:#e3cd94; --heat-4:#e7b49f; --heat-5:#dfa0a0;
  --shadow-1:0 1px 2px rgba(16,21,29,.06);
  --shadow-2:0 10px 30px -10px rgba(16,21,29,.16);
  --shadow-3:0 28px 70px -18px rgba(16,21,29,.24);
  --grad:radial-gradient(120% 90% at 80% -20%,rgba(15,165,152,.07),transparent 62%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--canvas) var(--grad) fixed;
  color:var(--tx); font-family:var(--fnt); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
input,select,textarea,button{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
::selection{background:var(--acc-dim);color:var(--tx)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none !important}

/* =========================================================================
 *  顶栏
 * ========================================================================= */
#app{display:flex;flex-direction:column;height:100vh}

header#top{
  height:52px;flex:none;display:flex;align-items:center;gap:16px;
  padding:0 16px 0 18px;
  background:linear-gradient(180deg,rgba(255,255,255,.025),transparent);
  border-bottom:1px solid var(--line);
  position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand .logo{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-size:13px;background:linear-gradient(145deg,var(--acc),#1a8f86);color:#04201d;
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;
}
.brand .nm{font-weight:640;letter-spacing:-.1px;font-size:15px;line-height:1.15}
.brand .nm small{display:block;font-size:10px;color:var(--tx3);font-weight:500;letter-spacing:.4px}

.pulse{display:flex;align-items:center;gap:14px;margin-left:6px}
.pulse .pitem{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.pulse .pitem .v{font-size:16.5px;font-weight:660;letter-spacing:-.3px}
.pulse .pitem .k{font-size:11.5px;color:var(--tx3);letter-spacing:.3px}
.pulse .pitem.bad .v{color:var(--danger)}
.pulse .pitem.warn .v{color:var(--warn)}
.pulse .pitem.good .v{color:var(--acc)}

.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.iconbtn{
  width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--tx2);transition:background var(--t),color var(--t);
}
.iconbtn:hover{background:var(--raised);color:var(--tx)}
.kbtn{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 9px 0 10px;
  border-radius:var(--r-sm);background:var(--raised);color:var(--tx2);
  font-size:13px;transition:background var(--t),color var(--t);
}
.kbtn:hover{background:var(--raised2);color:var(--tx)}
.kbtn kbd{
  font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;
  background:var(--canvas);color:var(--tx3);box-shadow:0 0 0 1px var(--line2) inset;
}

/* =========================================================================
 *  三栏骨架
 * ========================================================================= */
#deck{flex:1;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:0}
@media (max-width:1240px){
  #deck{grid-template-columns:224px minmax(0,1fr)}
}
@media (max-width:1080px){
  #deck{grid-template-columns:minmax(0,1fr)}
  aside#railL,aside#railR{display:none}
}

aside#railL,aside#railR{
  min-height:0;overflow-y:auto;display:flex;flex-direction:column;
  padding:14px 12px 24px;gap:18px;
}
aside#railL{border-right:1px solid var(--line)}
aside#railR{border-left:1px solid var(--line)}
.rail-sec{display:flex;flex-direction:column;gap:8px}
.rail-h{
  display:flex;align-items:center;gap:7px;padding:0 4px;
  font-size:11.5px;font-weight:620;letter-spacing:.9px;text-transform:uppercase;color:var(--tx3);
}
.rail-h .n{color:var(--tx3);font-weight:500;letter-spacing:0;text-transform:none;margin-left:auto;font-size:12px}
.rail-h .b{color:var(--danger)}

/* ---------- 语言：卡片/行 ---------- */
.surf{background:var(--surface);border-radius:var(--r-md);padding:10px 11px}
.surf.flat{background:transparent;padding:0}
.rowline{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-sm);
  cursor:pointer;min-width:0;
  transition:background 160ms ease,transform 160ms cubic-bezier(.22,1,.36,1),box-shadow 160ms ease;
}
@media (hover:hover){
  .rowline:hover{
    background:var(--raised);transform:translateX(2px) scale(1.012);
    box-shadow:0 2px 10px -6px rgba(0,0,0,.6);
  }
}
.rowline:active{transform:translateX(1px) scale(.998)}
.rowline .grow{min-width:0;flex:1}
.rowline .t{font-size:13.5px;font-weight:530;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowline .s{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rowline.static{cursor:default}
.rowline.static:hover{background:transparent}

.dotc{width:6px;height:6px;border-radius:50%;flex:none;background:var(--tx3)}

/* 状态符号（不只靠颜色） */
.stsym{
  width:17px;height:17px;border-radius:5px;flex:none;display:grid;place-items:center;
  font-size:9px;line-height:1;font-weight:700;color:var(--canvas);
  box-shadow:0 0 0 1px rgba(0,0,0,.25) inset;
}
:root[data-theme="light"] .stsym{color:#fff;box-shadow:none}

/* 迷你进度 */
.mbar{height:3px;border-radius:3px;background:var(--raised2);overflow:hidden;flex:none}
.mbar>i{display:block;height:100%;border-radius:3px;background:var(--acc);transition:width var(--t-slow) var(--ease)}
.mbar>i.done{background:var(--ok)}

/* 头像 */
.av{
  width:21px;height:21px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:9.5px;font-weight:700;color:#06110f;letter-spacing:0;
}
:root[data-theme="light"] .av{color:#fff}
.avs{display:flex;flex:none}
.avs .av{margin-left:-5px;box-shadow:0 0 0 1.5px var(--surface)}
.avs .av:first-child{margin-left:0}

/* =========================================================================
 *  主舞台
 * ========================================================================= */
main#stage{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.stage-head{
  flex:none;display:flex;align-items:center;gap:9px;padding:12px 18px 11px;flex-wrap:nowrap;
  border-bottom:1px solid var(--line);
}
.stage-head>div:first-child{flex:none;min-width:0}
.stage-title{font-size:17px;font-weight:640;letter-spacing:-.2px;white-space:nowrap}
.stage-sub{font-size:12.5px;color:var(--tx3);margin-top:2px;white-space:nowrap}
.viewsw{display:flex;flex:none;gap:1px;background:var(--raised);border-radius:var(--r-sm);padding:1px;margin-left:2px}
.viewsw button{
  padding:3px 4px;border-radius:6px;font-size:11.3px;font-weight:550;color:var(--tx3);
  transition:background var(--t-fast),color var(--t-fast);
}
.viewsw button:hover{color:var(--tx2)}
.viewsw button.on{background:var(--raised2);color:var(--tx);box-shadow:var(--shadow-1)}
.stage-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;flex:none}

/* ---------- 顶栏快速添加 ---------- */
.quickadd{
  display:flex;align-items:center;gap:6px;margin-left:auto;margin-right:4px;
  height:30px;padding:0 4px 0 9px;border-radius:var(--r-sm);
  background:var(--raised);border:1px solid transparent;
  transition:border-color var(--t-fast),background var(--t-fast);
  max-width:330px;flex:0 1 330px;
}
.quickadd:focus-within{border-color:var(--acc-line);background:var(--raised2)}
.quickadd .qa-ic{color:var(--acc);font-size:14px;font-weight:700;line-height:1}
.quickadd input{
  flex:1;min-width:0;background:transparent!important;border:none!important;
  font-size:13px;color:var(--tx);padding:0!important;height:26px!important;
}
.quickadd input::placeholder{color:var(--tx3)}
.quickadd .qa-more{
  flex:none;height:22px;padding:0 7px;border-radius:var(--r-xs);font-size:12px;
  color:var(--tx3);background:var(--raised2);
}
.quickadd .qa-more:hover{color:var(--tx);background:var(--line2)}
#stageBody{flex:1;min-height:0;overflow:auto;padding:14px 20px 40px}

/* ---------- 通用按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:28px;padding:0 11px;border-radius:var(--r-sm);
  background:var(--raised);color:var(--tx2);font-size:13px;font-weight:540;
  transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast);
  white-space:nowrap;
}
.btn:hover{background:var(--raised2);color:var(--tx)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:#04201d;font-weight:620}
.btn.primary:hover{background:var(--acc);filter:brightness(1.08);color:#04201d}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--raised)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-dim)}
.btn.sm{height:26px;padding:0 9px;font-size:12.5px;border-radius:var(--r-xs)}
.stage-actions .btn{height:32px;padding:0 10px;font-size:12.5px;font-weight:560}
.stage-actions .btn .ic{font-size:14px;font-weight:700;margin-right:-2px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn .ic{font-size:12px;line-height:1}

input[type=text],input[type=date],input[type=number],input[type=color],input[type=search],select,textarea{
  background:var(--canvas);border:none;border-radius:var(--r-sm);
  padding:6px 9px;color:var(--tx);outline:none;min-width:0;
  box-shadow:0 0 0 1px var(--line2) inset;
  transition:box-shadow var(--t-fast);
  font-size:13.5px;
}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 1px var(--acc) inset}
input::placeholder,textarea::placeholder{color:var(--tx3)}
select{appearance:none;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
input[type=color]{padding:2px;height:26px;width:34px;cursor:pointer}
textarea{resize:vertical;min-height:64px;line-height:1.5}
input[type=range]{accent-color:var(--acc);height:3px;background:var(--raised2);border-radius:3px;appearance:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--acc);cursor:pointer;box-shadow:var(--shadow-1)}
input[type=checkbox]{accent-color:var(--acc)}

/* ---------- 泳道图 LaneView ---------- */
.lane-wrap{display:flex;flex-direction:column;gap:0;background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.lane-head,.lane-row{display:flex;align-items:stretch;min-height:0}
.lane-head{position:sticky;top:0;z-index:12;background:var(--surface);border-bottom:1px solid var(--line)}
.lane-lab{
  flex:none;width:186px;padding:0 12px;display:flex;align-items:center;gap:7px;
  font-size:12.5px;font-weight:560;color:var(--tx2);
  position:sticky;left:0;z-index:11;background:var(--surface);
  border-right:1px solid var(--line);
}
.lane-head .lane-lab{height:46px;font-size:11.5px;letter-spacing:.4px;color:var(--tx3);text-transform:uppercase;font-weight:620}
.lane-track{position:relative;flex:none;overflow:hidden}
.lane-row{border-bottom:1px solid var(--line)}
.lane-row:last-child{border-bottom:none}
.lane-row:hover .lane-lab{background:var(--raised)}
.lane-row .lane-lab{height:44px;transition:background var(--t-fast)}
.lane-track .dgrid{position:absolute;inset:0;display:flex;pointer-events:none}
.dgrid .dc{flex:none;border-right:1px solid var(--line)}
.dgrid .dc.dim{background:rgba(255,255,255,.014)}
:root[data-theme="light"] .dgrid .dc.dim{background:rgba(16,21,29,.022)}
.dgrid .dc.today{background:var(--acc-dim);border-right-color:var(--acc-line)}
.dhd{display:flex;height:44px;align-items:center}
.dhd .dh{
  flex:none;text-align:center;font-size:11px;color:var(--tx3);
  display:flex;flex-direction:column;justify-content:center;gap:0;height:100%;
}
.dhd .dh.today{color:var(--acc);font-weight:700}
.dhd .dh.weekend{color:var(--tx3);opacity:.72}
.dhd .dh .m{font-size:10px;opacity:.75;line-height:1.1}

/* 占用遮罩 */
.off-mask{position:absolute;top:0;bottom:12px;border-radius:3px 3px 0 0;pointer-events:none;transition:opacity 180ms ease;
  background:var(--busy-fill);box-shadow:inset 0 0 0 1px var(--busy-line)}
.off-mask.hard{background:var(--hard-fill);box-shadow:inset 0 0 0 1px var(--hard-line)}
@media (hover:hover){.lane-track:hover .off-mask{opacity:.8}}
.offband{position:absolute;left:0;right:0;bottom:0;height:12px;z-index:6;pointer-events:none;
  background:rgba(255,255,255,.015);border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.off-cell{position:absolute;bottom:0;height:12px;pointer-events:auto;cursor:pointer;border-radius:2px;
  transition:filter 140ms ease,box-shadow 140ms ease}
.off-cell.soft{background:repeating-linear-gradient(135deg,var(--busy-stripe) 0 3px,transparent 3px 9px),var(--busy-band)}
.off-cell.hard{background:var(--hard-band)}
.off-cell:hover{filter:brightness(1.35);box-shadow:0 0 0 1px var(--busy-line) inset}
.off-cell.hard:hover{box-shadow:0 0 0 1px var(--hard-line) inset}
:root[data-theme="light"] .offband{background:rgba(16,21,29,.012);box-shadow:inset 0 1px 0 rgba(16,21,29,.04)}

/* 人员与任务管理 */
.mg{display:grid;grid-template-columns:minmax(0,1fr) 318px;gap:12px;align-items:start}
.mg-dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.05)}
.mg-link{background:none;border:none;padding:0;color:var(--tx3);font-size:11.2px;cursor:pointer;white-space:nowrap;font-family:inherit}
.mg-link:hover{color:var(--acc);text-decoration:underline}
.mg-top{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mg-list{display:flex;flex-direction:column;gap:6px;min-width:0}
.mg-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:background var(--t-fast),border-color var(--t-fast)}
.mg-row:hover{background:var(--raised)}
.mg-row.on{border-color:var(--acc-line);background:var(--acc-dim)}
.mg-row input[type="checkbox"]{pointer-events:none;accent-color:var(--acc)}
.mg-row .nm{flex:1;min-width:0;font-size:12.8px;font-weight:560;color:var(--tx)}
.mg-row .sub{font-size:11.2px;color:var(--tx3);font-weight:400;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-row .meta{font-size:11.2px;color:var(--tx3);white-space:nowrap}
.mg-panel{position:sticky;top:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.mg-panel h4{margin:0;font-size:12.5px;color:var(--tx2);font-weight:620;letter-spacing:.3px}
.mg-chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mg-chip{height:24px;padding:0 9px;border-radius:999px;font-size:11.2px;color:var(--tx3);background:var(--raised);border:1px solid transparent;cursor:pointer;transition:background var(--t-fast),color var(--t-fast)}
.mg-chip:hover{color:var(--tx);background:var(--raised2)}
.mg-chip.on{background:var(--acc-dim);color:var(--acc);border-color:var(--acc-line)}
.mg-chip.part{background:var(--warn-dim);color:var(--warn)}
.mg-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.mg-fields .field{min-width:0}
.mg-note{font-size:11px;color:var(--tx3);line-height:1.5}
.mg-hr{border:none;border-top:1px solid var(--line);margin:2px 0;width:100%}
.mg-empty{grid-column:1/-1;padding:26px;text-align:center;color:var(--tx3);font-size:12.5px;border:1px dashed var(--line);border-radius:var(--r-md)}
@media (max-width:1180px){.mg{grid-template-columns:1fr}.mg-panel{position:static}}
/* 任务条 */
.lbar{
  position:absolute;height:18px;border-radius:5px;display:flex;align-items:center;
  overflow:hidden;cursor:pointer;background:var(--raised2);
  transform-origin:center center;will-change:transform;
  transition:transform 180ms cubic-bezier(.22,1,.36,1),box-shadow 180ms cubic-bezier(.22,1,.36,1),
             opacity 180ms ease,filter 180ms ease;
  box-shadow:0 0 0 1px rgba(0,0,0,.28) inset;
}
@media (hover:hover){
  .lbar:hover{transform:scale(1.06);z-index:20;
    box-shadow:0 0 0 1.5px var(--acc),0 6px 20px -6px rgba(0,0,0,.6);}
  .lane-track:hover .lbar:not(:hover){opacity:.6;filter:saturate(.65)}
}
.lbar:active{transform:scale(1.02)}

<style>
/* 尊重系统"减弱动态效果"：关掉所有位移/缩放，只留透明度 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    transition-duration:.01ms!important;animation-duration:.01ms!important;
    animation-iteration-count:1!important;
  }
  .lbar:hover,.kcard:hover,.excard:hover,.rowline:hover,.hm td.cell:hover{transform:none!important}
}

/* =========================================================================
 *  跟随气泡 Popover —— 悬停预览 / 点击就地编辑
 * ========================================================================= */
#pop{
  position:fixed;z-index:600;width:308px;max-height:min(76vh,560px);overflow:auto;
  background:var(--raised);border-radius:var(--r-md);padding:0;
  box-shadow:0 0 0 1px var(--line2),0 20px 48px -14px rgba(0,0,0,.72),0 4px 10px -4px rgba(0,0,0,.4);
  opacity:0;transform:scale(.965) translateY(-2px);transform-origin:top left;
  pointer-events:none;
  transition:opacity 130ms ease,transform 150ms cubic-bezier(.22,1,.36,1);
}
#pop.on{opacity:1;transform:none;pointer-events:auto}

/* 检查点行（气泡内） */

/* 进度条（气泡内） */

.pbar>i{display:block;height:100%;border-radius:4px;background:var(--acc);transition:width 220ms var(--ease)}
.pbar>i.done{background:var(--ok)}

/* 气泡内的字段行（点击编辑） */
.pr{display:flex;align-items:center;gap:8px;font-size:12.5px;min-height:26px}

}

  transition:background 130ms ease,color 130ms ease}

<script>

"use strict";
/* =========================================================================
 *  RC2027 排球 · 进度控制台
 *  单文件、零依赖、数据存 LocalStorage
 * ========================================================================= */

const STORE_KEY = 'rc2027_progress_v1';
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------- 日期工具（全部本地日期字符串 YYYY-MM-DD） ---------------- */
const pad = n => String(n).padStart(2, '0');
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function today() { return ymd(new Date()); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function dayRange(a, b) { const out = []; let cur = a; let guard = 0; while (cur <= b && guard++ < 2000) { out.push(cur); cur = addDays(cur, 1); } return out; }
function isWeekend(s) { const d = parseYmd(s).getDay(); return d === 0 || d === 6; }
function fmtMD(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function fmtCn(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function weekdayName(s) { return '日一二三四五六'[parseYmd(s).getDay()]; }

/* =========================================================================
 *  默认数据
 * ========================================================================= */
const CURVES = [
  { id: 'step', name: '阶梯（到点突然没空）' },
  { id: 'linear', name: '线性（越临近越忙）' },
  { id: 'sprint', name: '冲刺型（前松后紧）' },
];

/* —— 任务进度：用检查点表达，不用百分比 —— */
function taskPct(t) {
  const cps = t.checkpoints || [];
  if (!cps.length) return 0;
  let wsum = 0, wdone = 0;
  for (const c of cps) {
    const w = Number(c.weight) > 0 ? Number(c.weight) : 1;
    wsum += w;
    if (c.done) wdone += w;
  }
  return wsum > 0 ? Math.round(wdone / wsum * 100) : 0;
}
/* 是否已全部检查点达成（若状态标为完成也算） */
function taskIsDone(t) {
  if (statusOf(t)?.isDone) return true;
  const cps = t.checkpoints || [];
  return cps.length > 0 && cps.every(c => c.done);
}
/* 是否"正在进行"（不算未开始/待验证/完成） */
function taskIsDoing(t) {
  const st = statusOf(t);
  if (!st || st.isDone) return false;
  return st.id === 'st_doing' || /进行|doing|progress/i.test(String(st.name) + st.id);
}
/* 检查点文字摘要：3/5 */
function taskCpSummary(t) {
  const cps = t.checkpoints || [];
  if (!cps.length) return '无检查点';
  const n = cps.filter(c => c.done).length;
  return `${n}/${cps.length}`;
}

/* —— 联动排期：在某任务之后开始 / 与某任务同时进行 —— */
function linkRefOf(t) {
  return (t && t.link && t.link.taskId) ? state.tasks.find(x => x.id === t.link.taskId) : null;
}
function linkText(t) {
  const r = linkRefOf(t);
  if (!r) return '';
  const off = Number(t.link.offset) || 0;
  return t.link.mode === 'with'
    ? `与「${r.title}」同时进行`
    : `在「${r.title}」结束后 ${off > 0 ? '+' + off : off} 天开始`;
}
function applyLinks() {
  const seen = new Set(), order = [];
  const visit = (t, stack) => {
    if (!t || seen.has(t.id) || stack.has(t.id)) return;
    stack.add(t.id);
    const r = linkRefOf(t);
    if (r) visit(r, stack);
    stack.delete(t.id);
    seen.add(t.id);
    order.push(t);
  };
  state.tasks.forEach(t => visit(t, new Set()));
  for (const t of order) {
    const r = linkRefOf(t);
    if (!r) { if (t.link) t.link = null; continue; }
    if (!r.start || !r.due) continue;
    if (t.link.mode === 'with') { t.start = r.start; t.due = r.due; continue; }
    const dur = Math.max(0, t.link.dur != null ? Number(t.link.dur) : diffDays(t.start || r.start, t.due || r.due));
    const start = addDays(r.due, 1 + (Number(t.link.offset) || 0));
    t.start = start;
    t.due = addDays(start, dur);
  }
}

/* —— 延续优化期：验收 DDL 过后仍可继续打磨 —— */
function contEnd(t) { return (t && t.cont && t.cont.on && t.cont.due) ? t.cont.due : ''; }
function effDue(t) { return contEnd(t) || (t && t.due) || ''; }
function contActive(t) {
  const cd = contEnd(t);
  if (!cd || !t.due) return false;
  return today() > t.due && today() <= cd && !taskIsDone(t);
}
function contLabel(t) {
  const cd = contEnd(t);
  if (!cd) return '';
  if (taskIsDone(t)) return '延续期已完成';
  if (today() <= t.due) return `延续至 ${fmtMD(cd)}`;
  return `延续优化中 · 还剩 ${Math.max(0, diffDays(today(), cd))} 天`;
}

/* —— 跨子系统协作 —— */
function pendingCollabs(t) { return ((t && t.collabs) || []).filter(c => c.status === 'pending'); }
function memberSubs(mid) {
  const s = new Set();
  state.tasks.forEach(t => { if ((t.ownerIds || []).includes(mid)) s.add(t.subsystemId); });
  const m = member(mid);
  ((m && m.subsystems) || []).forEach(x => s.add(x));
  return s;
}
function canRespondCollab(c) {
  if (isAdmin()) return true;
  const mid = myMemberId();
  if (!mid) return false;
  return memberSubs(mid).has(c.subId);
}
const INTENSITY = [
  { v: 0, name: '不受影响' },
  { v: 0.3, name: '轻度（照常干活）' },
  { v: 0.6, name: '中度（出半力）' },
  { v: 0.9, name: '重度（基本不碰）' },

];

function defaultGates() {
  return [
    { id: 'gt1', name: '方案评审', due: '', criteria: [] },
    { id: 'gt2', name: '零件加工完', due: '', criteria: [] },
    { id: 'gt3', name: '整机装配完', due: '', criteria: [] },
    { id: 'gt4', name: '联调通过', due: '', criteria: [] },
    { id: 'gt5', name: '模拟赛达标', due: '', criteria: [] },

}
function defaultState() {
  const S = (id, color, ex = []) => ({ id, name: id, color, examples: ex });
  const roles = [
    { id: 'r_mech', name: '机械', color: '#f59e0b' },
    { id: 'r_elec', name: '电控', color: '#3b82f6' },
    { id: 'r_vis', name: '视觉', color: '#a855f7' },
    { id: 'r_algo', name: '算法', color: '#ec4899' },

    { id: 's_chassis', name: '底盘', color: '#f59e0b', parentId: null },
    { id: 's_pass', name: '传球机构', color: '#22c55e', parentId: null },
    { id: 's_serve', name: '发球机构', color: '#3b82f6', parentId: null },
    { id: 's_ctrl', name: '控制逻辑', color: '#a855f7', parentId: null },
    { id: 's_vision', name: '视觉识别', color: '#ec4899', parentId: null },

  ];
  const statuses = [
    { id: 'st_todo', name: '未开始', color: '#64748b', order: 0, isDone: false },
    { id: 'st_doing', name: '进行中', color: '#3b82f6', order: 1, isDone: false },
    { id: 'st_verify', name: '待验证', color: '#f59e0b', order: 2, isDone: false },

  const priorities = [
    { id: 'p_low', name: '低', color: '#64748b', order: 0 },

    { id: 'p_high', name: '高', color: '#f59e0b', order: 2 },
    { id: 'p_urgent', name: '阻塞级', color: '#ef4444', order: 3 },
  ];
  const unavailTypes = [
    { id: 'u_exam', name: '考试', color: '#ef4444', pattern: 'solid', isExam: true },
    { id: 'u_course', name: '课设/大作业', color: '#dc2626', pattern: 'stripe', isExam: false },
    { id: 'u_intern', name: '实习', color: '#8b5cf6', pattern: 'solid', isExam: false },

  return {
    version: 1,

    milestones: [],
    members: [],
    unavailables: [],
    tasks: [],
    taskTemplates: [],
  templates: [],      // 任务模板
  decisions: [],      // 决策 / 假设 / 风险 / 问题记录
    activity: [],
    users: [],      // 本机账号（管理员 / 成员）
  goals: [],       // 目标（O）→ 关键结果（KR）→ 任务挂靠
    actions: [],     // 复盘中产生的行动项
    gates: defaultGates(),   // 阶段门（阶段准入）
    interfaces: [],  // 接口契约 ICD
    bom: [],         // 物料与到货期
    fmea: [],        // 失效模式
    compliance: [],  // 规则合规清单
    baselines: [],   // 配置基线
    stopDoing: [],   // 这周不做什么
    riskState: {},   // 风险处置：key → { status, ownerId, note, at }
    settings: {
      theme: 'system',
      ganttDays: 49,
      ganttStart: '',           // 空 = 自动取最近任务/今天
      heatDays: 42,
      riskRules: {
        dueInPrep: { on: true, days: 3 },
        dueOnExam: { on: true },
        singlePoint: { on: true },
        overdue: { on: true },
        lowAvail: { on: true, ratio: 0.4 },
        overlap: { on: true },
        emptySubsystem: { on: true },
        pacingWarn: { on: true, days: 4, horizon: 14 },
        wip: { on: true },
        escalate: { on: true, days: 2 },
        bomLate: { on: true },
        failRun: { on: true, days: 7 },
        gateDue: { on: true, days: 7 },
        complianceDue: { on: true, days: 7 },
      },
      fields: { estimateHours: true, tags: true, helperIds: true, description: true },
      savedViews: [],
      wipLimit: 3,
      escalateDays: 2,          // 每人同时进行中的上限（约束理论：限制在制品）
      targetDate: '',        // 目标交付日（空则用最后一个截止日）

    },
  };
}

/* =========================================================================
 * 状态层
 * ========================================================================= */
let state = load();
let undoStack = [], redoStack = [], lastSnap = null;
let ui = {
  tab: 'lane',
  kanbanDrag: null,
  filter: { q: '', subsystem: '', member: '', status: '', role: '', onlyMineOpen: false },
  taskSort: 'due',
  selected: [],          // 任务管理页勾选的任务 id

/* =========================================================================
 *  主题（深浅色）：跟随系统 + 手动切换
 * ========================================================================= */
const mqDark = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const pref = state.settings.theme;   // 'system' | 'dark' | 'light'
  const dark = pref === 'dark' || (pref === 'system' && mqDark.matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}
function toggleTheme() {
  const cur = state.settings.theme;
  // 三态循环：system -> dark -> light -> system
  const next = cur === 'system' ? 'dark' : cur === 'dark' ? 'light' : 'system';
  state.settings.theme = next;
  save(); applyTheme(); renderKpis(); renderNav();
  const label = next === 'system' ? '跟随系统' : next === 'dark' ? '深色' : '浅色';
  toast('主题：' + label);
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return migrate(parsed);
  } catch (e) {
    console.error('读取本地数据失败', e);
    return defaultState();
  }
}
function migrate(s) {
  const base = defaultState();
  const out = Object.assign({}, base, s);
  out.settings = Object.assign({}, base.settings, s.settings || {});
  out.settings.riskRules = Object.assign({}, base.settings.riskRules, (s.settings || {}).riskRules || {});
  out.settings.fields = Object.assign({}, base.settings.fields, (s.settings || {}).fields || {});
  ['roles', 'subsystems', 'statuses', 'priorities', 'unavailTypes', 'milestones', 'members', 'unavailables', 'tasks', 'taskTemplates', 'templates', 'decisions', 'activity', 'users', 'goals', 'actions', 'gates', 'interfaces', 'bom', 'fmea', 'compliance', 'baselines', 'stopDoing']
    .forEach(k => { if (!Array.isArray(out[k])) out[k] = base[k]; });
  for (const t of out.tasks) {
    if (typeof t.deciderId !== 'string') t.deciderId = '';
    if (typeof t.frozen !== 'boolean') t.frozen = false;
    if (typeof t.expedite !== 'boolean') t.expedite = false;
    if (!Array.isArray(t.testRuns)) t.testRuns = [];
  }
  if (!(Number(out.settings.escalateDays) > 0)) out.settings.escalateDays = 2;
  if (!out.riskState || typeof out.riskState !== 'object') out.riskState = {};
  if (!(Number(out.settings.wipLimit) > 0)) out.settings.wipLimit = 3;
  if (!(Number(out.settings.bufferDays) > 0)) out.settings.bufferDays = 5;
  if (Number(out.settings.ganttDays) === 35 && !out.settings.__daysBumped) { out.settings.ganttDays = 49; out.settings.__daysBumped = true; }
  if (typeof out.settings.targetDate !== 'string') out.settings.targetDate = '';
  // 迁移：旧的单 memberId 占用 → 新 participantIds；pacingOverride → pacingDefault
  out.unavailables = out.unavailables.map(u => {
    const n = Object.assign({}, u);
    if (n.memberId && !n.participantIds) { n.participantIds = [n.memberId]; }
    if (n.pacingOverride && !n.pacingDefault) { n.pacingDefault = n.pacingOverride; }
    if (!n.memberOverrides) n.memberOverrides = {};
    delete n.memberId; delete n.pacingOverride;
    return n;
  });
  // 迁移：任务进度 progress(%) → 检查点 checkpoints[]
  out.tasks = out.tasks.map(t => {
    const n = Object.assign({}, t);
    if (!Array.isArray(n.checkpoints)) {
      const pct = Number(n.progress) || 0;
      if (pct > 0) {
        // 有旧进度但没检查点：转成 4 个检查点，按进度勾选
        const doneCount = Math.round(pct / 100 * 4);
        n.checkpoints = [1, 2, 3, 4].map(i => ({
          id: uid('cp'), text: `阶段 ${i}`, done: i <= doneCount, weight: 1,
        }));
      } else {
        n.checkpoints = [];
      }
    }
    n.checkpoints = n.checkpoints.map(c => ({
      id: c.id || uid('cp'),
      text: c.text || '未命名检查点',
      done: !!c.done,
      weight: Number(c.weight) > 0 ? Number(c.weight) : 1,
    }));
    n.goalId = n.goalId || '';
    n.krId = n.krId || '';
    if (!Array.isArray(n.depIds)) n.depIds = [];
    delete n.progress;
    return n;
  });
  return out;
}

let saveTimer = null, dirty = false;
function save(immediate = false) {
  dirty = true;
  if (saveTimer) clearTimeout(saveTimer);
  const write = () => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      ui.lastSaved = new Date();
      dirty = false;
    } catch (e) {
      toast('保存失败：' + e.message, true);
    }
  };
  if (immediate) { write(); return; }
  saveTimer = setTimeout(write, 400);
}
let __statusSnap = null;
trackStatusAge();
/* 记录每个任务进入当前状态的时间，用来算"卡了多久" */
function trackStatusAge() {
  for (const t of state.tasks) {
    if (!t.statusAt) {
      const last = (t.logs || []).map(l => l.at).filter(Boolean).sort().pop();
      t.statusAt = (last ? String(last).slice(0, 10) : (t.start || today()));
    }
    if (__statusSnap && __statusSnap[t.id] !== undefined && __statusSnap[t.id] !== t.statusId) t.statusAt = today();
  }
  __statusSnap = {};
  for (const t of state.tasks) __statusSnap[t.id] = t.statusId;
}
function snapshotNow() { return JSON.stringify(state); }
function pushUndoSnap() {
  const cur = snapshotNow();
  if (lastSnap != null && lastSnap !== cur) {
    undoStack.push(lastSnap);
    if (undoStack.length > 30) undoStack.shift();
    redoStack.length = 0;
  }
  lastSnap = cur;
}
function undo() {
  if (!isAdmin()) return toast('撤销只有管理员能用', true);
  if (!undoStack.length) return toast("没有可撤销的操作了");
  redoStack.push(snapshotNow());
  state = JSON.parse(undoStack.pop());
  lastSnap = snapshotNow();
  save(true); renderAll(); toast("已撤销上一步");
}
function redo() {
  if (!isAdmin()) return toast('重做只有管理员能用', true);
  if (!redoStack.length) return toast("没有可重做的操作了");
  undoStack.push(snapshotNow());
  state = JSON.parse(redoStack.pop());
  lastSnap = snapshotNow();
  save(true); renderAll(); toast("已重做");
}
function commit(msg) {
  applyLinks();
  trackStatusAge();
  pushUndoSnap();
  save();
  renderAll();
  if (msg) toast(msg);
  cloudAfterCommit();
}

const statusOf = t => byId(state.statuses, t.statusId) || state.statuses[0];

/* =========================================================================
 *  核心引擎：每个人的每日"精力"曲线
 * ========================================================================= */
/*
 * 返回 Map<memberId, Map<'YYYY-MM-DD', {busy, hard, soft, other, notes:[]}>>
 * busy = 当天被占用比例 0~1（1 = 完全不可用）
 */
function buildAvailability(fromStr, toStr) {
  const days = dayRange(fromStr, toStr);
  const result = new Map();
  const defaultPacing = { prepDays: 7, prepIntensity: 0.6, examDayIntensity: 1, curve: 'linear', bufferDays: 0, weekendPreference: 'ok' };

  // 归一化：一条占用记录可能同时有 memberId（旧）或 participantIds（新），统一取「参与人」列表
  const participantsOf = u => {
    if (u.participantIds && u.participantIds.length) return u.participantIds;
    if (u.memberId) return [u.memberId];
    return [];
  };
  // 某人在某场占用里的个性化节奏覆盖
  const overrideFor = (u, mId) => (u.memberOverrides && u.memberOverrides[mId]) || {};

  for (const m of state.members) {
    const map = new Map();
    for (const d of days) map.set(d, { busy: 0, hard: 0, soft: 0, other: 0, otherNoWk: 0, notes: [] });

    // 1. 一次性占用（含考试 -> 推演复习期）
    const events = state.unavailables.filter(u => participantsOf(u).includes(m.id));
    for (const ev of events) {
      const type = typeOf(ev.typeId);
      const intensity = typeof ev.intensity === 'number' ? ev.intensity : 1;
      if (ev.kind === 'exam') {
        // 节奏合并优先级：成员默认 < 考试整场默认(pacingDefault) < 该人个性化(memberOverrides[memberId])
        const pace = Object.assign({}, defaultPacing, m.pacing || {}, ev.pacingDefault || {}, overrideFor(ev, m.id));
        const prepDays = Math.max(0, Number(pace.prepDays) || 0);
        const examDay = ev.start;
        // 复习期：从 examDay - prepDays 到 examDay 的前一天
        for (let i = 1; i <= prepDays; i++) {
          const d = addDays(examDay, -i);
          const row = map.get(d);
          if (!row) continue;
          // 进度比例：1 = 开始复习的那一天（最轻），prepDays = 考试前一天（最重）
          const p = i / prepDays;
          let w;
          if (pace.curve === 'step') w = 1;
          else if (pace.curve === 'sprint') w = Math.pow(p, 2.2);   // 前松后紧
          else w = p;                                               // 线性
          const v = clamp(Number(pace.prepIntensity) || 0, 0, 1) * w;
          if (v > 0.001) {
            row.soft = Math.max(row.soft, v);   // 多条考试取最高的那条，不简单相加避免爆炸
            row.notes.push(`${ev.note || '考试'}复习(${Math.round(v * 100)}%)`);
          }
        }
        // 考试当天（可能跨天，若 end > start 则每天都算）
        const examDays = ev.end && ev.end > ev.start ? dayRange(ev.start, ev.end) : [ev.start];
        for (const d of examDays) {
          const row = map.get(d);
          if (!row) continue;
          const v = clamp(Number(pace.examDayIntensity) || 0, 0, 1) * intensity;
          row.hard = Math.max(row.hard, v);
          row.notes.push(`${ev.note || '考试'}（今天）`);
        }
        // 考后缓冲
        const buf = Math.max(0, Number(pace.bufferDays) || 0);
        for (let i = 1; i <= buf; i++) {
          const d = addDays(examDays[examDays.length - 1], i);
          const row = map.get(d);
          if (!row) continue;
          row.other = Math.max(row.other, 0.5);
          row.otherNoWk = Math.max(row.otherNoWk, 0.5);
          row.notes.push(`${ev.note || '考试'}后恢复`);
        }
      } else {
        const span = dayRange(ev.start, ev.end && ev.end > ev.start ? ev.end : ev.start);
        for (const d of span) {
          const row = map.get(d);
          if (!row) continue;
          row.other = Math.max(row.other, intensity);
          row.otherNoWk = Math.max(row.otherNoWk, intensity);
          row.notes.push(ev.note || type.name);
        }
      }
    }

    // 2. 周期性占用（每周固定课程等）
    for (const ev of events) {
      if (!ev.recurring || !ev.recurring.days || !ev.recurring.days.length) continue;
      if (ev.kind === 'exam') continue; // 周期性只对非考试生效
      const until = ev.recurring.until || toStr;
      const span = dayRange(fromStr, until < toStr ? until : toStr);
      for (const d of span) {
        const dow = parseYmd(d).getDay();
        const names = ev.recurring.days;
        if (!names.includes(dow)) continue;
        const row = map.get(d);
        if (!row) continue;
        row.other = Math.max(row.other, ev.intensity ?? 0.5);
        row.otherNoWk = Math.max(row.otherNoWk, ev.intensity ?? 0.5);
        row.notes.push((ev.note || '固定安排') + '（周' + weekdayName(d) + '）');
      }
    }

    // 3. 周末偏好
    const wp = (m.pacing || {}).weekendPreference || 'ok';
    if (wp !== 'ok') {
      for (const d of days) {
        if (!isWeekend(d)) continue;
        const row = map.get(d);
        if (!row) continue;
        if (wp === 'no') { row.other = Math.max(row.other, 1); row.notes.push('周末不干活'); }
        else if (wp === 'half') { row.other = Math.max(row.other, 0.5); row.notes.push('周末半天'); }
      }
    }

    // 合计
    for (const [d, row] of map) {
      row.busy = clamp(row.hard + row.soft * 0.9 + row.other * 0.7, 0, 1);
      // pbusy：只算"被考试 / 复习 / 事件占住"，不含周末偏好（周末是习惯不是占用，不该染成黄条）
      row.pbusy = clamp(row.hard + row.soft * 0.9 + row.otherNoWk * 0.7, 0, 1);
      row.free = 1 - row.busy;
    }
    result.set(m.id, map);
  }
  return result;
}

/* 某人在某天的精力（0~1） */
function freeOn(avail, memberId, d) {
  const m = avail.get(memberId);
  if (!m) return 1;
  const row = m.get(d);
  return row ? row.free : 1;
}

/* 任务在某段时间里，负责人的平均可用度 */
function taskAvailability(avail, task) {
  const s = task.start || task.due, e = task.due || task.start;
  if (!s || !e) return 1;
  const days = dayRange(s >= e ? e : s, s >= e ? s : e);
  const owners = task.ownerIds && task.ownerIds.length ? task.ownerIds : ((task.helperIds || []).length ? task.helperIds : []);
  if (!owners.length) return 1;
  let sum = 0, n = 0;
  for (const id of owners) for (const d of days) { sum += freeOn(avail, id, d); n++; }
  return n ? sum / n : 1;
}

/* =========================================================================
 *  风险规则引擎
 * ========================================================================= */
function computeRisks() {
  const out = [];
  const rules = state.settings.riskRules;
  const t0 = today();
  const horizonEnd = addDays(t0, 60);
  const avail = buildAvailability(t0, horizonEnd);
  const openTasks = state.tasks.filter(t => !statusOf(t).isDone);

  // 1. 截止日撞复习期（软占用）
  if (rules.dueInPrep.on) {
    for (const t of openTasks) {
      if (!t.due) continue;
      const before = addDays(t.due, -rules.dueInPrep.days);
      for (const id of (t.ownerIds || [])) {
        for (const d of dayRange(before, t.due)) {
          const row = avail.get(id)?.get(d);
          if (row && row.soft >= 0.4) {
            out.push({ level: 'mid', key: `prep:${t.id}:${id}`, text: `<b>${esc(t.title)}</b> 截止 ${fmtMD(t.due)} 撞上 <b>${esc(member(id)?.name || '?')}</b> 的复习期（${esc(row.notes[0] || '复习')}）` });
            break;
          }
        }
      }
    }
  }
  // 2. 截止当天处于硬占用
  if (rules.dueOnExam.on) {
    for (const t of openTasks) {
      if (!t.due) continue;
      for (const id of (t.ownerIds || [])) {
        const row = avail.get(id)?.get(t.due);
        if (row && row.hard >= 0.8) {
          out.push({ level: 'hi', key: `exam:${t.id}:${id}`, text: `<b>${esc(t.title)}</b> 截止当天 <b>${esc(member(id)?.name || '?')}</b> 有考试/硬占用，几乎不可能交付` });
        }
      }
    }
  }
  // 3. 单点依赖
  if (rules.singlePoint.on) {
    for (const s of state.subsystems) {
      const ts = openTasks.filter(t => t.subsystemId === s.id);
      if (!ts.length) continue;
      const owners = new Set();
      ts.forEach(t => (t.ownerIds || []).forEach(id => owners.add(id)));
      if (owners.size === 1) {
        out.push({ level: 'lo', key: `sp:${s.id}`, text: `子系统 <b>${esc(s.name)}</b> 只有 1 个人负责（${esc(member([...owners][0])?.name || '?')}），存在单点风险` });
      } else if (owners.size === 0) {
        out.push({ level: 'mid', text: `子系统 <b>${esc(s.name)}</b> 有 ${ts.length} 个未完成任务但没有负责人` });
      }
    }
  }
  // 4. 逾期
  if (rules.overdue.on) {
    for (const t of openTasks) {
      if (t.due && t.due < t0) {
        out.push({ level: 'hi', key: `ovd:${t.id}`, text: `<b>${esc(t.title)}</b> 已逾期 ${diffDays(t.due, t0)} 天（截止 ${fmtMD(t.due)}，检查点 ${taskCpSummary(t)}）` });
      }
    }
  }
  // 5. 未来 7 天团队可用率过低
  if (rules.lowAvail.on) {
    for (let i = 0; i < 14; i++) {
      const d = addDays(t0, i);
      if (!state.members.length) break;
      let sum = 0;
      for (const m of state.members) sum += freeOn(avail, m.id, d);
      const ratio = sum / state.members.length;
      if (ratio < rules.lowAvail.ratio && !isWeekend(d)) {
        out.push({ level: 'mid', text: `${fmtCn(d)}（周${weekdayName(d)}）全队平均可用精力仅 <b>${Math.round(ratio * 100)}%</b>，不宜安排关键节点` });
      }
    }
  }
  // 6. 同一天多场考试叠加
  if (rules.overlap.on) {
    const map = new Map();
    for (const u of state.unavailables) {
      const type = typeOf(u.typeId);
      if (!type.isExam) continue;
      const pids = (u.participantIds && u.participantIds.length) ? u.participantIds : (u.memberId ? [u.memberId] : []);
      for (const mid of pids) {
        const k = mid + '|' + u.start;
        map.set(k, (map.get(k) || 0) + 1);
      }
    }
    for (const [k, n] of map) {
      if (n > 1) {
        const [mid, day] = k.split('|');
        out.push({ level: 'mid', text: `<b>${esc(member(mid)?.name || '?')}</b> 在 ${fmtMD(day)} 有 ${n} 场考试` });
      }
    }
  }
  // 7. 空转子系统
  if (rules.emptySubsystem.on) {
    for (const s of state.subsystems) {
      const n = state.tasks.filter(t => t.subsystemId === s.id && !statusOf(t).isDone).length;
      if (n === 0) out.push({ level: 'lo', key: `empty:${s.id}`, text: `子系统 <b>${esc(s.name)}</b> 没有任何进行中的任务` });
    }
  }
  // 8. 节奏预警
  if (rules.pacingWarn.on) {
    for (const m of state.members) {
      let cnt = 0;
      for (let i = 0; i < rules.pacingWarn.horizon; i++) {
        const d = addDays(t0, i);
        const row = avail.get(m.id)?.get(d);
        if (row && row.busy >= 0.6) cnt++;
      }
      if (cnt >= rules.pacingWarn.days) {
        out.push({ level: 'lo', key: `pace:${m.id}`, text: `<b>${esc(m.name)}</b> 未来 ${rules.pacingWarn.horizon} 天内将有 ${cnt} 天处于高占用（≥60%），排期请避开` });
      }
    }
  }
  // 9. 在制品过多（约束理论：限制 WIP，先收口再开新）
  const wip = Number(state.settings.wipLimit) || 3;
  if (!rules.wip || rules.wip.on !== false) {
    for (const m of state.members) {
      const doing = state.tasks.filter(t => (t.ownerIds || []).includes(m.id) && taskIsDoing(t));
      if (doing.length > wip) {
        out.push({ level: 'mid', key: `wip:${m.id}`, text: `<b>${esc(m.name)}</b> 同时进行 ${doing.length} 项（上限 ${wip}），并行太多每项都会被拖慢` });
      }
    }
  }
  // 10. 卡住升级（Scrum 升级 SLA）
  if (!rules.escalate || rules.escalate.on !== false) {
    const lim = Number(rules.escalate?.days) || 2;
    for (const t of openTasks) {
      if (!taskIsDoing(t)) continue;
      const last = (t.logs || []).map(l => String(l.at || '').slice(0, 10)).filter(Boolean).sort().pop() || t.statusAt || t.start;
      if (!last) continue;
      const stalled = diffDays(last, t0);
      const blocked = /卡|阻塞/i.test(statusOf(t).name);
      if (blocked && stalled >= lim) out.push({ level: 'hi', key: `esc:${t.id}`, text: `<b>${esc(t.title)}</b> 卡住已 ${stalled} 天，该升级或拆小` });
      else if (!blocked && stalled >= Math.max(lim + 5, 7)) out.push({ level: 'mid', key: `esc:${t.id}`, text: `<b>${esc(t.title)}</b> ${stalled} 天没有更新，确认还活着` });
    }
  }
  // 11. 物料到货晚于需要日
  if (!rules.bomLate || rules.bomLate.on !== false) {
    for (const b of (state.bom || [])) {
      if (bomLate(b)) out.push({ level: 'hi', key: `bom:${b.id}`, text: `<b>${esc(b.name)}</b> 到货 ${b.etaAt ? fmtMD(b.etaAt) : '未定'}，需要日 ${fmtMD(b.needAt)}，会挡住装配` });
    }
  }
  // 12. 最近试跑失败
  if (!rules.failRun || rules.failRun.on !== false) {
    const lim = addDays(t0, -(Number(rules.failRun?.days) || 7));
    for (const t of state.tasks) {
      const r = (t.testRuns || [])[0];
      if (r && r.result === '失败' && String(r.at || '').slice(0, 10) >= lim && !statusOf(t).isDone)
        out.push({ level: 'hi', key: `fail:${t.id}:${r.id}`, text: `<b>${esc(t.title)}</b> 最近一次试跑失败（${esc(r.ver || '未记版本')}），先定位再往下走` });
    }
  }
  // 13. 阶段门临近未通过
  if (!rules.gateDue || rules.gateDue.on !== false) {
    for (const g of (state.gates || [])) {
      if (!g.due || gateDone(g)) continue;
      const dd = diffDays(t0, g.due);
      if (dd <= (Number(rules.gateDue?.days) || 7) && dd >= -30) out.push({ level: dd < 0 ? 'hi' : 'mid', key: `gate:${g.id}`, text: `<b>${esc(g.name)}</b> ${dd < 0 ? `已超期 ${-dd} 天` : `还有 ${dd} 天`}，准入条件还差 ${100 - gatePct(g)}%` });
    }
  }
  // 14. 合规核对临近截止
  if (!rules.complianceDue || rules.complianceDue.on !== false) {
    for (const c of (state.compliance || [])) {
      if (!c.due || c.done) continue;
      const dd = diffDays(t0, c.due);
      if (dd <= (Number(rules.complianceDue?.days) || 7)) out.push({ level: dd < 0 ? 'hi' : 'mid', key: `cmp:${c.id}`, text: `合规核对「${esc(c.text)}」${dd < 0 ? `超期 ${-dd} 天` : `还有 ${dd} 天`}` });
    }
  }
  for (const r of out) r.st = (state.riskState[r.key] || {}).status || 'open';
  return out;
}

/* =========================================================================
 *  ██ Command Deck · 视图层
 *  语言：材质分层 / 单强调色 / 象征符号 / 就地编辑 / ⌘K
 * ========================================================================= */

/* 状态符号：不只靠颜色表达状态 */
const STATUS_GLYPH = {
  '未开始': '■', '进行中': '●', '待验证': '◐', '已完成': '✓', '卡住': '⛔',
};
function statusGlyph(st) {
  if (!st) return '■';
  if (STATUS_GLYPH[st.name]) return STATUS_GLYPH[st.name];
  if (st.isDone) return '✓';
  return '■';
}
/* 状态色：统一收敛到强调色/危险色，只有"卡住"和"完成"额外着色 */
function statusTint(st) {
  if (!st) return 'var(--tx3)';
  if (st.isDone) return 'var(--ok)';
  if (/卡|阻塞|block/i.test(st.name)) return 'var(--danger)';
  return 'var(--tx2)';
}
function glyphChip(st, extra = '') {
  const col = statusTint(st);
  return `<span class="pill" style="color:${col};background:var(--raised)"><span class="sy" style="color:${col}">${statusGlyph(st)}</span>${esc(st?.name || '—')}${extra}</span>`;
}
/* 优先级只保留"紧急"这一档有视觉重量 */
function prioIsUrgent(t) {
  const p = prioOf(t);
  return (p.order ?? 0) >= 2 || /紧急|阻塞|urgent/i.test(p.name);
}
function dueLabel(t) {
  if (!t.due) return '';
  const cd = contEnd(t);
  if (cd && today() > t.due) {
    const left = diffDays(today(), cd);
    if (left >= 0) return taskIsDone(t) ? '延续期已完成' : `延续优化中 · 还剩 ${left} 天`;
  }
  const dd = diffDays(today(), t.due);
  if (dd < 0) return `逾期 ${-dd} 天`;
  if (dd === 0) return '今天';
  if (dd === 1) return '明天';
  return `${dd} 天后`;
}

function prioOrder(t) { return prioOf(t).order ?? 0; }
function filteredTasks() {
  const f = ui.filter;
  return state.tasks.filter(t => {
    if (f.q) {
      const hay = [t.title, t.description, ...(t.tags || [])].join(' ').toLowerCase();
      const names = [...(t.ownerIds || []), ...(t.helperIds || [])].map(id => member(id)?.name || '').join(' ');
      if (!(hay + ' ' + names).toLowerCase().includes(f.q.toLowerCase())) return false;
    }
    if (f.subsystem && t.subsystemId !== f.subsystem) return false;
    if (f.member && !(t.ownerIds || []).includes(f.member)) return false;
    if (f.status && t.statusId !== f.status) return false;
    if (f.role) {
      const ok = (t.ownerIds || []).some(id => (member(id)?.roles || []).includes(f.role));
      if (!ok) return false;
    }
    if (f.onlyMineOpen && statusOf(t).isDone) return false;
    return true;
  });
}

/* ---------------- 视图定义（3 个主视图 + 2 个工具视图） ---------------- */
const VIEWS = [
  { id: 'lane', name: '子系统', title: '子系统泳道', sub: () => `${fmtCn(today())} · 未来 ${ganttDays()} 天` },
  { id: 'people', name: '人员', title: '人员 · 任务', sub: () => `${state.members.length} 人 · ${state.tasks.length} 个任务` },
  { id: 'kanban', name: '看板', title: '看板', sub: () => `${filteredTasks().length} 个任务` },
  { id: 'heat', name: '负荷', title: '全员负荷', sub: () => `${state.members.length} 人 · ${ganttDays()} 天` },
  { id: 'exams', name: '日程', title: '考试与日程', sub: () => `${state.unavailables.length} 条记录` },
  { id: 'manage', name: '管理', title: '批量管理', sub: () => `${state.members.length}人 · ${state.tasks.length}任务` },
  { id: 'weekly', name: '周报', title: '每周进度', sub: () => weekSub() },
  { id: 'dex', name: '指挥台', title: '指挥台', sub: () => `${state.settings.savedViews.length} 个视图 · ${state.activity.length} 条变更` },
];
function ganttDays() { return clamp(Number(state.settings.ganttDays) || 49, 7, 200); }
function viewRange() {
  const start = state.settings.ganttStart || addDays(today(), -2);
  const days = ganttDays();
  return { start, days, list: dayRange(start, addDays(start, days - 1)) };
}
function laneZoom() { return ui.zoom || state.settings.zoom || 'week'; }
function laneRange() {
  const z = laneZoom();
  if (z === 'week') { const s = today(); return { start: s, days: 7, zoom: z, list: dayRange(s, addDays(s, 6)) }; }
  if (z === 'month') { const s = weekStartOf(today()); return { start: s, days: 35, zoom: z, list: dayRange(s, addDays(s, 34)) }; }
  return Object.assign({ zoom: z }, viewRange());
}

      if (t && !canEditTask(t)) tr.querySelectorAll('input,select,textarea,button').forEach(el => { el.disabled = true; });
    });
    body.querySelectorAll('.kcard[data-task]').forEach(c => {
      const t = state.tasks.find(x => x.id === c.dataset.task);
      if (t && !canEditTask(t)) c.setAttribute('draggable', 'false');
    });
    body.querySelectorAll('[data-drag-task]').forEach(b => {

    });
  }
  decorateLaneBars();
  // 重绘会替换锚点节点：按 data-pop 找回新节点接上，找不到才关闭
  if (popState) {
    const want = popState.kind + ':' + popState.id;

    if (!el2) {
      closePop(true);
    } else {
      popState.el = el2;

      if (p && p.classList.contains('on')) {

        positionPop(el2);
      }

}

/* =========================================================================
 *  顶栏脉冲：一眼看穿风险
 * ========================================================================= */
function renderPulse() {
  const el = $('#pulse');
  if (!el) return;
  const tasks = state.tasks;
  const open = tasks.filter(t => !statusOf(t).isDone);
  const totalCp = tasks.reduce((a, t) => a + (t.checkpoints || []).length, 0);
  const doneCp = tasks.reduce((a, t) => a + (t.checkpoints || []).filter(c => c.done).length, 0);
  const risks = computeRisks();
  const hi = risks.filter(r => r.level === 'hi').length;
  const overdue = open.filter(t => t.due && t.due < today()).length;
  const next = state.milestones.filter(m => m.date >= today()).sort((a, b) => a.date.localeCompare(b.date))[0];

  const item = (cls, v, k) => `<span class="pitem ${cls}"><span class="v num">${v}</span><span class="k">${k}</span></span>`;
  el.innerHTML = [
    next ? item(diffDays(today(), next.date) <= 7 ? 'warn' : '', `<span style="color:var(--acc)">${diffDays(today(), next.date)}</span>`, `天 · ${esc(next.name)}`) : '',
    item('', `${doneCp}<span style="color:var(--tx3);font-size:11px">/${totalCp}</span>`, '检查点'),
    item(hi ? 'bad' : '', risks.length, '风险'),
    item(overdue ? 'bad' : '', overdue, '逾期'),
  ].filter(Boolean).join('');
  const tt = $('#themeToggle');
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  tt.textContent = state.settings.theme === 'system' ? '🖥' : dark ? '🌙' : '☀️';
  tt.title = `主题：${state.settings.theme === 'system' ? '跟随系统' : dark ? '深色' : '浅色'}`;

  renderQuickAdd();
}

/* ---------- 顶栏快速添加：输入标题回车即建任务 ---------- */
function renderQuickAdd() {
  const el = $('#quickAdd');
  if (!el) return;
  if (!el.dataset.ready) {
    el.innerHTML = `
      <span class="qa-ic">+</span>
      <input type="text" id="qaInput" placeholder="快速新建任务：输入标题后回车" autocomplete="off" spellcheck="false">
      <button class="qa-more" id="qaMore" title="完整表单">详情</button>`;

      const title = inp.value.trim();
      if (!title) return;
      openTaskModal(null, { title });

/* =========================================================================
 *  左栏：今日焦点 + 下周
 * ========================================================================= */
function applyLeftRail() {
  const el = $('#railL');
  if (!el) return;
  const d = today();
  const avail = buildAvailability(d, addDays(d, 20));
  const open = state.tasks.filter(t => !statusOf(t).isDone);

  const examsToday = [];
  for (const u of state.unavailables) {
    if (u.kind !== 'exam') continue;
    const pids = (u.participantIds && u.participantIds.length) ? u.participantIds : [];
    if (!(u.start === d || (u.end && u.start <= d && d <= u.end))) continue;
    for (const mid of pids) examsToday.push({ u, mid });
  }
  const busy = state.members.map(m => ({ m, r: avail.get(m.id)?.get(d) })).filter(x => x.r && x.r.busy > 0.3);
  const dueSoon = open.filter(t => t.due && t.due <= addDays(d, 7)).sort((a, b) => a.due.localeCompare(b.due));
  const overdue = open.filter(t => t.due && t.due < d);
  const nextExams = state.unavailables
    .filter(u => u.kind === 'exam' && u.start > d).sort((a, b) => a.start.localeCompare(b.start)).slice(0, 3);
  const ms = state.milestones.filter(m => m.date >= d).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
  const collabs = [];
  for (const t of state.tasks) for (const c of (t.collabs || [])) if (c.status === 'pending') collabs.push({ t, c });

  const taskRow = t => `
    <div class="rowline" data-open-task="${t.id}">
      <span class="stsym" style="background:${statusTint(statusOf(t))}">${statusGlyph(statusOf(t))}</span>
      <div style="flex:1;min-width:0">
        <div class="t">${esc(t.title)}</div>
        <div class="s">${esc(subName(t.subsystemId))} · ${dueLabel(t)}</div>
      </div>
    </div>`;

  el.innerHTML = `
    <div class="rail-sec">
      <div class="rail-h">今日 <span class="n">${fmtMD(d)} 周${weekdayName(d)}</span></div>
      ${examsToday.length ? `<div class="surf">
        ${examsToday.map(({ u, mid }) => `
          <div class="rowline" data-edit-unavail="${u.id}">
            <span class="stsym" style="background:var(--danger)">考</span>
            <div style="flex:1;min-width:0"><div class="t">${esc(member(mid)?.name || '?')}</div><div class="s">${esc(u.note || '考试')}</div></div>
          </div>`).join('')}
      </div>` : ''}
      ${busy.length ? `<div class="surf">
        ${busy.map(({ m, r }) => `
          <div class="rowline" data-edit-member="${m.id}">
            ${avatar(m)}
            <div style="flex:1;min-width:0"><div class="t">${esc(m.name)}</div><div class="s">${esc(r.notes[0] || '占用')}</div></div>
            <span class="s num" style="color:${r.free < .4 ? 'var(--danger)' : 'var(--warn)'}">${Math.round(r.free * 100)}%</span>
          </div>`).join('')}
      </div>` : ''}
      ${overdue.length ? `<div class="surf">
        ${overdue.slice(0, 3).map(taskRow).join('')}
      </div>` : ''}
      ${dueSoon.length ? `<div class="surf">${dueSoon.slice(0, 4).map(taskRow).join('')}</div>` : ''}
      ${!examsToday.length && !busy.length && !overdue.length && !dueSoon.length
        ? `<div class="empty" style="padding:16px">今天没人受限，也没有临期任务</div>` : ''}
    </div>

    ${collabs.length ? `<div class="rail-sec">
      <div class="rail-h">协作申请 <span class="n">${collabs.length}</span></div>
      <div class="surf">
        ${collabs.slice(0, 5).map(({ t, c }) => `<div class="rowline" data-open-task="${t.id}">
          <span class="stsym" style="background:var(--acc-dim);color:var(--acc)">协</span>
          <div style="flex:1;min-width:0"><div class="t">${esc(t.title)}</div><div class="s">→ ${esc(subName(c.subId))} · ${esc(c.note || '')}</div></div>
        </div>`).join('')}
      </div>
    </div>` : ''}

    ${nextExams.length ? `<div class="rail-sec">
      <div class="rail-h">近期考试</div>
      ${nextExams.map(u => {
        const dd = diffDays(d, u.start);
        return `<div class="rowline" data-edit-unavail="${u.id}">
          <span class="stsym" style="background:var(--raised2);color:var(--danger)">考</span>
          <div style="flex:1;min-width:0"><div class="t">${esc(u.note || '考试')}</div><div class="s">${fmtMD(u.start)} · ${(u.participantIds || []).length} 人</div></div>
          <span class="s num" style="color:${dd <= 3 ? 'var(--danger)' : 'var(--tx3)'}">${dd}d</span>
        </div>`;
      }).join('')}
    </div>` : ''}

    ${ms.length ? `<div class="rail-sec">
      <div class="rail-h">里程碑</div>
      ${ms.map(m => {
        const dd = diffDays(d, m.date);
        return `<div class="rowline static">
          <span class="dotc" style="background:var(--acc)"></span>
          <div style="flex:1;min-width:0"><div class="t">${esc(m.name)}</div><div class="s">${fmtMD(m.date)}</div></div>
          <span class="s num" style="color:${dd <= 7 ? 'var(--warn)' : 'var(--tx3)'}">${dd}d</span>
        </div>`;
      }).join('')}
    </div>` : ''}

    <div class="rail-sec" style="margin-top:auto">
      <div class="rail-h">子系统</div>
      ${state.subsystems.map(s => {
        const ts = state.tasks.filter(t => t.subsystemId === s.id);

        const tw = ts.reduce((a, t) => a + wOf(t), 0);

        return `<div class="rowline" data-filter-subsystem="${s.id}">

          <span class="s num" style="width:26px;text-align:right">${pct}%</span>
        </div>`;
      }).join('')}
    </div>`;

  el.onclick = e => {
    const t = e.target.closest('[data-open-task]');
    if (t) return openTaskModal(t.dataset.openTask);
    const u = e.target.closest('[data-edit-unavail]');
    if (u) return openUnavailModal(u.dataset.editUnavail);
    const m = e.target.closest('[data-edit-member]');
    if (m) return openMemberModal(m.dataset.editMember);
    const s = e.target.closest('[data-filter-subsystem]');
    if (s) { ui.filter.subsystem = ui.filter.subsystem === s.dataset.filterSubsystem ? '' : s.dataset.filterSubsystem; ui.tab = 'lane'; renderAll(); }
  };
}

  const lo = live.filter(r => r.level === 'lo');

  const riskRow = r => `<div class="rowline static riskrow" style="align-items:flex-start;padding:6px 9px">
    <span class="dotc" style="margin-top:6px;background:${r.st === 'accepted' ? 'var(--tx3)' : r.level === 'hi' ? 'var(--danger)' : r.level === 'mid' ? 'var(--warn)' : 'var(--tx3)'}"></span>

      ${r.key ? `<div class="riskact">

        <button data-risk="${r.key}|closed">关闭</button>

  el.innerHTML = `
    <div class="rail-sec">
