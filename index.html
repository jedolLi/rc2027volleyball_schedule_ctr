/* =========================================================================
 *  云同步：Supabase 免费层 · 房间级共享（可选）
 *  - 配置存 rc2027_cloud_v1，不进 state，避免随数据上传/导出
 *  - 乐观锁：PATCH ?rev=eq.R，返回空数组即冲突
 *  - commit 后 800ms 防抖上传；每 20s / 聚焦时检查云端
 * ========================================================================= */
const CLOUD_CFG_KEY = 'rc2027_cloud_v1';
const CLOUD_SNAPSHOT_KEY = 'rc2027_before_pull';
var cloudTimer = null, cloudBusy = false, cloudOffline = false, cloudBanner = null, cloudBannerRev = 0;

function cloudCfg() {
  try { return JSON.parse(localStorage.getItem(CLOUD_CFG_KEY)) || {}; }
  catch (e) { return {}; }
}
function cloudSaveCfg(patch) {
  const c = Object.assign({ room: 'rc2027', auto: true, rev: 0 }, cloudCfg(), patch || {});
  try { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(c)); } catch (e) {}
  return c;
}
function cloudReady() { const c = cloudCfg(); return !!(c.url && c.key); }
function cloudUserName() { const u = me(); return u ? (u.name || '成员') : '未登录'; }
function cloudAgo(iso) {
  const t = iso ? new Date(iso).getTime() : 0;
  if (!t) return '还没同步过';
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 60) return s + ' 秒前';
  if (s < 3600) return Math.round(s / 60) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}

function cloudPill(mode, text, title) {
  const el = $('#cloudPill');
  if (!el) return;
  el.className = 'cloud-pill ' + mode;
  const s = el.querySelector('span');
  if (s) s.textContent = text;
  el.title = title || '';
}
function cloudStatusFromCfg() {
  if (!cloudReady()) return cloudPill('off', '未同步', '点这里配置云同步');
  if (cloudOffline) return cloudPill('err', '离线', '连不上云端，恢复后自动重试');
  const c = cloudCfg();
  cloudPill('on', '已同步', `最后同步 ${cloudAgo(c.at)} · 房间 ${c.room} · 由 ${c.by || cloudUserName()}`);
}

async function cloudReq(query, opts) {
  const c = cloudCfg();
  if (!c.url || !c.key) throw new Error('还没配置 Supabase');
  const base = c.url.replace(/\/+$/, '') + '/rest/v1/rc_state';
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch(base + (query || ''), {
      method: (opts && opts.method) || 'GET',
      headers: Object.assign({
        apikey: c.key,
        Authorization: 'Bearer ' + c.key,
        'Content-Type': 'application/json'
      }, (opts && opts.headers) || {}),
      body: opts && opts.body != null ? JSON.stringify(opts.body) : undefined,
      signal: ctl.signal
    });
    const txt = await r.text();
    let data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
    if (!r.ok) {
      if (r.status === 401 || r.status === 403) throw new Error('没有表权限：检查 grant SQL 与 publishable key');
      if (r.status === 404) throw new Error('表 rc_state 不存在，先跑建表 SQL');
      const msg = (data && (data.message || data.hint || data.details)) || ('HTTP ' + r.status);
      throw new Error(String(msg));
    }
    cloudOffline = false;
    return data;
  } catch (e) {
    if (e && e.name === 'AbortError') { cloudOffline = true; throw new Error('请求超时（12 秒）'); }
    if (e instanceof TypeError) { cloudOffline = true; throw new Error('连不上 Supabase（网络或项目休眠）'); }
    throw e;
  } finally { clearTimeout(timer); }
}

function cloudPayload() {
  const clean = JSON.parse(JSON.stringify(state));
  if (clean.settings && clean.settings.ai) clean.settings.ai.key = '';
  return clean;
}

async function cloudPull() {
  const c = cloudCfg();
  const rows = await cloudReq('?room=eq.' + encodeURIComponent(c.room) + '&select=room,data,rev,updated_at,updated_by');
  return { row: (rows && rows[0]) || null };
}

async function cloudPush(quiet) {
  if (!cloudReady()) { if (!quiet) cloudModal(); return; }
  if (cloudBusy) return;
  const c = cloudCfg();
  cloudBusy = true;
  cloudPill('busy', '同步中', '正在上传…');
  try {
    const rev = Number(c.rev || 0);
    const nowIso = new Date().toISOString();
    const who = cloudUserName();
    let rows;
    if (!rev) {
      rows = await cloudReq('', {
        method: 'POST',
        headers: { Prefer: 'resolution=ignore-duplicates,return=representation' },
        body: [{ room: c.room, data: cloudPayload(), rev: 1, updated_at: nowIso, updated_by: who }]
      });
      if (!rows || !rows.length) {
        cloudBusy = false;
        const rem = await cloudPull().catch(() => ({ row: null }));
        cloudStatusFromCfg();
        return cloudConflict(rem.row, 'init');
      }
    } else {
      rows = await cloudReq('?room=eq.' + encodeURIComponent(c.room) + '&rev=eq.' + rev, {
        method: 'PATCH',
        headers: { Prefer: 'return=representation' },
        body: { data: cloudPayload(), rev: rev + 1, updated_at: nowIso, updated_by: who }
      });
      if (!rows || !rows.length) {
        cloudBusy = false;
        const rem = await cloudPull().catch(() => ({ row: null }));
        cloudStatusFromCfg();
        return cloudConflict(rem.row, 'push');
      }
    }
    const row = rows[0];
    cloudSaveCfg({ rev: Number(row.rev) || rev + 1, at: nowIso, by: who });
    cloudBusy = false;
    cloudOffline = false;
    cloudStatusFromCfg();
    cloudHideBanner();
    if (!quiet) toast('已同步到云端');
  } catch (e) {
    cloudBusy = false;
    cloudPill('err', cloudOffline ? '离线' : '同步失败', String(e.message || e));
    if (!quiet) toast('同步失败：' + String(e.message || e), true);
  }
}

function cloudAfterCommit() {
  if (!cloudReady()) return;
  const c = cloudCfg();
  if (c.auto === false) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => cloudPush(true), 800);
}

function cloudApplyRemote(row) {
  const incoming = row && row.data;
  if (!incoming || !Array.isArray(incoming.tasks)) { toast('云端数据格式不对，已放弃', true); return; }
  const localKey = (state.settings && state.settings.ai && state.settings.ai.key) || '';
  try {
    localStorage.setItem(CLOUD_SNAPSHOT_KEY, JSON.stringify({ at: new Date().toISOString(), rev: Number(cloudCfg().rev || 0), data: state }));
  } catch (e) {}
  state = migrate(incoming);
  if (localKey && state.settings && state.settings.ai && !state.settings.ai.key) state.settings.ai.key = localKey;
  cloudSaveCfg({ rev: Number(row.rev) || 1, at: row.updated_at || new Date().toISOString(), by: row.updated_by || '' });
  applyLinks(); save(true); renderAll();
  cloudBannerRev = 0;
  cloudHideBanner();
  cloudStatusFromCfg();
  toast('已载入云端版本 · 本机旧版已备份');
}

/* ---------- 提示条：云端有更新 ---------- */
function cloudHideBanner() {
  if (cloudBanner && cloudBanner.parentNode) cloudBanner.parentNode.removeChild(cloudBanner);
  cloudBanner = null;
}
function cloudShowBanner(row) {
  const rev = Number(row.rev) || 0;
  if (rev && rev === cloudBannerRev) return;   // 同一版不重复弹
  cloudBannerRev = rev;
  cloudHideBanner();
  const who = row.updated_by || '队友';
  cloudBanner = document.createElement('div');
  cloudBanner.id = 'cloudBanner';
  cloudBanner.className = 'cloud-banner';
  cloudBanner.innerHTML = `<span class="cb-dot"></span>
    <span class="cb-tx">云端有更新 · <b>${esc(who)}</b> ${esc(cloudAgo(row.updated_at))}</span>
    <button class="cb-btn primary" data-cb="load">载入</button>
    <button class="cb-btn" data-cb="diff">看看变了什么</button>
    <button class="cb-x" data-cb="x">✕</button>`;
  document.body.appendChild(cloudBanner);
  cloudBanner.onclick = e => {
    const b = e.target.closest('[data-cb]');
    if (!b) return;
    const k = b.dataset.cb;
    if (k === 'x') { cloudBannerRev = rev; return cloudHideBanner(); }
    if (k === 'load') return cloudApplyRemote(row);
    if (k === 'diff') return cloudDiffModal(row);
  };
}

function cloudDiffModal(row) {
  const remote = row.data || {};
  const rm = new Map((remote.tasks || []).map(t => [t.id, t]));
  const lm = new Map(state.tasks.map(t => [t.id, t]));
  const lines = [];
  (state.tasks || []).forEach(t => {
    const r = rm.get(t.id);
    if (!r) { lines.push(`本机新增：${t.title}`); return; }
    if (r.title !== t.title) lines.push(`标题：${t.title} → ${r.title}`);
    if (r.start !== t.start || r.due !== t.due) lines.push(`${t.title}：${t.start}~${t.due} → ${r.start}~${r.due}`);
    if ((r.statusId || '') !== (t.statusId || '')) lines.push(`${t.title}：状态变了`);
  });
  (remote.tasks || []).forEach(t => { if (!lm.has(t.id)) lines.push(`云端新增：${t.title}`); });
  if (!lines.length) lines.push('任务数据没有差异（可能只是排期/周报/成员信息变了）');
  modal('云端改了什么', `<div class="cdiff">${lines.slice(0, 40).map(x => `<div>· ${esc(x)}</div>`).join('')}
    ${lines.length > 40 ? `<div class="muted">…还有 ${lines.length - 40} 条</div>` : ''}</div>`,
    `<button class="btn" data-close>关闭</button><button class="btn primary" id="cdLoad">载入云端版本</button>`,
    (m, close) => { m.querySelector('#cdLoad').onclick = () => { close(); cloudApplyRemote(row); }; });
}

/* ---------- 冲突 ---------- */
function cloudConflict(row, why) {
  cloudPill('conflict', '有冲突', '云端版本比你新');
  if (!row) return toast('云端已有数据，但拉不到内容', true);
  const who = row.updated_by || '队友';
  const when = cloudAgo(row.updated_at);
  modal('同步冲突',
    `<div class="cgrid">
      <div class="cmsg">${why === 'init' ? '这个房间云端已经有数据了。' : '你提交时，云端已经被别人改过。'}</div>
      <div class="cbox">
        <div><b>云端</b> · rev ${Number(row.rev) || '?'} · ${esc(who)} · ${esc(when)}</div>
        <div><b>本机</b> · rev ${Number(cloudCfg().rev || 0)} · ${state.tasks.length} 个任务</div>
      </div>
      <div class="cnote">选「用云端覆盖本机」之前，本机当前版本会自动备份到浏览器里（可恢复）。</div>
    </div>`,
    `<button class="btn ghost" data-close>取消</button>
     <button class="btn" id="cfRemote">用云端覆盖本机</button>
     <button class="btn primary" id="cfLocal">用本机覆盖云端</button>`,
    (m, close) => {
      m.querySelector('#cfRemote').onclick = () => { close(); cloudApplyRemote(row); };
      m.querySelector('#cfLocal').onclick = () => { close(); cloudSaveCfg({ rev: Number(row.rev) || 1 }); cloudPush(); };
    });
}

/* ---------- 配置弹窗 ---------- */
function cloudModal() {
  const c = cloudCfg();
  const body = `<div class="cgrid">
    <div class="pr"><span class="k">项目 URL</span>
      <input type="text" id="cUrl" placeholder="https://xxxx.supabase.co" value="${esc(c.url || '')}" spellcheck="false"></div>
    <div class="pr"><span class="k">Publishable key</span>
      <input type="text" id="cKey" placeholder="sb_publishable_..." value="${esc(c.key || '')}" spellcheck="false"></div>
    <div class="pr"><span class="k">房间名</span>
      <input type="text" id="cRoom" placeholder="rc2027" value="${esc(c.room || 'rc2027')}" spellcheck="false"></div>
    <label class="crow"><input type="checkbox" id="cAuto" ${c.auto === false ? '' : 'checked'}>
      <span>自动同步：改动后自动上传，每 20 秒检查云端更新</span></label>
    <div class="cmsg" id="cMsg">${cloudReady()
      ? `已配置 · 最后同步 ${esc(cloudAgo(c.at))} · rev ${Number(c.rev || 0)}`
      : '还没配置。填上项目 URL 和 publishable key，就能和队友共享同一份数据。'}</div>
    <div class="cnote">publishable key 本来就是公开的，可以放在网页里；<b>绝不要</b>填 <code>service_role</code> / <code>sb_secret_</code> 开头的密钥。</div>
  </div>`;
  modal('云同步', body, `
    <button class="btn ghost" id="cTest">测试连接</button>
    <button class="btn" id="cPull">从云端拉取</button>
    <button class="btn" id="cPush">立即上传</button>
    <button class="btn primary" id="cSave">保存</button>`,
    (m, close) => {
      const read = () => ({
        url: m.querySelector('#cUrl').value.trim().replace(/\/+$/, ''),
        key: m.querySelector('#cKey').value.trim(),
        room: (m.querySelector('#cRoom').value.trim() || 'rc2027'),
        auto: m.querySelector('#cAuto').checked
      });
      const msg = t => { const el = m.querySelector('#cMsg'); if (el) el.textContent = t; };
      const persist = () => { const v = read(); cloudSaveCfg(v); return v; };
      m.querySelector('#cSave').onclick = () => {
        persist(); close(); cloudStatusFromCfg();
        toast(cloudReady() ? '云同步已保存' : '云同步已关闭');
        if (cloudReady()) cloudPoll();
      };
      m.querySelector('#cTest').onclick = async () => {
        persist(); msg('连接中…');
        try {
          const { row } = await cloudPull();
          cloudOffline = false; cloudStatusFromCfg();
          msg(row ? `连上了 · 云端 rev ${row.rev} · ${row.updated_by || '队友'} ${cloudAgo(row.updated_at)}` : '连上了 · 云端还是空的');
        } catch (e) { msg('失败：' + (e.message || e)); cloudStatusFromCfg(); }
      };
      m.querySelector('#cPush').onclick = async () => {
        persist(); close();
        await cloudPush();
      };
      m.querySelector('#cPull').onclick = async () => {
        persist(); msg('读取云端…');
        try {
          const { row } = await cloudPull();
          if (!row) { msg('云端还没有数据'); return toast('云端还没有数据'); }
          close();
          cloudConflict(row, 'pull');
        } catch (e) { msg('失败：' + (e.message || e)); }
      };
    });
}

/* ---------- 轮询 ---------- */
async function cloudPoll() {
  if (!cloudReady() || cloudBusy) return;
  const c = cloudCfg();
  try {
    const { row } = await cloudPull();
    cloudOffline = false;
    if (!row) { cloudStatusFromCfg(); return; }
    if (Number(row.rev) > Number(c.rev || 0)) {
      cloudShowBanner(row);
      cloudPill('conflict', '有更新', '云端有新版本');
    } else cloudStatusFromCfg();
  } catch (e) {
    cloudStatusFromCfg();
  }
}

function initCloud() {
  const pill = $('#cloudPill');
  if (pill) pill.onclick = cloudModal;
  const bs = $('#btnSettings');
  if (bs) { bs.onclick = cloudModal; bs.title = '云同步设置'; }
  cloudStatusFromCfg();
  if (!cloudReady()) return;
  setTimeout(() => cloudPoll(), 1200);
  setInterval(() => { if (document.visibilityState === 'visible' && !cloudBusy) cloudPoll(); }, 20000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') cloudPoll();
  });
  window.addEventListener('focus', () => cloudPoll());
  window.addEventListener('online', () => { cloudOffline = false; cloudPoll(); });
  window.addEventListener('offline', () => { cloudOffline = true; cloudStatusFromCfg(); });
}
initCloud();

</script>
</body>
</html>
