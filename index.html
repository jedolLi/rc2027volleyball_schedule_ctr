      ${live.length ? `
        ${hi.length ? `<div class="surf">${hi.slice(0, 4).map(riskRow).join('')}</div>` : ''}
        ${mid.length ? `<div class="surf">${mid.slice(0, 5).map(riskRow).join('')}</div>` : ''}
        ${lo.length ? `<div class="surf" style="opacity:.72">${lo.slice(0, 4).map(riskRow).join('')}</div>` : ''}
        ${live.length > 13 ? `<div class="s" style="padding:0 6px;color:var(--tx3)">还有 ${live.length - 13} 条…</div>` : ''}
      ` : `<div class="surf"><div class="empty" style="padding:12px">没有待处理风险</div></div>`}
      ${closed.length ? `<details class="riskclosed"><summary>已关闭 ${closed.length} 条</summary>
        ${closed.map(r => `<div class="rowline static" style="padding:4px 9px;align-items:flex-start">
          <div style="flex:1;min-width:0"><div class="s" style="white-space:normal;color:var(--tx3);line-height:1.5;text-decoration:line-through">${r.text}</div>
          ${r.key ? `<div class="riskact"><button data-risk="${r.key}|open">恢复</button></div>` : ''}</div>
        </div>`).join('')}</details>` : ''}
    </div>

    <div class="rail-sec">
      <div class="rail-h">人员状态 <span class="n">${state.members.length}</span></div>
      ${state.members.map(m => {
        const r = avail.get(m.id)?.get(d);
        const free = r ? Math.round(r.free * 100) : 100;
        const openCount = state.tasks.filter(t => !statusOf(t).isDone && (t.ownerIds || []).includes(m.id)).length;
        const col = free < 35 ? 'var(--danger)' : free < 70 ? 'var(--warn)' : 'var(--acc)';
        return `<div class="rowline" data-edit-member="${m.id}">
          ${avatar(m)}
          <div style="flex:1;min-width:0"><div class="t">${esc(m.name)}</div>
            <div class="s">${openCount ? openCount + ' 个进行中' : '无进行中任务'}${r && r.hard > .5 ? ' · 考试中' : ''}</div></div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
            <span class="s num" style="color:${col}">${free}%</span>
            <div class="mbar" style="width:34px"><i style="width:${free}%;background:${col}"></i></div>
          </div>
        </div>`;
      }).join('') || `<div class="surf"><div class="empty" style="padding:12px">还没有成员</div></div>`}
    </div>

    <div class="rail-sec">
      <div class="rail-h">最近变更</div>
      ${state.activity.slice(0, 6).map(a => `<div class="rowline static" style="padding:4px 9px">
        <div style="flex:1;min-width:0"><div class="s" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.text)}</div></div>
      </div>`).join('') || `<div class="s" style="padding:0 6px;color:var(--tx3)">暂无</div>`}
    </div>`;

  el.onclick = e => {
    const rk = e.target.closest('[data-risk]');
    if (rk) {
      const [key, status] = rk.dataset.risk.split('|');
      if (status === 'open') delete state.riskState[key];
      else state.riskState[key] = { status, at: new Date().toISOString() };
      commit();
      applyRightRail();
      renderPulse();
      toast(status === 'closed' ? '已关闭，可在「已关闭」里恢复' : status === 'accepted' ? '已标记为接受风险' : '已恢复');
      return;
    }
    const m = e.target.closest('[data-edit-member]');
    if (m) return openMemberModal(m.dataset.editMember);
  };
}

/* =========================================================================
 *  视图 1 · 时间泳道（按子系统分泳道，人员占用做遮罩）
 * ========================================================================= */
/* 关键路径：沿前置任务找最长链（按任务天数累加），用于甘特高亮 */
function criticalPath() {
const live = state.tasks.filter(t => t.start && t.due);
  if (!live.some(t => (t.depIds || []).length)) return { ids: new Set(), len: 0 };
  const byId = new Map(live.map(t => [t.id, t]));
  const dur = t => Math.max(1, diffDays(t.start, t.due) + 1);
  const memo = new Map(), visiting = new Set();
  const best = t => {
    if (memo.has(t.id)) return memo.get(t.id);
    if (visiting.has(t.id)) return { len: dur(t), chain: [t.id] };
    visiting.add(t.id);
    let bd = null;
    for (const id of (t.depIds || [])) {
      const d = byId.get(id);
      if (!d) continue;
      const r = best(d);
      if (!bd || r.len > bd.len) bd = r;
    }
    visiting.delete(t.id);
    const r = { len: dur(t) + (bd ? bd.len : 0), chain: (bd ? bd.chain : []).concat(t.id) };
    memo.set(t.id, r);
    return r;
  };
  let top = null;
  for (const t of live) { const r = best(t); if (!top || r.len > top.len) top = r; }
  return { ids: new Set(top ? top.chain : []), len: top ? top.len : 0 };
}
function ppState() {
  if (!ui.people) ui.people = { task: '', mem: '', q: '' };
  return ui.people;
}

function renderLane(v, mode) {
  mode = mode || 'sub';
  const { start, days, list, zoom } = laneRange();
  const avail = buildAvailability(start, list[list.length - 1]);
  const stageW = document.querySelector('#stageBody')?.clientWidth || (window.innerWidth - 480);
  const availW = Math.max(300, stageW - (mode === 'mem' ? 558 : 224));
  const colW = zoom === 'week' ? clamp(availW / 7, 44, 320)
    : zoom === 'month' ? clamp(availW / 35, 12, 110)
      : clamp(availW / days, 14, 72);
  const trackW = Math.round(colW * days);
  const crit = criticalPath();
  const t0 = today();
  const isMem = mode === 'mem';
  const sel = ppState();

  // 时间轴头
  const cells = list.map((d, i) => {
    const dt = parseYmd(d);
    const weekend = isWeekend(d);
    const wkStart = (dt.getDay() + 6) % 7 === 0;
    const wkOdd = zoom === 'month' && Math.floor(i / 7) % 2 === 1;
    return `<div class="dc ${weekend ? 'dim' : ''} ${wkStart ? 'wkstart' : ''} ${wkOdd ? 'wkodd' : ''} ${d === t0 ? 'today' : ''}" style="width:${colW}px"></div>`;
  }).join('');
  let headCells = '';
  if (zoom === 'month') {
    for (let i = 0; i < days; i += 7) {
      const a0 = list[i], b0 = list[Math.min(i + 6, days - 1)];
      const isNow = t0 >= a0 && t0 <= b0;
      const wkW = colW * 7;
      const d0 = parseYmd(a0), d1 = parseYmd(b0);
      const label = wkW >= 150 ? `${fmtMD(a0)} – ${fmtMD(b0)}` : `${d0.getMonth() + 1}/${d0.getDate()}–${d1.getDate()}`;
      const daysRow = wkW >= 118 ? `<span class="wdays">${list.slice(i, i + 7).map(d => parseYmd(d).getDate()).join(' ')}</span>` : '';
      headCells += `<div class="dh wkh ${isNow ? 'today' : ''}" style="width:${wkW}px">
        <b>${label}</b>${daysRow}
      </div>`;
    }
  } else if (zoom === 'week') {
    headCells = list.map(d => {
      const dt = parseYmd(d);
      const wd = ['日', '一', '二', '三', '四', '五', '六'][dt.getDay()];
      return `<div class="dh ${isWeekend(d) ? 'weekend' : ''} ${d === t0 ? 'today' : ''}" style="width:${colW}px">
        <span class="wd">周${wd}</span><span class="dn">${dt.getMonth() + 1}/${dt.getDate()}</span>
      </div>`;
    }).join('');
  } else {
    headCells = list.map(d => {
      const dt = parseYmd(d);
      const show = colW >= 16 || dt.getDate() === 1;
      return `<div class="dh ${isWeekend(d) ? 'weekend' : ''} ${d === t0 ? 'today' : ''} ${colW < 19 ? 'tight' : ''}" style="width:${colW}px">
        ${show ? `<span>${dt.getDate()}</span>${colW >= 34 ? `<span class="m">${dt.getMonth() + 1}m</span>` : ''}` : ''}
      </div>`;
    }).join('');
  }

  let wkBoxes = '';
  if (zoom === 'month') {
    for (let i = 0; i < days; i += 7) {
      wkBoxes += `<div class="wkbox" style="left:${i * colW + 2}px;width:${7 * colW - 6}px"></div>`;
    }
  }
  const msHtml = state.milestones.filter(m => m.date >= start && m.date <= list[list.length - 1]).map(m => {
    const idx = diffDays(start, m.date);
    return `<div class="mstone" style="left:${idx * colW + colW / 2}px"><span class="cap">${esc(m.name)}</span></div>`;
  }).join('');
  const todayHtml = (t0 >= start && t0 <= list[list.length - 1])
    ? `<div class="today-line" style="left:${diffDays(start, t0) * colW + colW / 2}px"></div>` : '';

  // 子系统泳道
  const subs = state.subsystems.filter(s => !ui.filter.subsystem || s.id === ui.filter.subsystem);
  const laneRow = (s) => {
    const ts = state.tasks.filter(t => t.subsystemId === s.id);
    // 占用遮罩：只画在这条泳道真正有任务的区间里，且只保留"考试/硬占用"与"复习期"
    const owners = [...new Set(ts.flatMap(t => t.ownerIds || []))];
    const dated = ts.filter(t => t.start && t.due);
    const spanFrom = dated.length ? dated.reduce((a, t) => t.start < a ? t.start : a, dated[0].start) : null;
    const spanTo = dated.length ? dated.reduce((a, t) => t.due > a ? t.due : a, dated[0].due) : null;
    // 每个人在这条泳道里"真正在手"的区间：他的任务没开始/已结束，他的占用就不该染这条泳道
    const ownSpan = {};
    for (const t of dated) {
      for (const oid of (t.ownerIds || [])) {
        const cur = ownSpan[oid] || (ownSpan[oid] = { from: t.start, to: t.due });
        if (t.start < cur.from) cur.from = t.start;
        if (t.due > cur.to) cur.to = t.due;
      }
    }
    const BAND = 12;
    // 占用：逐日算出「谁被占、复习期还是考试日」，画成底部一条可点的占用带
    const occ = {};
    const occRuns = [];
    if (owners.length && spanFrom) {
      let run = null;
      const pushRun = () => {
        if (!run) return;
        const i0 = diffDays(start, run.a), i1 = diffDays(start, run.b);
        occRuns.push(`<div class="off-mask ${run.cls}" style="left:${i0 * colW}px;width:${(i1 - i0 + 1) * colW}px"></div>`);
        run = null;
      };
      for (const d of list) {
        if (d < spanFrom || d > spanTo) { pushRun(); continue; }
        let hard = false;
        const busyIds = [];
        for (const oid of owners) {
          const sp = ownSpan[oid];
          if (!sp || d < sp.from || d > sp.to) continue;
          const r = avail.get(oid)?.get(d);
          if (!r) continue;
          if (r.hard > .5) hard = true;
          if (r.hard > .5 || (r.pbusy ?? r.busy) > .2) busyIds.push(oid);
        }
        const cls = hard ? 'hard' : (busyIds.length ? 'soft' : '');
        if (!cls) { pushRun(); continue; }
        occ[d] = { cls, ids: busyIds.join('+') };
        if (run && run.cls === cls) run.b = d; else { pushRun(); run = { a: d, b: d, cls }; }
      }
      pushRun();
    }
    const bandCells = Object.keys(occ).map(d => {
      const o = occ[d];
      return `<div class="off-cell ${o.cls}" data-pop="busy:${o.ids}|${d}|${o.cls}|${s.id}"
        style="left:${diffDays(start, d) * colW}px;width:${colW}px"></div>`;
    }).join('');
    const bars = ts.filter(t => t.start && t.due).map(t => {
      const cd = contEnd(t);
      const endDue = (cd && cd > t.due) ? cd : t.due;
      const i0 = diffDays(start, t.start), i1 = diffDays(start, t.due), i2 = diffDays(start, endDue);
      if (i2 < 0 || i0 >= days) return null;
      const x = clamp(i0, 0, days - 1) * colW;
      const wMain = clamp(i1 - i0 + 1, 1, days) * colW - 3;
      const wAll = clamp(i2 - i0 + 1, 1, days) * colW - 3;
      const st = statusOf(t);
      const done = st.isDone || taskPct(t) >= 100;
      const over = endDue < t0 && !done;
      const pend = pendingCollabs(t).length;
      return { t, i0: clamp(i0, 0, days - 1), i1: clamp(i1, 0, days - 1), i2: clamp(i2, 0, days - 1), x, wMain: Math.max(wMain, 8), wAll: Math.max(wAll, 8), done, over, st, pend, cEnd: cd };
    }).filter(Boolean);
    bars.sort((a, b) => a.i0 - b.i0 || a.i2 - b.i2);
    // 贪心分行：后开始的条放到第一个"已空出"的槽位
    const laneEnds = [];
    for (const b of bars) {
      let li = laneEnds.findIndex(end => b.i0 > end);
      if (li < 0) { li = laneEnds.length; laneEnds.push(-1); }
      laneEnds[li] = b.i2;
      b.lane = li;
    }
    const rows = Math.max(3, laneEnds.length);
    const ROW_H = 26, TRACK_PAD = 4;
    const trackH = rows * ROW_H + TRACK_PAD * 2 + BAND;
    const lim = list[list.length - 1];
    const barsHtml = bars.map(b => `<div class="lbar ${b.done ? 'done' : ''} ${b.over ? 'over' : ''} ${b.cEnd ? 'hascont' : ''} ${crit.ids.has(b.t.id) ? 'crit' : ''} ${b.t.start < start ? 'clip-l' : ''} ${(b.cEnd || b.t.due) > lim ? 'clip-r' : ''}" data-open-task="${b.t.id}" data-drag-task="${b.t.id}" data-pop="task:${b.t.id}"
        style="left:${b.x}px;width:${b.wAll}px;top:${TRACK_PAD + b.lane * ROW_H}px" title="${esc(b.t.title)} · ${esc(b.st.name)} · ${taskCpSummary(b.t)}${b.cEnd ? ' · ' + esc(contLabel(b.t)) : ''}${b.t.link ? ' · ' + esc(linkText(b.t)) : ''}">
        ${b.cEnd ? `<div class="cx" style="left:${Math.max(0, b.wMain - 3)}px;width:${Math.max(0, b.wAll - b.wMain)}px"></div>` : ''}
        <div class="fill" style="width:${Math.round(taskPct(b.t) * Math.max(0.02, b.wMain / Math.max(1, b.wAll)))}%"></div>
        <span class="lb">${esc(b.t.title)}${b.pend ? `<i class="badge-c">协${b.pend}</i>` : ''}${b.t.link ? `<i class="badge-l" title="${esc(linkText(b.t))}">↳</i>` : ''}</span>
      </div>`).join('');
    const pct = ts.length ? Math.round(ts.reduce((a, t) => a + taskPct(t), 0) / ts.length) : 0;
    return `<div class="lane-row">
      <div class="lane-lab" style="height:${trackH}px">
        <span class="dotc" style="background:${pct >= 100 ? 'var(--ok)' : 'var(--tx3)'}"></span>
        <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</span>
        <span class="s num" style="margin-left:auto;color:var(--tx3)">${pct}%</span>
      </div>
      <div class="lane-track" style="width:${trackW}px;height:${trackH}px">
        <div class="dgrid">${cells}</div>${wkBoxes}
        ${occRuns.join('')}
        ${barsHtml}
        <div class="offband">${bandCells}</div>
      </div>
    </div>`;
  };

  // 人员泳道
  const memRow = m => {
    const ts = state.tasks.filter(t => (t.ownerIds || []).includes(m.id) && t.start && t.due);
    // 只在这人真正有任务的区间里画占用，且只保留硬占用/复习期
    const spanFrom = ts.length ? ts.reduce((a, t) => t.start < a ? t.start : a, ts[0].start) : null;
    const spanTo = ts.length ? ts.reduce((a, t) => t.due > a ? t.due : a, ts[0].due) : null;
    const BAND = 12;
    const occ = {};
    const occRuns = [];
    let run = null;
    const pushRun = () => {
      if (!run) return;
      const i0 = diffDays(start, run.a), i1 = diffDays(start, run.b);
      occRuns.push(`<div class="off-mask ${run.cls}" style="left:${i0 * colW}px;width:${(i1 - i0 + 1) * colW}px"></div>`);
      run = null;
    };
    for (const d of list) {
      if (!spanFrom || d < spanFrom || d > spanTo) { pushRun(); continue; }
      const r = avail.get(m.id)?.get(d);
      let cls = '';
      if (r) {
        if (r.hard > .5) cls = 'hard';
        else if ((r.pbusy ?? r.busy) > .2) cls = 'soft';
      }
      if (cls) {
        occ[d] = { cls, ids: m.id };
        if (run && run.cls === cls) run.b = d;
        else { pushRun(); run = { a: d, b: d, cls }; }
      } else pushRun();
    }
    pushRun();
    const bandCells = Object.keys(occ).map(d => {
      const o = occ[d];
      return `<div class="off-cell ${o.cls}" data-pop="busy:${o.ids}|${d}|${o.cls}"
        style="left:${diffDays(start, d) * colW}px;width:${colW}px"></div>`;
    }).join('');
    const items = ts.map(t => {
      const i0 = diffDays(start, t.start), i1 = diffDays(start, t.due);
      if (i1 < 0 || i0 >= days) return null;
      const x = clamp(i0, 0, days - 1) * colW;
      const w = clamp(i1 - i0 + 1, 1, days) * colW - 3;
      return { t, i0: clamp(i0, 0, days - 1), i1: clamp(i1, 0, days - 1), x, w: Math.max(w, 8) };
    }).filter(Boolean);
    items.sort((a, b) => a.i0 - b.i0 || a.i1 - b.i1);
    const laneEnds = [];
    for (const b of items) {
      let li = laneEnds.findIndex(end => b.i0 > end);
      if (li < 0) { li = laneEnds.length; laneEnds.push(-1); }
      laneEnds[li] = b.i1;
      b.lane = li;
    }
    const rows = Math.max(3, laneEnds.length);
    const ROW_H = 22, TRACK_PAD = 3;
    const trackH = rows * ROW_H + TRACK_PAD * 2 + BAND;
    const lim = list[list.length - 1];
    const bars = items.map(b => `<div class="lbar ${statusOf(b.t).isDone ? 'done' : ''} ${sel.task === b.t.id ? 'pp-sel' : ''} ${b.t.start < start ? 'clip-l' : ''} ${b.t.due > lim ? 'clip-r' : ''}" data-pp-task="${b.t.id}" data-pp-owner="${m.id}" data-open-task="${b.t.id}" data-drag-task="${b.t.id}" data-pop="task:${b.t.id}"
        style="left:${b.x}px;width:${b.w}px;height:18px;top:${TRACK_PAD + b.lane * ROW_H}px" title="${esc(b.t.title)}">
        <div class="fill" style="width:${taskPct(b.t)}%"></div>
        <span class="lb" style="font-size:10px">${esc(b.t.title)}</span>
      </div>`).join('');
    const hl = sel.task && ts.some(t => t.id === sel.task);
    const on = sel.mem === m.id;
    const dim = (sel.mem && !on) || (sel.task && !hl);
    return `<div class="lane-row pp-mrow ${on ? 'on' : ''} ${hl ? 'hl' : ''} ${dim ? 'dim' : ''}" data-pp-mem="${m.id}">
      <div class="lane-lab" style="cursor:pointer;height:${trackH}px">
        ${avatar(m)}<span class="pp-nm">${esc(m.name)}</span><span class="pp-rl">${(m.roles || []).map(r => byId(state.roles, r)?.name).filter(Boolean).join(' · ')}</span>
        <span class="s num" style="margin-left:auto;color:var(--tx3)">${ts.length}</span>
      </div>
      <div class="lane-track" style="width:${trackW}px;height:${trackH}px">
        <div class="dgrid">${cells}</div>${wkBoxes}
        ${occRuns.join('')}
        ${bars}
        <div class="offband">${bandCells}</div>
      </div>
    </div>`;
  };

  // 每周摘要：贴在时间轴顶上，点开看机器人归档的周报
  const wkChips = weeksInRange(start, list[list.length - 1]).map(w => {
    const st = weekStats(w);
    const from = w.start < start ? start : w.start;
    const to = w.end > list[list.length - 1] ? list[list.length - 1] : w.end;
    const left = diffDays(start, from) * colW;
    const width = (diffDays(start, to) - diffDays(start, from) + 1) * colW;
    const cls = w.archived ? 'arch' : w.ghost ? 'ghost' : 'now';
    const d = st.delta;
    const cw = Math.max(34, Math.round(width - 5));
    return `<div class="wk-chip ${cls}" data-pop="week:${w.id}" style="left:${left + 2}px;width:${cw}px"
      title="${esc(weekLabel(w))} · ${w.archived ? '已归档' : w.ghost ? '未开始' : '进行中'}">
      ${cw >= 64 ? `<span class="d0">${cw >= 84 ? fmtMD(w.start) : `${parseYmd(w.start).getDate()}日`}</span>` : ''}
      ${w.ghost ? '<b class="gh">—</b>' : `<b>${w.archived ? st.archive.avgTo : st.avg}%</b>
      ${d ? `<span class="dt" style="color:${d > 0 ? 'var(--ok)' : 'var(--danger)'}">${d > 0 ? '↑' : '↓'}${Math.abs(d)}</span>` : ''}`}
    </div>`;
  }).join('');

  const selTaskIds = state.tasks.slice().sort((a, b) => (a.due ? 0 : 1) - (b.due ? 0 : 1) || String(a.due || '9999').localeCompare(String(b.due || '9999')));
  const cardHtml = selTaskIds.map(t => {
    const own = sel.mem && (t.ownerIds || []).includes(sel.mem);
    return `<div class="pp-card ${sel.task === t.id ? 'on' : ''} ${own ? 'own' : ''}" draggable="true" data-pp-task="${t.id}">
      <div class="pp-t">${esc(t.title)}</div>
      <div class="pp-m">${esc(subsystem(t.subsystemId)?.name || '未分组')} · ${esc(statusOf(t).name)} · ${taskPct(t)}%</div>
      <div class="pp-ow">${owAvatars(t)}</div>
      <div class="pp-d">
        <input type="date" data-pp-s="${t.id}" value="${t.start || ''}">
        <span class="pp-arrow">→</span>
        <input type="date" data-pp-d="${t.id}" value="${t.due || ''}">
        <span class="pp-len">${t.start && t.due ? (diffDays(t.start, t.due) + 1) + '天' : '未排期'}</span>
      </div>
    </div>`;
  }).join('');
  const sideHtml = isMem ? `<aside class="pp-side">
    <div class="pp-side-h"><b>任务卡片</b><span class="s">${selTaskIds.length}</span>
      <input type="search" id="ppQ" placeholder="搜任务…" value="${esc(sel.q || '')}"></div>
    <div class="pp-hint">拖卡片到人 = 加一个负责人；把人身上的任务条拖回来 = 收回他</div>
    <div class="pp-cards">${cardHtml}</div>
  </aside>` : '';
  v.innerHTML = `
    <div class="pp-wrap ${isMem ? 'with-side' : ''}">
    <div class="pp-main">
    <div class="fbar">
      ${isMem ? '' : `<div class="seg">${['', ...state.subsystems.map(s => s.id)].map(id => {
        const nm = id ? (subsystem(id)?.name || '') : '全部';
        return `<button data-lane-sub="${id}" class="${(ui.filter.subsystem || '') === id ? 'on' : ''}">${esc(nm)}</button>`;
      }).join('')}</div>`}
      <span class="sp"></span>
      <div class="seg zoomseg">${[['week', '周'], ['month', '月'], ['custom', '自定义']].map(([k, n]) => `<button data-zoom="${k}" class="${zoom === k ? 'on' : ''}">${n}</button>`).join('')}</div>
      <span class="zoom-custom" style="${zoom === 'custom' ? '' : 'display:none'}">
        <input type="date" id="laneStart" value="${start}" style="width:132px">
        <select id="laneDays">
          ${[21, 35, 49, 70, 98].map(n => `<option value="${n}" ${n === days ? 'selected' : ''}>${n} 天</option>`).join('')}
        </select>
      </span>
      <button class="btn ghost sm" id="laneToday">今天</button>
      <span class="s" style="display:inline-flex;align-items:center;gap:12px;color:var(--tx3);margin-left:6px">
        <span style="display:inline-flex;align-items:center;gap:5px"><i style="display:inline-block;width:15px;height:9px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--busy-stripe) 0 3px,transparent 3px 8px),var(--busy-band);box-shadow:0 0 0 1px var(--busy-line) inset"></i>复习期占用</span>
        <span style="display:inline-flex;align-items:center;gap:5px"><i style="display:inline-block;width:15px;height:9px;border-radius:2px;background:var(--hard-band);box-shadow:0 0 0 1px var(--hard-line) inset"></i>考试 / 硬占用</span>
      </span>
    </div>
    <div class="lane-wrap zoom-${zoom}">
      <div class="lane-head">
        <div class="lane-lab">${isMem ? '人员' : '子系统'}</div>
        <div class="lane-track" style="width:${trackW}px">
          <div class="dhd">${headCells}</div>
        </div>
      </div>
      <div class="lane-head wk-head">
        <div class="lane-lab">周摘要</div>
        <div class="lane-track" style="width:${trackW}px">${wkChips}</div>
      </div>
      ${isMem ? state.members.map(memRow).join('') : subs.map(laneRow).join('')}
      <div style="position:absolute"></div>
    </div>
    </div>
    ${sideHtml}
    </div>`;

  // 今天线 & 里程碑线需要叠在所有泳道上：用一个绝对定位覆盖层
  const wrap = v.querySelector('.lane-wrap');
  wrap.style.position = 'relative';
  const overlay = document.createElement('div');
  overlay.style.cssText = `position:absolute;left:186px;top:0;bottom:0;width:${trackW}px;pointer-events:none;z-index:9`;
  overlay.innerHTML = msHtml + todayHtml;
  wrap.appendChild(overlay);

  // —— 拖动任务条改期（带影响提示） ——
  let suppressedClick = 0, dragInfo = null;
  const tipEl = () => {
    let el = document.getElementById("dragTip");
    if (!el) { el = document.createElement("div"); el.id = "dragTip"; el.className = "drag-tip"; document.body.appendChild(el); }
    return el;
  };
  const hideTip = () => { const el = document.getElementById("dragTip"); if (el) el.remove(); };
  const impactOf = (t, ns, nd) => {
    const av = buildAvailability(ns, nd);
    let hard = 0, soft = 0;
    for (let d = ns; d <= nd; d = addDays(d, 1)) {
      for (const oid of (t.ownerIds || [])) {
        const r = av.get(oid) && av.get(oid).get(d);
        if (!r) continue;
        if (r.hard > .5) hard++;
        else if ((r.pbusy ?? r.busy) > .5) soft++;
      }
    }
    const deps = state.tasks.filter(x => (x.depIds || []).includes(t.id)).length;
    return { hard, soft, deps };
  };
  v.querySelectorAll(".lbar[data-drag-task]").forEach(bar => {
    bar.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      if (e.target.closest('[data-rs]')) return;   // 边界把手交给缩放
      if (!canEditTask(state.tasks.find(x => x.id === bar.dataset.dragTask))) return;
      const t = state.tasks.find(x => x.id === bar.dataset.dragTask);
      if (!t || !t.start || !t.due) return;
      dragInfo = { t, bar, x0: e.clientX, dd: 0, mid: bar.dataset.ppOwner || "" };
      bar.classList.add("dragging");
      try { bar.setPointerCapture(e.pointerId); } catch (err) {}
    });
    bar.addEventListener("pointermove", e => {
      if (!dragInfo || dragInfo.bar !== bar) return;
      const dd = Math.round((e.clientX - dragInfo.x0) / colW);
      const side = dragInfo.mid ? (document.elementFromPoint(e.clientX, e.clientY)?.closest('.pp-side') || null) : null;
      document.querySelector('.pp-side')?.classList.toggle('pp-drop', !!side);
      if (side) {
        const ow = member(dragInfo.mid);
        tipEl().innerHTML = `<b>收回 ${esc(ow ? ow.name : '')} 的任务</b><div class="bad">松手：从这个人身上收回「${esc(dragInfo.t.title)}」</div>`;
      } else {
        if (dd === dragInfo.dd) return;
        dragInfo.dd = dd;
        bar.style.transform = `translateX(${dd * colW}px)`;
        const t = dragInfo.t;
        const ns = addDays(t.start, dd), nd = addDays(t.due, dd);
        const im = impactOf(t, ns, nd);
        const bad = im.hard > 0;
        tipEl().innerHTML = `<b>${fmtMD(ns)} → ${fmtMD(nd)}</b><div class="${bad ? "bad" : ""}">${dd === 0 ? "原位" : (dd > 0 ? "推迟 " + dd + " 天" : "提前 " + (-dd) + " 天")}${im.hard ? " · 撞 " + im.hard + " 天考试" : ""}${im.soft ? " · " + im.soft + " 天复习期" : ""}${im.deps ? " · " + im.deps + " 个后续任务" : ""}</div>`;
      }
      const tp = tipEl(); tp.style.left = Math.min(e.clientX + 14, window.innerWidth - 200) + "px"; tp.style.top = (e.clientY + 16) + "px";
    });
    const finish = ev => {
      if (!dragInfo || dragInfo.bar !== bar) return;
      const { t, dd, mid } = dragInfo;
      const side = (ev && mid) ? (document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.pp-side') || null) : null;
      dragInfo = null;
      bar.classList.remove("dragging");
      bar.style.transform = "";
      hideTip();
      document.querySelector('.pp-side')?.classList.remove('pp-drop');
      if (side && mid) { suppressedClick = Date.now(); removeOwner(t, mid); return; }
      if (!dd) return;
      suppressedClick = Date.now();
      if (t.link) { t.link = null; }
      t.start = addDays(t.start, dd);
      t.due = addDays(t.due, dd);
      logActivity("task", `拖动改期「${t.title}」${dd > 0 ? "推迟" : "提前"} ${Math.abs(dd)} 天`);
      commit(); renderStage();
      toast(`已${dd > 0 ? "推迟" : "提前"} ${Math.abs(dd)} 天`);
    };
    bar.addEventListener("pointerup", e => finish(e));
    bar.addEventListener("pointercancel", () => { dragInfo = null; bar.classList.remove("dragging"); bar.style.transform = ""; hideTip(); document.querySelector(".pp-side")?.classList.remove("pp-drop"); });
  });

  v.onclick = e => {
    if (Date.now() - suppressedClick < 300 || Date.now() - (window._laneResizedAt || 0) < 300) return;
    const b = e.target.closest("[data-lane-sub]");
    if (b) { ui.filter.subsystem = b.dataset.laneSub; renderAll(); return; }
    const z = e.target.closest('[data-zoom]');
    if (z) { ui.zoom = z.dataset.zoom; state.settings.zoom = z.dataset.zoom; save(); renderAll(); return; }
    // 任务条 / 成员标签：单击 → 气泡切换为编辑态（不再直接弹全屏弹窗）
    // 占用遮罩：单击只展示预览气泡（没有可就地改的字段）
    const t = e.target.closest('[data-pop]');
    if (t) {
      const [kind, id] = t.dataset.pop.split(':');
      clearTimeout(popTimer);
      const same = popState && popState.kind === kind && popState.id === id;
      if (same && popState.editing) return;  // 已在编辑
      openPop(t, kind, id, kind !== 'busy');
      return;
    }
    const m = e.target.closest('[data-edit-member]');
    if (m) return openMemberModal(m.dataset.editMember);
    if (e.target.id === 'laneToday') { ui.zoom = 'custom'; state.settings.zoom = 'custom'; state.settings.ganttStart = addDays(today(), -2); save(); renderAll(); }
  };
  $('#laneStart').onchange = e => { ui.zoom = 'custom'; state.settings.zoom = 'custom'; state.settings.ganttStart = e.target.value; save(); renderAll(); };
  $('#laneDays').onchange = e => { ui.zoom = 'custom'; state.settings.zoom = 'custom'; state.settings.ganttDays = Number(e.target.value) || 49; save(); renderAll(); };
  if (isMem) bindPeople(v);
}

function removeOwner(t, mid) {
  if (!t) return;
  if (!canEditTask(t)) { toast("只能改自己负责的任务"); return; }
  const ids = t.ownerIds || [];
  if (!ids.includes(mid)) return;
  const ow = member(mid);
  t.ownerIds = ids.filter(x => x !== mid);
  logActivity("task", `从「${t.title}」收回 ${ow ? ow.name : ""} 的任务`);
  commit();
  renderStage();
  toast(t.ownerIds.length ? `已从 ${ow ? ow.name : ""} 收回（还剩 ${t.ownerIds.length} 人）` : `已从 ${ow ? ow.name : ""} 收回，当前无人负责`);
}

function bindPeople(v) {
  const sel = ppState();
  v.querySelectorAll('.pp-card[data-pp-task]').forEach(card => {
    const id = card.dataset.ppTask;
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', id);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('drag');
    });
    card.addEventListener('dragend', () => card.classList.remove('drag'));
    card.addEventListener('click', e => {
      if (e.target.closest('input')) return;
      sel.task = sel.task === id ? '' : id;
      sel.mem = '';
      renderStage();
    });
  });
  v.querySelectorAll('[data-pp-mem]').forEach(row => {
    const mid = row.dataset.ppMem, m = member(mid);
    row.addEventListener('click', e => {
      if (e.target.closest('.lbar') || e.target.closest('input')) return;
      sel.mem = sel.mem === mid ? '' : mid;
      sel.task = '';
      renderStage();
    });
    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drop'); });
    row.addEventListener('dragleave', () => row.classList.remove('drop'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('drop');
      const t = state.tasks.find(x => x.id === e.dataTransfer.getData('text/plain'));
      if (!t || !m) return;
      if (!canEditTask(t)) { toast('只能改自己负责的任务'); return; }
      const ids = t.ownerIds || [];
      if (e.altKey) {
        if (ids.length === 1 && ids[0] === mid) { toast(`${m.name} 已经在单独负责这个任务`); return; }
        t.ownerIds = [mid];
        sel.mem = mid; sel.task = '';
        logActivity('task', `把「${t.title}」改为 ${m.name} 单独负责`);
        commit();
        renderStage();
        toast(`已改为 ${m.name} 单独负责`);
        return;
      }
      if (ids.includes(mid)) { toast(`${m.name} 已经在负责这个任务`); return; }
      t.ownerIds = [...ids, mid];
      sel.mem = mid; sel.task = '';
      logActivity('task', `把「${t.title}」也交给 ${m.name} 负责`);
      commit();
      renderStage();
      toast(ids.length ? `已加上 ${m.name}（现 ${t.ownerIds.length} 人负责）` : `已交给 ${m.name}`);
    });
  });
  v.addEventListener('change', e => {
    const s = e.target.closest('[data-pp-s]'), d = e.target.closest('[data-pp-d]');
    if (!s && !d) return;
    const id = (s || d).dataset.ppS || (s || d).dataset.ppD;
    const t = state.tasks.find(x => x.id === id);
    if (!t || !canEditTask(t)) return;
    const ns = s ? s.value : t.start, nd = d ? d.value : t.due;
    if (!ns || !nd || ns > nd) { toast('开始不能晚于结束'); renderStage(); return; }
    if (ns === t.start && nd === t.due) return;
    t.start = ns; t.due = nd;
    logActivity('task', `调整「${t.title}」周期为 ${ns} → ${nd}`);
    commit(); renderStage();
  });
  const q = v.querySelector('#ppQ');
  if (q) q.addEventListener('input', () => {
    const kw = q.value.trim();
    sel.q = kw;
    v.querySelectorAll('.pp-card').forEach(c => {
      const t = state.tasks.find(x => x.id === c.dataset.ppTask);
      c.style.display = (!kw || (t && t.title.includes(kw))) ? '' : 'none';
    });
  });
}

/* =========================================================================
 *  视图 2 · 看板
 * ========================================================================= */
function renderKanban(v) {
  const list = filteredTasks();
  const cols = [...state.statuses].sort((a, b) => a.order - b.order);

  const card = t => {
    const st = statusOf(t);
    const dueE = effDue(t);
    const over = dueE && dueE < today() && !st.isDone;
    const pendN = pendingCollabs(t).length;
    return `<div class="kcard" draggable="true" data-task="${t.id}" data-pop="task:${t.id}">
      <div class="kt">${esc(t.title)}${t.link ? `<span class="lk" title="${esc(linkText(t))}">↳</span>` : ''}</div>
      <div class="km">
        <span class="dotc" style="background:${st.isDone ? 'var(--ok)' : 'var(--tx3)'}"></span>
        <span>${esc(subName(t.subsystemId))}</span>
        ${t.due ? `<span class="due ${over ? 'over' : ''}">${over ? '逾期 ' + (-diffDays(today(), dueE)) + 'd' : (contActive(t) ? '延续中' : fmtMD(t.due))}</span>` : ''}
        ${pendN ? `<span class="pill cb" title="跨子系统协作申请">协 ${pendN}</span>` : ''}
        ${prioIsUrgent(t) ? `<span style="color:var(--warn);font-weight:600">!</span>` : ''}
        <span class="avs" style="margin-left:auto">${(t.ownerIds || []).slice(0, 3).map(id => avatar(member(id))).join('')}</span>
      </div>
      ${(t.checkpoints || []).length ? `<div class="mbar" style="margin-top:7px"><i class="${taskPct(t) >= 100 ? 'done' : ''}" style="width:${taskPct(t)}%"></i></div>` : ''}
    </div>`;
  };

  v.innerHTML = `
    <div class="fbar">
      <input type="search" id="kbQ" value="${esc(ui.filter.q)}" placeholder="搜索任务…" style="width:180px">
      <select id="kbSub"><option value="">全部子系统</option>${state.subsystems.map(s => `<option value="${s.id}" ${ui.filter.subsystem === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
      <select id="kbMem"><option value="">全部人</option>${state.members.map(m => `<option value="${m.id}" ${ui.filter.member === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
      <button class="btn ghost sm" id="kbClear">清除</button>
      <span class="sp"></span>
      <span class="s" style="color:var(--tx3)">${list.length} 个任务</span>
    </div>
    <div class="kan">
      ${cols.map(s => {
        const ts = list.filter(t => t.statusId === s.id)
          .sort((a, b) => (prioOrder(b) - prioOrder(a)) || String(a.due || '9').localeCompare(String(b.due || '9')));
        return `<div class="kcol" data-col="${s.id}">
          <div class="kcol-h">
            <span class="stsym" style="background:${statusTint(s)}">${statusGlyph(s)}</span>
            <span>${esc(s.name)}</span><span class="n">${ts.length}</span>
          </div>
          ${ts.map(card).join('')}
        </div>`;
      }).join('')}
    </div>`;

  v.onclick = e => {
    if (e.target.closest('#kbClear')) { ui.filter = { q: '', subsystem: '', member: '', status: '', role: '', onlyMineOpen: false }; renderAll(); return; }
    if (window._kanDragged) return;   // 刚拖拽过，这次 click 不算点击
    const c = e.target.closest('[data-pop]');
    if (c) {
      const [kind, id] = c.dataset.pop.split(':');
      clearTimeout(popTimer);
      if (!(popState && popState.kind === kind && popState.id === id && popState.editing)) openPop(c, kind, id, true);
    }
  };
  $('#kbQ').oninput = e => { ui.filter.q = e.target.value; clearTimeout(window._kbT); window._kbT = setTimeout(() => { const pos = e.target.selectionStart; renderStage(); const el = $('#kbQ'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }, 200); };
  $('#kbSub').onchange = e => { ui.filter.subsystem = e.target.value; renderStage(); };
  $('#kbMem').onchange = e => { ui.filter.member = e.target.value; renderStage(); };

  // 拖拽
  let dragId = null;
  $$('.kcard', v).forEach(c => {
    c.addEventListener('dragstart', ev => {
      if (!canEditTask(state.tasks.find(x => x.id === c.dataset.task))) return;
      dragId = c.dataset.task;
      window._kanDragged = true;             // 标记：拖过就不当点击处理
      c.classList.add('dragging');
      suppressHover = true;
      closePop(true);
      ev.dataTransfer?.setData('text/plain', dragId);
    });
    c.addEventListener('dragend', () => {
      c.classList.remove('dragging');
      dragId = null;
      setTimeout(() => { window._kanDragged = false; suppressHover = false; }, 60);
    });
  });
  $$('.kcol', v).forEach(col => {
    col.addEventListener('dragover', ev => { ev.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop'));
    col.addEventListener('drop', ev => {
      ev.preventDefault(); col.classList.remove('drop');
      if (!dragId) return;
      const t = state.tasks.find(x => x.id === dragId);
      if (!t || t.statusId === col.dataset.col) return;
      const st = byId(state.statuses, col.dataset.col);
      if (!st.isDone && !t.expedite && (st.id === 'st_doing' || /进行|doing/i.test(st.name)) && dorBlock(t)) { renderStage(); return; }
      t.statusId = st.id;
      if (st.isDone) (t.checkpoints || []).forEach(c => { c.done = true; });
      logActivity('task', `「${t.title}」→ ${st.name}`);
      commit();
    });
  });
}

/* =========================================================================
 *  视图 3 · 全员负荷（热力）
 * ========================================================================= */
function heatCell(avail, mid, d, t0, cellCol, zoom) {
  const r = avail.get(mid)?.get(d);
  const cls = 'cell' + (d === t0 ? ' today' : '');
  const free = r ? (r.free ?? 1) : 1;
  const txt = r && r.hard > .5 ? '考' : (zoom === 'week' && free < .995 ? Math.round(free * 100) : '');
  return `<td class="${cls}" data-m="${mid}" data-d="${d}" style="background:${cellCol(r)}">${txt}</td>`;
}
function heatTable(avail, list, t0, cellCol, zoom = 'custom') {
  if (!state.members.length) return `<div class="empty">还没有成员</div>`;
  const headCells = list.map(d => {
    const col = d === t0 ? 'var(--acc)' : 'var(--tx3)';
    return '<th style="color:' + col + '">' + parseYmd(d).getDate() + '</th>';
  }).join('');
  const rows = state.members.map(m => {
    const cells = list.map(d => heatCell(avail, m.id, d, t0, cellCol, zoom)).join('');
    return '<tr><th class="n"><div class="thn"><span class="hd" style="background:' + m.color + '"></span><span>' + esc(m.name) + '</span></div></th>' + cells + '</tr>';
  }).join('');
  const stageW = document.querySelector('#stageBody')?.clientWidth || 900;
  const n0 = Math.max(1, list.length);
  const nw = zoom === 'week' ? 168 : 92;
  const cap = zoom === 'week' ? 300 : zoom === 'month' ? 90 : 72;
  const gap = zoom === 'week' ? 3 : 1;
  const hc = Math.max(13, Math.min(cap, Math.floor((stageW - 64 - nw - gap * (n0 + 1)) / n0)));
  return '<table class="hm heat-' + zoom + '" style="--hc:' + hc + 'px"><thead><tr><th class="n">成员</th>' + headCells + '</tr></thead><tbody>' + rows + '</tbody></table>';
}
/* =========================================================================
 *  人员与任务管理（批量）
 * ========================================================================= */
function mgUI() {
  if (!ui.manage) ui.manage = { tab: 'members', mem: [], task: [], q: '', fMember: '', fSub: '', fStatus: '', assign: false, focus: '' };
  const M = ui.manage;
  if (!Array.isArray(M.mem)) M.mem = [];
  if (!Array.isArray(M.task)) M.task = [];
  return M;
}

function mgFilteredMembers() {
  const q = mgUI().q.trim().toLowerCase();
  if (!q) return state.members;
  return state.members.filter(m => (m.name + ' ' + (m.roles || []).map(r => byId(state.roles, r)?.name || '').join(' ')).toLowerCase().includes(q));
}

function mgFilteredTasks() {
  const M = mgUI();
  const q = M.q.trim().toLowerCase();
  return state.tasks.filter(t => {
    if (q && !(t.title + ' ' + (t.description || '')).toLowerCase().includes(q)) return false;
    if (M.fMember && !(t.ownerIds || []).includes(M.fMember)) return false;
    if (M.fSub && t.subsystemId !== M.fSub) return false;
    if (M.fStatus && t.statusId !== M.fStatus) return false;
    return true;
  });
}

function mgOpts(arr, val, blank) {
  return (blank ? `<option value="">${blank}</option>` : '') + arr.map(x => `<option value="${x.id}" ${x.id === val ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
}

function renderManage(v) {
  const M = mgUI();
  const isMem = M.tab === 'members';
  const list = isMem ? mgFilteredMembers() : mgFilteredTasks();
  const selIds = isMem ? M.mem : M.task;
  const sel = new Set(selIds);
  const selN = list.filter(x => sel.has(x.id)).length;
  const allSel = list.length > 0 && selN === list.length;

  const memRows = mgFilteredMembers().map(m => {
    const mine = state.tasks.filter(t => (t.ownerIds || []).includes(m.id));
const open = mine.filter(t => !statusOf(t).isDone).length;
    const doing = mine.filter(t => taskIsDoing(t)).length;
    const wip = Number(state.settings.wipLimit) || 3;
    const overWip = doing > wip;
    const roles = (m.roles || []).map(r => byId(state.roles, r)?.name).filter(Boolean).join(' · ');
    const subs = (m.subsystems || []).map(s => byId(state.subsystems, s)?.name).filter(Boolean).join(' · ');
    return `<div class="mg-row ${sel.has(m.id) ? 'on' : ''}" data-mg-mem="${m.id}">
      <input type="checkbox" ${sel.has(m.id) ? 'checked' : ''} tabindex="-1">
      <span class="mg-dot" style="background:${esc(m.color || 'var(--tx3)')}"></span>
      <div class="nm">${esc(m.name)}<div class="sub">${esc(roles || '未设角色')}${subs ? ' · ' + esc(subs) : ''}</div></div>
<button class="mg-link ${overWip ? 'warn' : ''}" data-mg-memtasks="${m.id}" title="在「任务」里只看这个人的任务">${mine.length} 个任务${open ? ' · 进行中 ' + open : ''}${overWip ? ` · 超出并行上限` : ''}</button>
      <button class="btn sm ghost" data-mg-openm="${m.id}" title="编辑成员">编辑</button>
    </div>`;
  }).join('');

  const taskRows = mgFilteredTasks().map(t => {
    const st = statusOf(t);
    const owners = (t.ownerIds || []).map(id => member(id)?.name).filter(Boolean);
    return `<div class="mg-row ${sel.has(t.id) ? 'on' : ''}" data-mg-task="${t.id}">
      <input type="checkbox" ${sel.has(t.id) ? 'checked' : ''} tabindex="-1">
      <span class="dotc" style="background:${statusTint(st)};flex:none"></span>
      <div class="nm">${esc(t.title)}
        <div class="sub">${esc(subsystem(t.subsystemId)?.name || '未分类')} · ${esc(owners.join(' / ') || '未指派')} · ${t.start ? fmtMD(t.start) : '?'} – ${t.due ? fmtMD(t.due) : '?'}</div>
      </div>
      <span class="pill" style="color:${statusTint(st)}">${esc(st.name)}</span>
      <button class="btn sm ghost" data-mg-opent="${t.id}" title="编辑任务">编辑</button>
    </div>`;
  }).join('');

  const ms = state.members.filter(m => M.mem.includes(m.id));
  const ts = state.tasks.filter(t => M.task.includes(t.id));

  const roleChips = state.roles.map(r => {
    const all = ms.length && ms.every(m => (m.roles || []).includes(r.id));
    const some = ms.some(m => (m.roles || []).includes(r.id));
    return `<button class="mg-chip ${all ? 'on' : some ? 'part' : ''}" data-mg-role="${r.id}">${esc(r.name)}</button>`;
  }).join('');
  const subChips = state.subsystems.map(s => {
    const all = ms.length && ms.every(m => (m.subsystems || []).includes(s.id));
    const some = ms.some(m => (m.subsystems || []).includes(s.id));
    return `<button class="mg-chip ${all ? 'on' : some ? 'part' : ''}" data-mg-subchip="${s.id}">${esc(s.name)}</button>`;
  }).join('');
  const ownerChips = state.members.map(m => {
    const all = ts.length && ts.every(t => (t.ownerIds || []).includes(m.id));
    const some = ts.some(t => (t.ownerIds || []).includes(m.id));
    return `<button class="mg-chip ${all ? 'on' : some ? 'part' : ''}" data-mg-owner="${m.id}">${esc(m.name)}</button>`;
  }).join('');

  const memPanel = ms.length ? `
    <h4>批量设置 · ${ms.length} 人</h4>
    <div class="mg-note">点角色 / 子系统标签，直接给所选的人统一加上或去掉；半亮表示只有部分人有。</div>
    <div><div class="mg-note" style="margin-bottom:4px">角色</div><div class="mg-chips">${roleChips}</div></div>
    <div><div class="mg-note" style="margin-bottom:4px">负责子系统</div><div class="mg-chips">${subChips}</div></div>
    <div class="mg-fields">
      <div class="field"><label>复习天数</label><input id="mgPrep" type="number" min="0" max="60" placeholder="不改"></div>
      <div class="field"><label>复习强度 %</label><input id="mgInt" type="number" min="0" max="100" placeholder="不改"></div>
      <div class="field"><label>周末</label><select id="mgWk"><option value="">不改</option><option value="ok">可以干活</option><option value="half">只有半天</option><option value="no">完全不干</option></select></div>
      <div class="field"><label>头像颜色</label><input id="mgColor" type="color" value="${esc(ms[0].color || '#14b8a6')}"></div>
    </div>
<label class="mg-note" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="mgUseColor"> 同时改头像颜色</label>
    <button class="btn primary sm" id="mgApplyMem">应用节奏设置</button>
    <hr class="mg-hr">
    <div class="mg-wip">
      <div class="mg-note" style="margin:0">每人并行上限（WIP）</div>
      <input id="mgWip" type="number" min="1" max="12" value="${Number(state.settings.wipLimit) || 3}" style="width:64px">
      <span class="s" style="color:var(--tx3)">超过就提示收口，不硬拦</span>
    </div>
    <hr class="mg-hr">
    <button class="btn sm" id="mgAssignToggle">${M.assign ? '收起布置任务' : '+ 给所选成员布置任务'}</button>
    ${M.assign ? `
      <div class="mg-fields" style="margin-top:8px">
        <div class="field full"><label>任务标题</label><input id="mgTitle" placeholder="例如：底盘装配复检"></div>
        <div class="field"><label>子系统</label><select id="mgSub">${mgOpts(state.subsystems, ms[0].subsystems?.[0] || state.subsystems[0]?.id)}</select></div>
        <div class="field"><label>优先级</label><select id="mgPri">${mgOpts(state.priorities, state.priorities[1]?.id || state.priorities[0]?.id)}</select></div>
        <div class="field"><label>开始</label><input id="mgStart" type="date" value="${today()}"></div>
        <div class="field"><label>截止</label><input id="mgDue" type="date" value="${addDays(today(), 7)}"></div>
        <div class="field full"><label>检查点（每行一个，可选）</label><textarea id="mgCps" rows="2" placeholder="方案确认&#10;到货验收"></textarea></div>
      </div>
      <div class="mg-chips" style="align-items:center">
        <label class="mg-note"><input type="radio" name="mgMode" value="one" checked> 共用一条任务</label>
        <label class="mg-note"><input type="radio" name="mgMode" value="each"> 每人各一条</label>
      </div>
      <button class="btn primary sm" id="mgCreate" ${M.assign ? '' : 'disabled'}>创建并指派</button>` : ''}
  ` : `<div class="mg-empty">先在左边勾选成员，再批量设置或布置任务</div>`;

  const taskPanel = ts.length ? `
    <h4>批量调整 · ${ts.length} 个任务</h4>
    <div><div class="mg-note" style="margin-bottom:4px">负责人（点一下：全部加入 / 全部移除）</div><div class="mg-chips">${ownerChips}</div></div>
    <div class="mg-fields">
      <div class="field"><label>状态</label><select id="mgSt">${mgOpts(state.statuses, '', '不改')}</select></div>
      <div class="field"><label>优先级</label><select id="mgPri2">${mgOpts(state.priorities, '', '不改')}</select></div>
      <div class="field full"><label>子系统</label><select id="mgSub2">${mgOpts(state.subsystems, '', '不改')}</select></div>
    </div>
    <button class="btn sm primary" id="mgApplyTask">应用状态 / 优先级 / 子系统</button>
    <hr class="mg-hr">
    <div class="mg-fields">
      <div class="field"><label>平移天数</label><input id="mgShiftN" type="number" value="7" min="1" max="60"></div>
      <div class="field" style="justify-content:flex-end"><div class="mg-chips"><button class="btn sm" data-mg-shift="-1">提前</button><button class="btn sm" data-mg-shift="1">推迟</button></div></div>
    </div>
    <div class="mg-fields">
      <div class="field"><label>开始</label><input id="mgTStart" type="date"></div>
      <div class="field"><label>截止</label><input id="mgTDue" type="date"></div>
    </div>
    <button class="btn sm" id="mgSetDates">写入所选任务的起止日期</button>
    <div class="mg-note">小提示：在「任务」标签里按成员或子系统筛选，可以只调某个人手上的一批任务。</div>
  ` : `<div class="mg-empty">先在左边勾选任务，再批量调整负责人、状态或日期</div>`;

  const filters = isMem ? '' : `
    <select id="mgFMember" style="width:126px">${mgOpts(state.members, M.fMember, '全部成员')}</select>
    <select id="mgFSub" style="width:126px">${mgOpts(state.subsystems, M.fSub, '全部子系统')}</select>
    <select id="mgFStatus" style="width:110px">${mgOpts(state.statuses, M.fStatus, '全部状态')}</select>`;

  v.innerHTML = `
  <div class="mg">
    <div class="mg-top">
      <div class="seg"><button data-mg-tab="members" class="${isMem ? 'on' : ''}">成员</button><button data-mg-tab="tasks" class="${isMem ? '' : 'on'}">任务</button></div>
      <input id="mgQ" type="search" placeholder="${isMem ? '搜索姓名 / 角色' : '搜索任务标题'}" value="${esc(M.q)}" style="width:200px">
      ${filters}
      <span class="sp"></span>
      <span class="mg-note">已选 <b style="color:var(--tx)">${selN}</b> / ${list.length}</span>
      <button class="btn sm ghost" id="mgAll">${allSel ? '取消全选' : '全选当前'}</button>
      <button class="btn sm ghost" id="mgClear" ${selN ? '' : 'disabled'}>清空</button>
    </div>
    <div class="mg-list">${isMem ? (memRows || '<div class="mg-empty">没有匹配的成员</div>') : (taskRows || '<div class="mg-empty">没有匹配的任务</div>')}</div>
    <aside class="mg-panel">${isMem ? memPanel : taskPanel}</aside>
  </div>`;

  // —— 基础交互 ——
  v.querySelectorAll('[data-mg-tab]').forEach(b => b.onclick = () => {
    M.tab = b.dataset.mgTab; M.q = ''; M.assign = false; renderStage();
  });
  const q = v.querySelector('#mgQ');
  q.oninput = e => {
    M.q = e.target.value;
    const pos = e.target.selectionStart;
    renderStage();
    const el = document.querySelector('#mgQ');
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) { } }
  };
  const fm = v.querySelector('#mgFMember'); if (fm) fm.onchange = e => { M.fMember = e.target.value; renderStage(); };
  const fs = v.querySelector('#mgFSub'); if (fs) fs.onchange = e => { M.fSub = e.target.value; renderStage(); };
  const ft = v.querySelector('#mgFStatus'); if (ft) ft.onchange = e => { M.fStatus = e.target.value; renderStage(); };

  v.querySelector('#mgAll').onclick = () => {
    const ids = list.map(x => x.id);
    if (allSel) { if (isMem) M.mem = M.mem.filter(id => !ids.includes(id)); else M.task = M.task.filter(id => !ids.includes(id)); }
    else { if (isMem) M.mem = [...new Set([...M.mem, ...ids])]; else M.task = [...new Set([...M.task, ...ids])]; }
    renderStage();
  };
  v.querySelector('#mgClear').onclick = () => { if (isMem) M.mem = []; else M.task = []; renderStage(); };

  v.querySelectorAll('[data-mg-mem]').forEach(r => r.onclick = e => {
    if (e.target.closest('[data-mg-openm]')) return;
    const id = r.dataset.mgMem;
    M.mem = M.mem.includes(id) ? M.mem.filter(x => x !== id) : [...M.mem, id];
    renderStage();
  });
  v.querySelectorAll('[data-mg-task]').forEach(r => r.onclick = e => {
    if (e.target.closest('[data-mg-opent]')) return;
    const id = r.dataset.mgTask;
    M.task = M.task.includes(id) ? M.task.filter(x => x !== id) : [...M.task, id];
    renderStage();
  });
  v.querySelectorAll('[data-mg-openm]').forEach(b => b.onclick = e => { e.stopPropagation(); openMemberModal(b.dataset.mgOpenm); });
  v.querySelectorAll('[data-mg-memtasks]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    M.tab = 'tasks'; M.q = ''; M.fMember = b.dataset.mgMemtasks; M.fSub = ''; M.fStatus = ''; M.task = []; renderStage();
  });
  v.querySelectorAll('[data-mg-opent]').forEach(b => b.onclick = e => { e.stopPropagation(); openTaskModal(b.dataset.mgOpent); });

  // —— 成员批量 ——
  // 角色 / 子系统：点一下直接对所选成员统一增删
  v.querySelectorAll('[data-mg-role]').forEach(b => b.onclick = () => {
    const rid = b.dataset.mgRole;
    const all = ms.every(m => (m.roles || []).includes(rid));
    for (const m of ms) {
      m.roles = m.roles || [];
      if (all) m.roles = m.roles.filter(x => x !== rid);
      else if (!m.roles.includes(rid)) m.roles.push(rid);
    }
    logActivity('member', `批量${all ? '移除' : '添加'}角色「${byId(state.roles, rid)?.name}」· ${ms.length} 人`);
    commit(); toast(all ? '已移除角色' : '已添加角色'); renderStage();
  });
  v.querySelectorAll('[data-mg-subchip]').forEach(b => b.onclick = () => {
    const sid = b.dataset.mgSubchip;
    const all = ms.every(m => (m.subsystems || []).includes(sid));
    for (const m of ms) {
      m.subsystems = m.subsystems || [];
      if (all) m.subsystems = m.subsystems.filter(x => x !== sid);
      else if (!m.subsystems.includes(sid)) m.subsystems.push(sid);
    }
    logActivity('member', `批量${all ? '移除' : '添加'}子系统「${byId(state.subsystems, sid)?.name}」· ${ms.length} 人`);
    commit(); toast(all ? '已移除子系统' : '已添加子系统'); renderStage();
  });

  const applyMem = v.querySelector('#mgApplyMem');
  if (applyMem) applyMem.onclick = () => {
    const prep = v.querySelector('#mgPrep').value.trim();
    const inten = v.querySelector('#mgInt').value.trim();
    const wk = v.querySelector('#mgWk').value;
    const useColor = v.querySelector('#mgUseColor').checked;
    const color = v.querySelector('#mgColor').value;
    for (const m of ms) {
      m.pacing = m.pacing || {};
      if (prep !== '') m.pacing.prepDays = clamp(Number(prep) || 0, 0, 60);
      if (inten !== '') m.pacing.prepIntensity = clamp((Number(inten) || 0) / 100, 0, 1);
      if (wk) m.pacing.weekendPreference = wk;
      if (useColor) m.color = color;
    }
    logActivity('member', `批量设置节奏 ${ms.length} 人：${ms.map(m => m.name).join('、')}`);
    commit(); toast(`已更新 ${ms.length} 名成员的节奏`); renderStage();
  };

const wipIn = v.querySelector('#mgWip');
  if (wipIn) wipIn.onchange = () => {
    state.settings.wipLimit = clamp(Number(wipIn.value) || 3, 1, 12);
    logActivity('setting', `每人并行上限改为 ${state.settings.wipLimit}`);
    commit(); renderStage(); renderPulse();
    toast(`并行上限 ${state.settings.wipLimit} 项`);
  };

  const assignToggle = v.querySelector('#mgAssignToggle');
  if (assignToggle) assignToggle.onclick = () => { M.assign = !M.assign; renderStage(); };

  const create = v.querySelector('#mgCreate');
  if (create) create.onclick = () => {
    const title = v.querySelector('#mgTitle').value.trim();
    if (!title) return toast('请填写任务标题', true);
    const sub = v.querySelector('#mgSub').value;
    const pri = v.querySelector('#mgPri').value;
    const start = v.querySelector('#mgStart').value || today();
    const due = v.querySelector('#mgDue').value || addDays(start, 7);
    const mode = v.querySelector('input[name="mgMode"]:checked')?.value || 'one';
    const cps = v.querySelector('#mgCps').value.split('\n').map(s => s.trim()).filter(Boolean)
      .map(s => ({ id: uid('cp'), text: s, done: false, weight: 1 }));
    const base = { title, subsystemId: sub, priorityId: pri, start, due, checkpoints: cps, estimateHours: 0, tags: [], description: '', logs: [], helperIds: [] };
    const st = state.statuses[0]?.id;
    if (mode === 'each') {
      for (const m of ms) state.tasks.push(Object.assign({}, base, { id: uid('t'), statusId: st, ownerIds: [m.id] }));
    } else {
      state.tasks.push(Object.assign({}, base, { id: uid('t'), statusId: st, ownerIds: ms.map(m => m.id) }));
    }
    logActivity('task', `批量布置任务「${title}」给 ${ms.map(m => m.name).join('、')}`);
    commit(); M.assign = false; toast(mode === 'each' ? `已为 ${ms.length} 人各建一条任务` : '已创建共用任务'); renderStage();
  };

  // —— 任务批量 ——
  v.querySelectorAll('[data-mg-owner]').forEach(b => b.onclick = () => {
    const mid = b.dataset.mgOwner;
    const all = ts.every(t => (t.ownerIds || []).includes(mid));
    for (const t of ts) {
      t.ownerIds = t.ownerIds || [];
      if (all) t.ownerIds = t.ownerIds.filter(x => x !== mid);
      else if (!t.ownerIds.includes(mid)) t.ownerIds.push(mid);
    }
    logActivity('task', `批量${all ? '移除' : '加入'}负责人「${member(mid)?.name}」· ${ts.length} 个任务`);
    commit(); toast(`${all ? '已移除' : '已加入'} ${member(mid)?.name}`); renderStage();
  });
  const applyTask = v.querySelector('#mgApplyTask');
  if (applyTask) applyTask.onclick = () => {
    const st = v.querySelector('#mgSt').value;
    const pri = v.querySelector('#mgPri2').value;
    const sub = v.querySelector('#mgSub2').value;
    if (!st && !pri && !sub) return toast('先选要改的字段', true);
    const stName = (state.statuses.find(x => x.id === st) || {}).name;
    const priName = (state.priorities.find(x => x.id === pri) || {}).name;
    const subName2 = (state.subsystems.find(x => x.id === sub) || {}).name;
    const lines = [];
    for (const t of ts) {
      const bits = [];
      if (st && t.statusId !== st) bits.push(`状态 ${statusOf(t).name} → ${stName}`);
      if (pri && t.priorityId !== pri) bits.push(`优先级 ${priName}`);
      if (sub && t.subsystemId !== sub) bits.push(`子系统 ${subName(t.subsystemId)} → ${subName2}`);
      if (bits.length) lines.push(`「${t.title}」${bits.join('，')}`);
    }
    if (!lines.length) return toast('这些任务已经是目标值，不用改');
    confirmApply('批量调整任务', lines, () => {
      for (const t of ts) {
        if (st) t.statusId = st;
        if (pri) t.priorityId = pri;
        if (sub) t.subsystemId = sub;
        if (st && statusOf(t).isDone) (t.checkpoints || []).forEach(c => c.done = true);
      }
      logActivity('task', `批量调整 ${ts.length} 个任务的状态 / 优先级 / 子系统`);
      commit(); toast(`已更新 ${lines.length} 个任务`); renderStage();
    });
  };
  v.querySelectorAll('[data-mg-shift]').forEach(b => b.onclick = () => {
    const n = clamp(Number(v.querySelector('#mgShiftN').value) || 0, 1, 60) * Number(b.dataset.mgShift);
    if (!n) return;
    const lines = ts.map(t => `「${t.title}」${t.start ? fmtMD(t.start) : '—'} → ${t.start ? fmtMD(addDays(t.start, n)) : '—'}${t.due ? `（截止 ${t.due} → ${addDays(t.due, n)}）` : ''}`);
    confirmApply(`整体${n > 0 ? '推迟' : '提前'} ${Math.abs(n)} 天`, lines, () => {
      for (const t of ts) {
        if (t.start) t.start = addDays(t.start, n);
        if (t.due) t.due = addDays(t.due, n);
      }
      logActivity('task', `${ts.length} 个任务整体${n > 0 ? '推迟' : '提前'} ${Math.abs(n)} 天`);
      commit(); toast(`已${n > 0 ? '推迟' : '提前'} ${Math.abs(n)} 天`); renderStage();
    });
  });
  const setDates = v.querySelector('#mgSetDates');
  if (setDates) setDates.onclick = () => {
    const s = v.querySelector('#mgTStart').value;
    const d = v.querySelector('#mgTDue').value;
    if (!s && !d) return toast('先填开始或截止日期', true);
    if (s && d && d < s) return toast('截止不能早于开始', true);
    const lines = ts.map(t => `「${t.title}」${s ? `开始 ${t.start || '—'} → ${s}` : ''}${s && d ? '，' : ''}${d ? `截止 ${t.due || '—'} → ${d}` : ''}`);
    confirmApply('批量设置起止日期', lines, () => {
      for (const t of ts) { if (s) t.start = s; if (d) t.due = d; }
      logActivity('task', `批量设置 ${ts.length} 个任务的起止日期`);
      commit(); toast('日期已更新'); renderStage();
    });
  };
}

function confirmApply(title, lines, onOk) {
  const body = `<div class="mnote">将影响 ${lines.length} 项：</div><div class="mlist">${lines.map(l => `<div class="mli">${esc(l)}</div>`).join("")}</div>`;
  modal(title, body, '<button class="btn" data-close>取消</button><button class="btn primary" id="caOk">确认执行</button>', (m, closeFn) => {
    m.querySelector("#caOk").onclick = () => { closeFn(); onOk(); };
  });
}
function renderHeat(v) {
  const base = laneRange();
  const zoom = base.zoom;
  const shift = Number(ui.heatShift) || 0;
  const start = addDays(base.start, shift);
  const days = base.days;
  const list = Array.from({ length: days }, (_, i) => addDays(start, i));
  const avail = buildAvailability(start, list[list.length - 1]);
  const t0 = today();
  const cellCol = r => {
    if (!r) return 'var(--heat-0)';
    if (r.hard > .5) return 'var(--heat-5)';
    const b = r.busy;
    if (b <= .02) return 'var(--heat-1)';
    if (b < .35) return 'var(--heat-2)';
    if (b < .6) return 'var(--heat-3)';
    if (b < .9) return 'var(--heat-4)';
    return 'var(--heat-5)';
  };

  const spanTxt = `${fmtMD(start)} – ${fmtMD(list[days - 1])}`;
  v.innerHTML = `
    <div class="fbar">
      <div class="seg zoomseg">${[['week', '周'], ['month', '月'], ['custom', '自定义']].map(([k, nm]) => `<button data-heat-zoom="${k}" class="${zoom === k ? 'on' : ''}">${nm}</button>`).join('')}</div>

function taskSetPct(list) {
  if (!list.length) return { n: 0, done: 0, pct: 0 };
  const done = list.filter(t => taskIsDone(t)).length;
  const pct = Math.round(list.reduce((a, t) => a + taskPct(t), 0) / list.length);
  return { n: list.length, done, pct };
}
function alignRate() {
  const live = state.tasks.filter(t => !taskIsDone(t));
  if (!live.length) return 100;
  return Math.round(live.filter(t => t.goalId).length / live.length * 100);
}
function goalTasks(g) { return state.tasks.filter(t => t.goalId === g.id); }
function krTasks(g, k) { return state.tasks.filter(t => t.goalId === g.id && t.krId === k.id); }

/* =========================================================================
 *  视图 · 进度掌控（燃尽 / 缓冲 / 停滞 / 承诺）
 * ========================================================================= */
function weightedPct(ts) {
  if (!ts.length) return 0;
  let a = 0, w = 0;
  for (const t of ts) {
    const n = Math.max(1, (t.checkpoints || []).length);
    a += taskPct(t) * n; w += n;
  }
  return Math.round(a / w);
}
function scopePct() { return weightedPct(state.tasks); }
function projectSpan() {
  const ts = state.tasks.filter(t => t.start && t.due);
  const start = ts.length ? ts.map(t => t.start).sort()[0] : today();
  const lastDue = ts.length ? ts.map(t => t.due).sort().slice(-1)[0] : addDays(start, 30);
  const target = state.settings.targetDate || lastDue;
  return { start, lastDue, target };
}
function actualSeries() {
  const W = state.weekly || { weeks: [] };
  const pts = [];
  for (const w of (W.weeks || [])) {
    if (w.archive && typeof w.archive.avgTo === 'number') pts.push({ date: w.end, pct: w.archive.avgTo });
  }
  pts.sort((a, b) => (a.date < b.date ? -1 : 1));
  const sp = projectSpan();
  if (!pts.length || pts[0].date > sp.start) pts.unshift({ date: sp.start, pct: 0 });
  pts.push({ date: today(), pct: scopePct(), now: true });
  return pts;
}
function forecast() {
  const pts = actualSeries().slice(-4);
  let perDay = 0;
  if (pts.length >= 2) {
    const a = pts[0], b = pts[pts.length - 1];
    const dx = Math.max(1, diffDays(a.date, b.date));
    perDay = (b.pct - a.pct) / dx;
  }
  if (perDay <= 0) {
    // 没有周数据时的兜底：用“开工至今的平均速度”
    const sp = projectSpan();
    const days = Math.max(1, diffDays(sp.start, today()));
    perDay = scopePct() / days;
  }
  if (perDay <= 0) return { date: null, perDay: 0 };
  const done = scopePct();
  const need = Math.max(0, 100 - done) / perDay;
  return { date: addDays(today(), Math.ceil(need)), perDay };
}
function bufferInfo() {
  const { start, target } = projectSpan();
  const bufDays = Math.max(1, Number(state.settings.bufferDays) || 5);
  const done = scopePct();
  const f = forecast();
  const plannedFinish = addDays(target, -bufDays);
  const fc = f.date || plannedFinish;
  const left = Math.min(bufDays, diffDays(fc, target));
  const used = clamp(1 - left / bufDays, 0, 1.25);
  return { start, target, bufDays, done, finish: f.date, plannedFinish, left, used };
}
function burnSvg() {
  const { start, target } = projectSpan();
  const pts = actualSeries();
  const f = forecast();
  const x0 = weekStartOf(start);
  const end = f.date && f.date > target ? f.date : target;
  const x1 = addDays(end, 7);
  const total = Math.max(1, diffDays(x0, x1));
  const W = 660, H = 208, L = 30, R = 10, T = 10, B = 24;
  const X = d => L + diffDays(x0, d) / total * (W - L - R);
  const Y = p => T + (1 - p / 100) * (H - T - B);
  const grid = [0, 25, 50, 75, 100].map(p =>
    `<line x1="${L}" x2="${W - R}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)" stroke-width="1"/>
     <text x="${L - 6}" y="${Y(p) + 3}" text-anchor="end" font-size="9" fill="var(--tx3)">${p}</text>`).join('');
  const planned = `<polyline points="${X(start)},${Y(0)} ${X(target)},${Y(100)}" fill="none" stroke="var(--tx3)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  const actual = pts.length > 1
    ? `<polyline points="${pts.map(p => `${X(p.date)},${Y(p.pct)}`).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2"/>`
    : '';
  const dot = `<circle cx="${X(pts[pts.length - 1].date)}" cy="${Y(pts[pts.length - 1].pct)}" r="3.5" fill="var(--acc)"/>`;
  const fc = f.date
    ? `<line x1="${X(pts[pts.length - 1].date)}" y1="${Y(pts[pts.length - 1].pct)}" x2="${X(f.date)}" y2="${Y(100)}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="3 4"/>`
    : '';
  const todayLine = `<line x1="${X(today())}" x2="${X(today())}" y1="${T}" y2="${H - B}" stroke="var(--acc-line)" stroke-width="1"/>`;
  const labels = `<text x="${X(start)}" y="${H - 6}" font-size="9" fill="var(--tx3)">${start.slice(5)}</text>

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="ctl-svg" aria-label="燃尽图">
    ${grid}${planned}${fc}${actual}${dot}${todayLine}${labels}</svg>`;
}
function feverSvg(done, used) {
  const W = 150, H = 122, L = 22, T = 8, R = 6, B = 18;
  const X = p => L + p / 100 * (W - L - R);
  const Y = p => T + p / 100 * (H - T - B);
  const x = clamp(done, 0, 100), y = clamp(used * 100, 0, 110);
  return `<svg viewBox="0 0 ${W} ${H}" class="ctl-fever">
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="rgba(255,92,92,.10)"/>
    <polygon points="${X(0)},${Y(0)} ${X(100)},${Y(0)} ${X(100)},${Y(100)} ${X(70)},${Y(100)} ${X(0)},${Y(30)}" fill="rgba(224,163,58,.13)"/>
    <polygon points="${X(0)},${Y(0)} ${X(100)},${Y(0)} ${X(100)},${Y(100)}" fill="rgba(52,199,123,.16)"/>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(100)}" y2="${Y(100)}" stroke="var(--line2)" stroke-width="1"/>
    <line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="var(--line)"/>
    <line x1="${L}" y1="${T}" x2="${L}" y2="${H - B}" stroke="var(--line)"/>
    <circle cx="${X(x)}" cy="${Y(y)}" r="4" fill="var(--acc)"/>
    <text x="${L - 4}" y="${T + 7}" text-anchor="end" font-size="8" fill="var(--tx3)">100</text>
    <text x="${L - 4}" y="${H - B + 3}" text-anchor="end" font-size="8" fill="var(--tx3)">0</text>
    <text x="${W - R}" y="${H - 5}" text-anchor="end" font-size="8" fill="var(--tx3)">完成 100%</text>
    <text x="${L + 4}" y="${H - 5}" font-size="8" fill="var(--tx3)">缓冲消耗 →</text>
  </svg>`;
}
function memberLoad(m, from, to, avail) {
  const ts = state.tasks.filter(t => (t.ownerIds || []).includes(m.id) && t.start && t.due && t.start <= to && t.due >= from && !taskIsDone(t));
  let rest = 0;
  for (const t of ts) rest += (t.checkpoints || []).filter(c => !c.done).length;
  let days = 0;
  for (let d = from; d <= to; d = addDays(d, 1)) {
    const r = avail.get(m.id)?.get(d);
    if (!r || r.free >= .5) days++;
  }
  const per = rest / Math.max(1, days);
  return { n: ts.length, rest, days, per };
}

function controlSummary() {
  const sp = projectSpan();
  const done = scopePct();
  const spanDays = Math.max(1, diffDays(sp.start, sp.target));
  const planned = Math.round(clamp(diffDays(sp.start, today()) / spanDays, 0, 1) * 100);
  const b = bufferInfo();
  return { done, planned, b, span: sp };
}

 *  视图 5 · 指挥台（总览 / 数据 / 设置）

function auditIssues() {
  const out = [];
  for (const t of state.tasks) {
    const cps = t.checkpoints || [];
    const names = cps.map(c => String(c.text || '').trim()).filter(Boolean);
    const dup = [...new Set(names.filter((n, i) => names.indexOf(n) !== i))];
    if (dup.length) out.push({ level: 'warn', task: t, text: `检查点重名：${dup.join('、')}` });
    if (t.start && t.due && t.due < t.start) out.push({ level: 'err', task: t, text: `截止早于开始（${fmtMD(t.start)} → ${fmtMD(t.due)}）` });
    const st = statusOf(t);
    if (cps.length && cps.every(c => c.done) && !st.isDone) out.push({ level: 'warn', task: t, text: '检查点已全部完成，状态还没改成完成' });
    if (!st.isDone && !(t.ownerIds || []).length) out.push({ level: 'warn', task: t, text: '未完成但没有负责人' });
    if (!cps.length && !st.isDone) out.push({ level: 'info', task: t, text: '没有检查点，进度无法按检查点折算' });
  }
  return out;
}

          <button class="iconbtn" data-gate-del="${g.id}" title="删除阶段门">×</button>
        </div>
        <div>${(g.criteria || []).map(c => `<div class="eng-line">
          <input type="checkbox" data-crit="${g.id}:${c.id}" ${c.done ? 'checked' : ''}>
          <span class="${c.done ? 'done' : ''}" style="flex:1">${esc(c.text)}</span>
          <button class="iconbtn" data-crit-del="${g.id}:${c.id}">×</button>
        </div>`).join('') || '<div class="s" style="color:var(--tx3)">还没有准入条件</div>'}</div>
        <div class="eng-add"><input placeholder="加一条准入条件，例如：结构干涉检查通过" data-crit-new="${g.id}"><button class="btn sm ghost" data-crit-add="${g.id}">+</button></div>
      </div>`;
    }).join('') || '<div class="s" style="color:var(--tx3)">还没有阶段门</div>'}</div>`;

  v.onchange = e => {
    const el = e.target;
    if (el.dataset.gateName) { const g = byId(state.gates, el.dataset.gateName); if (g) { g.name = el.value.trim() || '未命名阶段'; save(); } }
    if (el.dataset.gateDue) { const g = byId(state.gates, el.dataset.gateDue); if (g) { g.due = el.value; save(); applyRightRail(); } }
    if (el.dataset.crit) {
      const [gid, cid] = el.dataset.crit.split(':');
      const g = byId(state.gates, gid); const c = (g?.criteria || []).find(x => x.id === cid);
      if (c) { c.done = el.checked; el.nextElementSibling?.classList.toggle('done', el.checked); save(); logActivity('gate', `「${g.name}」${c.done ? '通过' : '取消'}：${c.text}`); renderStage(); }
    }
  };
  v.onclick = e => {
    if (e.target.closest('#gateAdd')) {
      state.gates.push({ id: uid('g'), name: '新阶段门', due: addDays(today(), 14), criteria: [] });
      commit('已添加阶段门'); renderStage(); return;
    }
    const gd = e.target.closest('[data-gate-del]');
    if (gd) {
      const g = byId(state.gates, gd.dataset.gateDel);
      if (g && confirm(`删除阶段门「${g.name}」？`)) { state.gates = state.gates.filter(x => x.id !== g.id); commit('已删除阶段门'); renderStage(); }
      return;
    }
    const cd = e.target.closest('[data-crit-del]');
    if (cd) {
      const [gid, cid] = cd.dataset.critDel.split(':');
      const g = byId(state.gates, gid);
      if (g) { g.criteria = (g.criteria || []).filter(x => x.id !== cid); commit('已删除准入条件'); renderStage(); }
      return;
    }
    const ca = e.target.closest('[data-crit-add]');
    if (ca) {
      const g = byId(state.gates, ca.dataset.critAdd);
      const inp = v.querySelector(`[data-crit-new="${ca.dataset.critAdd}"]`);
      const txt = (inp?.value || '').trim();
      if (!g || !txt) return;
      g.criteria.push({ id: uid('c'), text: txt, done: false });
      commit('已添加准入条件'); renderStage();
    }
  };
}

/* ---------------- 定义就绪（DoR） ---------------- */
function dorMissing(t) {
  const miss = [];
  if (!(t.ownerIds || []).length) miss.push('负责人');
  if (!t.due) miss.push('截止日');
  if (!(t.checkpoints || []).length) miss.push('检查点');
  return miss;
}
function dorBlock(t) {
  const miss = dorMissing(t);
  if (!miss.length) return false;
  toast(`开工前先补齐：${miss.join('、')}`, true);
  return true;
}

/* ---------------- 站会视图 ---------------- */
function renderStandup(v) {
  const t0 = today();
  const open = state.tasks.filter(t => !statusOf(t).isDone);
  const overdue = open.filter(t => t.due && t.due < t0);
  const todayDue = open.filter(t => t.due === t0);
  const urgent = open.filter(t => t.expedite);
  const blocked = open.filter(t => t.statusAt && diffDays(t.statusAt, t0) >= (Number(state.settings.escalateDays) || 2) && taskIsDoing(t));
  const lateBom = (state.bom || []).filter(bomLate);
  const failRuns = [];
  for (const t of state.tasks) {
    const last = (t.testRuns || [])[0];
    if (last && last.result === '失败') failRuns.push({ t, last });
  }
  const gateSoon = (state.gates || []).filter(g => g.due && !gateDone(g) && diffDays(t0, g.due) <= 7 && diffDays(t0, g.due) >= -30);
  const stops = state.stopDoing || [];

  const memRow = m => {
    const doing = open.filter(t => (t.ownerIds || []).includes(m.id) && taskIsDoing(t));
    const due = open.filter(t => (t.ownerIds || []).includes(m.id) && t.due === t0);
    const late = open.filter(t => (t.ownerIds || []).includes(m.id) && t.due && t.due < t0);
    const ex = state.unavailables.filter(u => (u.participantIds || []).includes(m.id) && u.start <= t0 && t0 <= (u.end || u.start));
    return `<div class="stu-row">
      <span class="mg-dot" style="background:${esc(m.color || 'var(--tx3)')}"></span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600">${esc(m.name)}${ex.length ? ` <span class="pill" style="color:var(--danger)">今天${ex.some(u => u.kind === 'exam') ? '有考试' : '有占用'}</span>` : ''}</div>
        <div class="s" style="color:var(--tx3)">在办 ${doing.length} 项${due.length ? ` · 今天到期 ${due.length}` : ''}${late.length ? ` · 逾期 ${late.length}` : ''}</div>
      </div>
      <div style="display:flex;gap:3px">${doing.slice(0, 4).map(t => `<span class="pill" title="${esc(t.title)}">${esc(t.title.slice(0, 6))}</span>`).join('')}</div>
    </div>`;
  };

  v.innerHTML = `<div class="stu-grid">
    <div class="blk stu-card">
      <h4>今日站会 · ${fmtCn(t0)} 周${weekdayName(t0)}</h4>
      <div class="s" style="color:var(--tx3);margin:4px 0 8px">每人三句：昨天做完什么、今天做什么、卡在哪</div>
      ${state.members.map(memRow).join('') || '<div class="s" style="color:var(--tx3)">还没有成员</div>'}
      <div class="s" style="color:var(--tx3);margin-top:10px">在办 ${open.filter(taskIsDoing).length} 项 · 逾期 ${overdue.length} 项 · 今天到期 ${todayDue.length} 项</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="blk stu-card">
        <h4>今天必须处理</h4>
        ${[
          ...overdue.slice(0, 4).map(t => `<div class="stu-row"><span class="pill" style="color:var(--danger)">逾期</span><span style="flex:1">${esc(t.title)}</span><span class="s mono" style="color:var(--tx3)">${fmtMD(t.due)}</span></div>`),
          ...todayDue.filter(t => !overdue.includes(t)).slice(0, 4).map(t => `<div class="stu-row"><span class="pill">今天</span><span style="flex:1">${esc(t.title)}</span><span class="s" style="color:var(--tx3)">${esc(subName(t.subsystemId))}</span></div>`),
          ...urgent.slice(0, 3).map(t => `<div class="stu-row"><span class="pill" style="color:var(--warn)">加急</span><span style="flex:1">${esc(t.title)}</span></div>`),
          ...lateBom.slice(0, 3).map(b => `<div class="stu-row"><span class="pill" style="color:var(--danger)">物料</span><span style="flex:1">${esc(b.name)} 到货晚于需要日</span><span class="s mono" style="color:var(--tx3)">${fmtMD(b.etaAt || b.needAt)}</span></div>`),
          ...failRuns.slice(0, 3).map(({ t, last }) => `<div class="stu-row"><span class="pill" style="color:var(--danger)">试跑失败</span><span style="flex:1">${esc(t.title)}</span><span class="s" style="color:var(--tx3)">${esc(last.ver || '')}</span></div>`),
          ...blocked.slice(0, 3).map(t => `<div class="stu-row"><span class="pill" style="color:var(--warn)">卡 ${diffDays(t.statusAt, t0)} 天</span><span style="flex:1">${esc(t.title)}</span></div>`),
          ...gateSoon.slice(0, 2).map(g => `<div class="stu-row"><span class="pill">阶段门</span><span style="flex:1">${esc(g.name)} 还有 ${gatePct(g)}% 条件未过</span><span class="s mono" style="color:var(--tx3)">${fmtMD(g.due)}</span></div>`),

      <div class="blk stu-card">
        <h4>这周不做什么 <span class="s" style="color:var(--tx3);font-weight:500">Stop-doing</span></h4>
        <div style="display:flex;flex-direction:column;gap:2px">
          ${stops.map(s => `<div class="eng-line"><input type="checkbox" data-stop-check="${s.id}" ${s.done ? 'checked' : ''}><span class="${s.done ? 'done' : ''}" style="flex:1">${esc(s.text)}</span><button class="iconbtn" data-stop-del="${s.id}">×</button></div>`).join('') || '<div class="s" style="color:var(--tx3)">复盘时把"停止做"的事记到这里</div>'}
        </div>

          每日 10 分钟 · 站会（这页投屏）<br>
          周三 · 看缓冲消耗，不对就砍范围<br>
          周五 · 归档 + 复盘三问<br>
          赛前 T−7 · 冻结，只修 bug
        </div>
      </div>
    </div>
  </div>`;

  v.onclick = e => {
    if (e.target.closest('#stopAdd')) {
      const inp = v.querySelector('#stopNew');
      const txt = (inp.value || '').trim();
      if (!txt) return;
      state.stopDoing.unshift({ id: uid('sd'), text: txt, done: false, at: today() });
      commit('已加入 Stop-doing'); renderStage(); return;
    }
    const del = e.target.closest('[data-stop-del]');
    if (del) { state.stopDoing = state.stopDoing.filter(x => x.id !== del.dataset.stopDel); commit('已删除'); renderStage(); }
  };
  v.onchange = e => {
    const el = e.target;
    if (el.dataset.stopCheck) {
      const s = byId(state.stopDoing, el.dataset.stopCheck);
      if (s) { s.done = el.checked; save(); renderStage(); }
    }
  };
}

/* ---------------- CSV 导入（BOM / 接口） ---------------- */
function csvParse(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n').filter(l => l.trim());
  const sep = lines[0] && lines[0].includes('\t') ? '\t' : ',';
  return lines.map(l => l.split(sep).map(s => s.trim()));
}
function csvPick(head, keys) {
  const h = head.map(s => String(s).toLowerCase());
  for (const k of keys) {
    const i = h.findIndex(x => x.includes(k));
    if (i >= 0) return i;
  }
  return -1;
}
function csvDate(s) {
  const t = String(s || '').trim();
  if (!t) return '';
  const m = t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
  const m2 = t.match(/^(\d{1,2})[-/.](\d{1,2})$/);
  if (m2) return `${new Date().getFullYear()}-${String(m2[1]).padStart(2, '0')}-${String(m2[2]).padStart(2, '0')}`;
  return '';
}
function csvImport(kind) {
  const isBom = kind === 'bom';
  const sample = isBom
    ? '物料,数量,子系统,下单,到货,需要,状态\nGM6020 电机,4,底盘,2026/11/1,2026/12/5,2026/11/25,待下单'
    : '接口,甲方,乙方,负责人,冻结日,状态\n底盘-电控 CAN,电控,底盘,王控,2026/11/20,草案';
  const body = `
    <div class="field full"><label>从 Excel 复制粘贴（第一行是表头；逗号或 Tab 分隔）</label>
      <textarea id="csvText" style="height:150px;font-family:var(--mono);font-size:11.5px" placeholder="${esc(sample)}"></textarea></div>
    <p class="s" style="color:var(--tx3);margin:0 0 8px">${isBom
      ? '列：物料、数量、子系统、下单、到货、需要、状态（缺列可少，系统按表头名字匹配）'
      : '列：接口、甲方、乙方、负责人、冻结日、状态（名字按成员/子系统名匹配）'}</p>
    <div id="csvPrev" class="s" style="color:var(--tx2)"></div>`;
  modal(isBom ? '粘贴导入 · 物料 BOM' : '粘贴导入 · 接口表', body,
    `<span class="sp"></span><button class="btn" data-close>取消</button><button class="btn primary" id="csvGo">解析并导入</button>`,
    (m, closeFn) => {
      const run = () => {
        const rows = csvParse(m.querySelector('#csvText').value);
        if (rows.length < 2) return toast('至少要表头 + 一行数据', true);
        const head = rows[0].map(s => s.toLowerCase());
        let n = 0;
        for (const r of rows.slice(1)) {
          if (!r.some(Boolean)) continue;
          if (isBom) {
            const name = r[csvPick(head, ['物料', '名称', 'name'])] || '';
            if (!name) continue;
            const subName = r[csvPick(head, ['子系统', 'sub'])] || '';
            const sub = state.subsystems.find(s => s.name.includes(subName) || subName.includes(s.name));
            state.bom.push({
              id: uid('bm'), name, qty: Number(r[csvPick(head, ['数量', 'qty'])]) || 1,
              subsystemId: sub?.id || '', orderAt: csvDate(r[csvPick(head, ['下单', 'order'])]),
              etaAt: csvDate(r[csvPick(head, ['到货', 'eta'])]), needAt: csvDate(r[csvPick(head, ['需要', 'need'])]),
              status: (r[csvPick(head, ['状态', 'status'])] || '待下单').trim(),
            });
            n++;
          } else {
            const title = r[csvPick(head, ['接口', '名称', 'title'])] || '';
            if (!title) continue;
            const memName = r[csvPick(head, ['负责人', 'owner'])] || '';
            const mem = state.members.find(x => x.name.includes(memName) || memName.includes(x.name));
            state.interfaces.push({
              id: uid('ic'), title, partyA: r[csvPick(head, ['甲方', 'a'])] || '',
              partyB: r[csvPick(head, ['乙方', 'b'])] || '', ownerId: mem?.id || '',
              freezeAt: csvDate(r[csvPick(head, ['冻结', 'freeze'])]),
              status: (r[csvPick(head, ['状态', 'status'])] || '草案').trim(),
            });
            n++;
          }
        }
        commit(`CSV 导入 ${n} 条`);
        closeFn(); renderStage(); toast(`已导入 ${n} 条`);
      };
      m.querySelector('#csvGo').onclick = run;
    });
}
